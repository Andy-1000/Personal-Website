<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reflections · Andy's 21st</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, nocache">
<meta name="googlebot" content="noindex, nofollow, noimageindex, nosnippet, noarchive">
<meta name="bingbot" content="noindex, nofollow, noarchive, nocache">
<!-- AI / dataset opt-out signals -->
<meta name="robots" content="noai, noimageai">
<meta name="ai" content="noai, noimageai">
<meta name="GPTBot" content="noindex, nofollow">
<meta name="ClaudeBot" content="noindex, nofollow">
<meta name="Google-Extended" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<!-- no og:/twitter: tags on purpose, same as /21st -->
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,400&family=Montserrat:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
<style>
  /* palette and type are lifted straight from /21st so the two pages read
     as one party */
  :root {
    --blue: #004d99;
    --navy: #003366;
    --sky: #cce6ff;
    --sky-soft: #e9f3ff;
    --paper: #fdfbf6;
    --ink: #12233b;

    --gold: #e8a921;
    --gold-soft: #f7d98b;
    --coral: #ff6f59;
    --teal: #2a9d8f;
    --plum: #7b5ea7;

    --display: "Merriweather", Georgia, serif;
    --body: "Montserrat", "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background:
      radial-gradient(900px 380px at 50% -140px, var(--sky-soft) 0%, transparent 72%) no-repeat,
      var(--paper);
    color: var(--ink);
    font-family: var(--body);
    overflow-x: hidden;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  ::selection { color: #fff; background: var(--blue); }
  img { max-width: 100%; display: block; }
  [hidden] { display: none !important; }

  /* ================= HERO ================= */
  .hero {
    position: relative;
    padding: calc(2.8rem + env(safe-area-inset-top)) 1.1rem 1.6rem;
    text-align: center;
    overflow: hidden;
  }

  .hero-inner { position: relative; z-index: 2; max-width: 520px; margin: 0 auto; }

  .hero h1 {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(2.9rem, 14vw, 4.6rem);
    line-height: 1.12;
    color: var(--blue);
    margin: 0;
    letter-spacing: 0.01em;
    text-shadow: 4px 4px 0 var(--gold-soft);
  }

  .confetti-layer {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
  }

  .confetti {
    position: absolute;
    top: -4vh;
    border-radius: 2px;
    opacity: 0.85;
    animation: confetti-fall linear infinite;
  }

  @keyframes confetti-fall {
    0% { transform: translateY(-5vh) rotate(0deg); }
    100% { transform: translateY(60vh) rotate(520deg); }
  }

  /* ================= FORM ================= */
  .compose {
    max-width: 460px;
    margin: 0 auto;
    padding: 1.4rem 1rem 4.5rem;
  }

  .step-label {
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-size: 0.68rem;
    color: var(--gold);
    margin: 0 0 0.45rem;
    padding-left: 0.2em;
    display: block;
  }

  /* ---- the polaroid: camera, preview and finished photo all live in it ---- */
  .polaroid {
    width: min(84%, 330px);
    margin: 0.6rem auto 0;
    background: #fff;
    padding: 9px 9px 0;
    border-radius: 3px;
    box-shadow: 0 16px 32px -14px rgba(0, 35, 70, 0.45);
    transform: rotate(-1.6deg);
  }

  .lens {
    position: relative;
    aspect-ratio: 4 / 5;
    background: var(--sky-soft);
    border-radius: 1px;
    overflow: hidden;
  }

  .lens video, .lens img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* the live feed is mirrored so it behaves like a mirror; the saved photo
     is mirrored the same way, so what you saw is what gets sent */
  .lens video { transform: scaleX(-1); }

  .lens-idle {
    position: absolute;
    inset: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.7rem;
    border: none;
    background:
      repeating-linear-gradient(-45deg, transparent 0 14px, rgba(0, 77, 153, 0.035) 14px 28px),
      var(--sky-soft);
    color: var(--blue);
    font-family: var(--body);
    font-weight: 700;
    font-size: 0.78rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .lens-idle svg { width: 54px; height: 54px; transition: transform 0.2s ease; }
  .lens-idle:hover svg { transform: scale(1.08) rotate(-4deg); }
  .lens-idle:focus-visible { outline: 3px solid var(--blue); outline-offset: -3px; }

  .lens-msg {
    position: absolute;
    left: 0.8rem;
    right: 0.8rem;
    bottom: 0.8rem;
    margin: 0;
    font-size: 0.8rem;
    font-weight: 600;
    line-height: 1.45;
    text-align: center;
    color: var(--navy);
    background: rgba(255, 255, 255, 0.92);
    border-radius: 10px;
    padding: 0.55rem 0.7rem;
  }

  .lens-count {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--display);
    font-size: 7rem;
    color: #fff;
    text-shadow: 4px 4px 0 var(--blue);
    pointer-events: none;
  }

  .lens-count.tick { animation: tick 0.8s ease-out; }

  @keyframes tick {
    0% { transform: scale(1.5); opacity: 0; }
    25% { transform: scale(1); opacity: 1; }
    100% { transform: scale(0.85); opacity: 0.2; }
  }

  .lens-flash {
    position: absolute;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
  }

  .lens-flash.go { animation: flash 0.5s ease-out; }

  @keyframes flash {
    0% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* the caption strip writes itself as you type your name, like the
     captions under every photo on /21st */
  .polaroid figcaption {
    font-family: var(--body);
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--ink);
    text-align: center;
    line-height: 1.3;
    padding: 0.6rem 0.3rem 0.75rem;
    min-height: 2.6rem;
    overflow-wrap: anywhere;
  }

  /* which bits of the lens show depends on the camera's state */
  .polaroid[data-mode="idle"] video,
  .polaroid[data-mode="idle"] .lens img,
  .polaroid[data-mode="starting"] .lens img,
  .polaroid[data-mode="live"] .lens img,
  .polaroid[data-mode="live"] .lens-idle,
  .polaroid[data-mode="starting"] .lens-idle,
  .polaroid[data-mode="captured"] video,
  .polaroid[data-mode="captured"] .lens-idle { display: none; }

  .cam-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.7rem;
    min-height: 76px;
    margin-top: 1.1rem;
    flex-wrap: wrap;
  }

  .pill {
    font-family: var(--body);
    font-weight: 700;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--blue);
    background: transparent;
    border: 2px solid rgba(0, 77, 153, 0.35);
    border-radius: 999px;
    padding: 0.62rem 1.3rem 0.56rem;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, transform 0.15s;
    -webkit-tap-highlight-color: transparent;
  }

  .pill:hover { border-color: var(--blue); background: rgba(0, 77, 153, 0.07); transform: translateY(-1px); }

  .pill.solid { background: var(--blue); color: #fff; border-color: var(--blue); box-shadow: 0 4px 0 var(--navy); }
  .pill.solid:hover { background: var(--navy); border-color: var(--navy); transform: translateY(2px); box-shadow: 0 2px 0 #001f3d; }

  .shutter {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: 4px solid var(--navy);
    background: #fff;
    box-shadow: 0 5px 0 var(--sky), inset 0 0 0 4px #fff, inset 0 0 0 30px var(--gold);
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .shutter:hover { transform: scale(1.05); }
  .shutter:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--sky), inset 0 0 0 4px #fff, inset 0 0 0 30px var(--gold); }
  .shutter:disabled { opacity: 0.5; cursor: default; }

  /* ---- fields ---- */
  .field { margin-top: 1.9rem; }

  .field input, .field textarea {
    display: block;
    width: 100%;
    font-family: var(--body);
    font-weight: 500;
    font-size: 1rem;           /* 16px+ stops iOS zooming into the field */
    line-height: 1.6;
    color: var(--ink);
    background: #fff;
    border: 2px solid var(--navy);
    border-radius: 12px;
    padding: 0.75rem 0.9rem;
    box-shadow: 0 4px 0 var(--sky);
    transition: border-color 0.15s, box-shadow 0.15s;
    -webkit-appearance: none;
    appearance: none;
  }

  .field textarea { min-height: 9.5rem; resize: vertical; }

  .field input::placeholder, .field textarea::placeholder { color: rgba(18, 35, 59, 0.38); }

  .field input:focus, .field textarea:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 4px 0 var(--gold-soft);
  }

  .field.bad input, .field.bad textarea { border-color: var(--coral); box-shadow: 0 4px 0 rgba(255, 111, 89, 0.3); }

  .field-foot {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    margin-top: 0.55rem;
    font-size: 0.76rem;
    font-weight: 600;
    min-height: 1.2em;
  }

  .field-err { color: #d2452f; }
  .field-count { color: rgba(0, 51, 102, 0.55); font-variant-numeric: tabular-nums; margin-left: auto; }
  .field-count.near { color: #d2452f; }

  .photo-err { text-align: center; color: #d2452f; font-size: 0.8rem; font-weight: 600; margin: 0.3rem 0 0; min-height: 1.2em; }

  .send-btn {
    display: block;
    width: 100%;
    margin-top: 1.6rem;
    background: var(--blue);
    color: #fff;
    font-family: var(--body);
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-size: 0.9rem;
    padding: 0.95rem 1rem 0.85rem 1.22rem;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 6px 0 var(--navy);
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, opacity 0.2s;
  }

  .send-btn:hover { background: var(--navy); transform: translateY(3px); box-shadow: 0 3px 0 #001f3d; }
  .send-btn:active { transform: translateY(6px); box-shadow: 0 0 0 var(--navy); }
  .send-btn:disabled { opacity: 0.6; cursor: progress; transform: none; box-shadow: 0 6px 0 var(--navy); }

  .fine {
    text-align: center;
    font-size: 0.76rem;
    color: rgba(18, 35, 59, 0.55);
    margin: 1.4rem 0 0;
    line-height: 1.55;
  }

  /* ================= THANK YOU ================= */
  .thanks {
    max-width: 460px;
    margin: 0 auto;
    padding: 0.4rem 1rem 4.5rem;
    text-align: center;
  }

  .thanks h2 {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(1.9rem, 7.4vw, 2.5rem);
    line-height: 1.3;
    color: var(--navy);
    margin: 0 0 0.3rem;
    overflow-wrap: anywhere;
  }

  .thanks .lead { margin: 0 0 1.2rem; color: #2b3540; }

  .thanks .polaroid { transform: rotate(1.8deg); animation: drop-in 0.7s cubic-bezier(0.2, 0.7, 0.3, 1); }

  @keyframes drop-in {
    0% { transform: rotate(-6deg) translateY(-30px) scale(0.92); opacity: 0; }
    100% { transform: rotate(1.8deg); opacity: 1; }
  }

  .note {
    margin: 1.9rem auto 0;
    background: #fff;
    border-left: 4px solid var(--gold);
    border-radius: 4px 12px 12px 4px;
    box-shadow: 0 10px 24px -14px rgba(0, 35, 70, 0.4);
    padding: 1rem 1.15rem;
    text-align: left;
    font-family: var(--display);
    font-style: italic;
    font-size: 0.98rem;
    line-height: 1.75;
    color: var(--ink);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .preview-flag {
    margin: 1.4rem auto 0;
    max-width: 360px;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--navy);
    background: var(--sky-soft);
    border: 1.5px dashed rgba(0, 77, 153, 0.35);
    border-radius: 12px;
    padding: 0.6rem 0.9rem;
    line-height: 1.5;
  }

  .thanks .pill { margin-top: 1.8rem; }

  /* ================= TOAST + POPS ================= */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(1.4rem + env(safe-area-inset-bottom));
    transform: translate(-50%, 18px);
    background: var(--navy);
    color: #fff;
    font-weight: 600;
    font-size: 0.9rem;
    padding: 0.8rem 1.3rem;
    border-radius: 12px;
    box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.45);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
    z-index: 100;
    width: max-content;
    max-width: 86vw;
    text-align: center;
  }

  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .pop-layer { position: fixed; inset: 0; z-index: 300; pointer-events: none; overflow: hidden; }
  .pop { position: absolute; top: 0; left: 0; will-change: transform, opacity; }

  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    border: 0;
  }

  @media (min-width: 700px) {
    .hero { padding-top: 4.6rem; }
    .send-btn { width: auto; display: block; margin-inline: auto; padding-inline: 3.2rem 3.42rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .confetti { animation: none !important; display: none; }
    .lens-count.tick, .lens-flash.go, .thanks .polaroid { animation: none; }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <h1>Reflections</h1>
  </div>
</header>

<main>
  <form class="compose" id="compose" novalidate>
    <span class="step-label" id="photoLabel">Your selfie</span>
    <figure class="polaroid" id="camFrame" data-mode="idle" aria-labelledby="photoLabel">
      <div class="lens">
        <button class="lens-idle" type="button" id="lensIdle">
          <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
            <rect x="6" y="16" width="52" height="38" rx="8" stroke="currentColor" stroke-width="3.5"/>
            <path d="M22 16l4-7h12l4 7" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/>
            <circle cx="32" cy="35" r="10" stroke="currentColor" stroke-width="3.5"/>
            <circle cx="48" cy="25" r="2.4" fill="#e8a921"/>
          </svg>
          <span>Tap to open the camera</span>
        </button>
        <video id="camVideo" playsinline muted autoplay></video>
        <img id="camShot" alt="">
        <div class="lens-count" id="lensCount" aria-hidden="true"></div>
        <div class="lens-flash" id="lensFlash"></div>
        <p class="lens-msg" id="lensMsg" hidden></p>
      </div>
      <figcaption id="frameCaption"></figcaption>
    </figure>
    <p class="photo-err" id="photoErr" role="alert"></p>

    <div class="cam-controls" id="ctlIdle">
      <button class="pill solid" type="button" id="openCam">Open camera</button>
      <button class="pill" type="button" id="uploadBtn">Upload a photo</button>
    </div>
    <div class="cam-controls" id="ctlLive" hidden>
      <button class="pill" type="button" id="cancelCam">Cancel</button>
      <button class="shutter" type="button" id="shutter" aria-label="Take the photo (3 second timer)"></button>
      <button class="pill" type="button" id="instantBtn" aria-label="Take the photo now">Now</button>
    </div>
    <div class="cam-controls" id="ctlDone" hidden>
      <button class="pill" type="button" id="retake">Retake</button>
    </div>
    <input type="file" id="fileInput" accept="image/*" capture="user" class="sr-only" tabindex="-1" aria-hidden="true">

    <div class="field" id="nameField">
      <label class="step-label" for="name">Your name</label>
      <input id="name" name="name" type="text" maxlength="60" autocomplete="name" autocapitalize="words" placeholder="So Andy knows who to thank">
      <div class="field-foot"><span class="field-err" id="nameErr"></span></div>
    </div>

    <div class="field" id="msgField">
      <label class="step-label" for="message">Your message</label>
      <textarea id="message" name="message" maxlength="1200" placeholder="Happy 21st, Andy! Remember when…"></textarea>
      <div class="field-foot"><span class="field-err" id="msgErr"></span><span class="field-count" id="msgCount">0 / 1200</span></div>
    </div>

    <!-- left empty by people, filled in by spam bots -->
    <div class="hp" aria-hidden="true">
      <label for="website">Website</label>
      <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
    </div>

    <button class="send-btn" type="submit" id="sendBtn">Send reflection</button>
    <p class="fine">Your photo and message go to Andy and may pop up on the slideshow at the party. They won't be posted anywhere public.</p>
  </form>

  <section class="thanks" id="thanks" hidden aria-live="polite">
    <h2 id="thanksTitle">Thank you!</h2>
    <p class="lead">Here's what you left for Andy.</p>
    <figure class="polaroid">
      <div class="lens"><img id="thanksShot" alt="Your selfie"></div>
      <figcaption id="thanksCaption"></figcaption>
    </figure>
    <p class="note" id="thanksNote"></p>
    <p class="preview-flag" id="previewFlag" hidden>Heads up: the guestbook isn't switched on yet, so this one was a practice run and wasn't saved.</p>
    <button class="pill solid" type="button" id="another">Leave another</button>
  </section>
</main>

<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  "use strict";

  /* ================= CONFIG ================= */

  // Where reflections are sent. Left empty, the page runs in preview mode:
  // everything works end to end, but nothing is saved.
  //
  // The endpoint receives a multipart/form-data POST with three fields:
  //   name     text, up to 60 characters
  //   message  text, up to 1200 characters
  //   photo    image/jpeg file, 1080 x 1350
  //   website  honeypot, empty unless a bot filled it in
  // and should answer with any 2xx status once it has stored them, or an
  // error status with {"error": "..."} worded for the guest to read.
  // The server lives in its own repo: Andy-1000/reflections-api.
  var SUBMIT_URL = "";

  var PHOTO_W = 1080;
  var PHOTO_H = 1350;
  var MSG_MAX = 1200;

  /* ================= ELEMENTS ================= */

  function $(id) { return document.getElementById(id); }

  var form = $("compose");
  var frame = $("camFrame");
  var video = $("camVideo");
  var shot = $("camShot");
  var lensMsg = $("lensMsg");
  var lensCount = $("lensCount");
  var lensFlash = $("lensFlash");
  var caption = $("frameCaption");
  var fileInput = $("fileInput");
  var nameInput = $("name");
  var msgInput = $("message");
  var msgCount = $("msgCount");
  var sendBtn = $("sendBtn");
  var shutter = $("shutter");

  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var stream = null;
  var photoBlob = null;
  var photoUrl = null;
  var counting = false;

  /* ================= TOAST ================= */

  var toast = $("toast");
  var toastTimer;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 3600);
  }

  /* ================= CAMERA ================= */

  function setMode(mode) {
    frame.setAttribute("data-mode", mode);
    $("ctlIdle").hidden = mode !== "idle";
    $("ctlLive").hidden = mode !== "live" && mode !== "starting";
    $("ctlDone").hidden = mode !== "captured";
    shutter.disabled = mode !== "live";
    $("instantBtn").disabled = mode !== "live";
  }

  function say(msg) {
    lensMsg.textContent = msg || "";
    lensMsg.hidden = !msg;
  }

  function canUseCamera() {
    return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  }

  function openCamera() {
    $("photoErr").textContent = "";
    // no camera API (old browser, or not https): the file picker's
    // capture="user" still opens the front camera on phones
    if (!canUseCamera()) { fileInput.click(); return; }

    setMode("starting");
    say("Starting the camera…");
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 1440 }, height: { ideal: 1440 } },
      audio: false
    }).then(function (s) {
      stream = s;
      video.srcObject = s;
      return video.play();
    }).then(function () {
      say("");
      setMode("live");
    }).catch(function (err) {
      stopCamera();
      setMode("idle");
      var name = err && err.name;
      if (name === "NotAllowedError" || name === "SecurityError") {
        say("The camera is blocked. Allow it for this site in your browser settings, or upload a photo instead.");
      } else if (name === "NotFoundError" || name === "OverconstrainedError") {
        say("No camera found on this device. Upload a photo instead.");
      } else if (name === "NotReadableError") {
        say("Another app is using the camera. Close it and try again, or upload a photo.");
      } else {
        say("The camera wouldn't start. Try again, or upload a photo instead.");
      }
    });
  }

  function stopCamera() {
    if (stream) {
      stream.getTracks().forEach(function (t) { t.stop(); });
      stream = null;
    }
    video.srcObject = null;
  }

  // Draws `src` into a PHOTO_W x PHOTO_H canvas, cropped to fill.
  // `biasY` places the vertical crop (0 = keep the top, 0.5 = centre);
  // faces sit high in most uploaded photos, so uploads keep a bit more top.
  function cropToCanvas(src, sw, sh, mirror, biasY) {
    var canvas = document.createElement("canvas");
    canvas.width = PHOTO_W;
    canvas.height = PHOTO_H;
    var ctx = canvas.getContext("2d");
    var scale = Math.max(PHOTO_W / sw, PHOTO_H / sh);
    var cw = PHOTO_W / scale;
    var ch = PHOTO_H / scale;
    var cx = (sw - cw) / 2;
    var cy = (sh - ch) * biasY;
    if (mirror) {
      ctx.translate(PHOTO_W, 0);
      ctx.scale(-1, 1);
    }
    ctx.drawImage(src, cx, cy, cw, ch, 0, 0, PHOTO_W, PHOTO_H);
    return canvas;
  }

  function usePhoto(canvas) {
    canvas.toBlob(function (blob) {
      if (!blob) { say("That photo didn't take. Try again."); setMode("idle"); return; }
      photoBlob = blob;
      if (photoUrl) URL.revokeObjectURL(photoUrl);
      photoUrl = URL.createObjectURL(blob);
      shot.src = photoUrl;
      shot.alt = "Your selfie";
      say("");
      $("photoErr").textContent = "";
      setMode("captured");
    }, "image/jpeg", 0.86);
  }

  function capture() {
    if (!stream || !video.videoWidth) return;
    if (!reduceMotion) {
      lensFlash.classList.remove("go");
      void lensFlash.offsetWidth;
      lensFlash.classList.add("go");
    }
    var canvas = cropToCanvas(video, video.videoWidth, video.videoHeight, true, 0.5);
    stopCamera();
    usePhoto(canvas);
  }

  // 3-2-1 so there's time to put the phone at arm's length and smile
  function countdown() {
    if (counting || frame.getAttribute("data-mode") !== "live") return;
    counting = true;
    shutter.disabled = true;
    var n = 3;
    (function step() {
      if (!stream) { counting = false; lensCount.textContent = ""; return; }
      if (n === 0) {
        lensCount.textContent = "";
        counting = false;
        capture();
        return;
      }
      lensCount.textContent = n;
      lensCount.classList.remove("tick");
      void lensCount.offsetWidth;
      lensCount.classList.add("tick");
      n--;
      setTimeout(step, 800);
    })();
  }

  function retake() {
    photoBlob = null;
    shot.removeAttribute("src");
    openCamera();
  }

  $("lensIdle").addEventListener("click", openCamera);
  $("openCam").addEventListener("click", openCamera);
  $("uploadBtn").addEventListener("click", function () { fileInput.click(); });
  shutter.addEventListener("click", countdown);
  $("instantBtn").addEventListener("click", function () { if (!counting) capture(); });
  $("cancelCam").addEventListener("click", function () {
    counting = false;
    lensCount.textContent = "";
    stopCamera();
    say("");
    setMode(photoBlob ? "captured" : "idle");
  });
  $("retake").addEventListener("click", retake);

  fileInput.addEventListener("change", function () {
    var file = fileInput.files && fileInput.files[0];
    fileInput.value = "";
    if (!file) return;
    stopCamera();
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      // browsers apply the photo's EXIF rotation when drawing an <img>
      usePhoto(cropToCanvas(img, img.naturalWidth, img.naturalHeight, false, 0.35));
      URL.revokeObjectURL(url);
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      setMode(photoBlob ? "captured" : "idle");
      say("That file couldn't be opened. Try a JPEG or PNG photo.");
    };
    img.src = url;
  });

  // let the camera go when the page is put away; tapping again restarts it
  document.addEventListener("visibilitychange", function () {
    if (document.hidden && stream) {
      counting = false;
      lensCount.textContent = "";
      stopCamera();
      setMode(photoBlob ? "captured" : "idle");
    }
  });

  /* ================= FIELDS ================= */

  function syncCaption() {
    caption.textContent = nameInput.value.trim();
  }

  function syncCount() {
    var len = msgInput.value.length;
    msgCount.textContent = len + " / " + MSG_MAX;
    msgCount.classList.toggle("near", len > MSG_MAX - 100);
  }

  nameInput.addEventListener("input", function () {
    syncCaption();
    $("nameField").classList.remove("bad");
    $("nameErr").textContent = "";
  });

  msgInput.addEventListener("input", function () {
    syncCount();
    $("msgField").classList.remove("bad");
    $("msgErr").textContent = "";
  });

  syncCaption();
  syncCount();

  /* ================= SEND ================= */

  function validate() {
    var first = null;
    if (!photoBlob) {
      $("photoErr").textContent = "Snap a selfie first.";
      first = first || frame;
    }
    if (!nameInput.value.trim()) {
      $("nameField").classList.add("bad");
      $("nameErr").textContent = "Add your name so Andy knows who it's from.";
      first = first || nameInput;
    }
    if (!msgInput.value.trim()) {
      $("msgField").classList.add("bad");
      $("msgErr").textContent = "Write Andy a few words.";
      first = first || msgInput;
    }
    if (first) {
      first.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "center" });
      if (first.focus && first !== frame) first.focus({ preventScroll: true });
      return false;
    }
    return true;
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (sendBtn.disabled || !validate()) return;

    var name = nameInput.value.trim();
    var message = msgInput.value.trim();

    sendBtn.disabled = true;
    sendBtn.textContent = "Sending…";

    var sending;
    if (!SUBMIT_URL) {
      sending = new Promise(function (resolve) { setTimeout(resolve, 900); });
    } else {
      var fd = new FormData();
      fd.append("name", name);
      fd.append("message", message);
      fd.append("photo", photoBlob, "selfie.jpg");
      fd.append("website", $("website").value);
      // party Wi-Fi can be slow, but don't leave a guest staring at "Sending…"
      var ctl = window.AbortController ? new AbortController() : null;
      var killer = ctl && setTimeout(function () { ctl.abort(); }, 45000);
      sending = fetch(SUBMIT_URL, { method: "POST", body: fd, signal: ctl && ctl.signal }).then(function (r) {
        clearTimeout(killer);
        if (r.ok) return;
        // the server words its refusals for guests; show them as they are
        return r.json().catch(function () { return {}; }).then(function (body) {
          var err = new Error("HTTP " + r.status);
          err.guestMessage = body && body.error;
          throw err;
        });
      });
    }

    sending.then(function () {
      showThanks(name, message, !SUBMIT_URL);
    }).catch(function (err) {
      showToast((err && err.guestMessage) || "That didn't send. Check your connection and try again.");
    }).then(function () {
      sendBtn.disabled = false;
      sendBtn.textContent = "Send reflection";
    });
  });

  function showThanks(name, message, preview) {
    stopCamera();
    $("thanksTitle").textContent = "Thank you, " + name.split(/\s+/)[0] + "!";
    $("thanksShot").src = photoUrl;
    $("thanksCaption").textContent = name;
    $("thanksNote").textContent = message;
    $("previewFlag").hidden = !preview;
    form.hidden = true;
    $("thanks").hidden = false;
    window.scrollTo({ top: 0, behavior: "auto" });

    var pol = document.querySelector(".thanks .polaroid");
    setTimeout(function () {
      var r = pol.getBoundingClientRect();
      var x = r.left + r.width / 2;
      var y = r.top + r.height * 0.4;
      burst(x - r.width * 0.3, y, { n: 26, arc: [-Math.PI * 0.95, Math.PI * 0.6] });
      burst(x + r.width * 0.3, y, { n: 26, arc: [-Math.PI * 0.65, Math.PI * 0.6] });
    }, 350);
  }

  $("another").addEventListener("click", function () {
    photoBlob = null;
    if (photoUrl) { URL.revokeObjectURL(photoUrl); photoUrl = null; }
    shot.removeAttribute("src");
    $("thanksShot").removeAttribute("src");
    nameInput.value = "";
    msgInput.value = "";
    syncCaption();
    syncCount();
    say("");
    setMode("idle");
    $("thanks").hidden = true;
    form.hidden = false;
    window.scrollTo({ top: 0, behavior: "auto" });
  });

  /* ================= CONFETTI ================= */

  var COLOURS = ["#004d99", "#e8a921", "#ff6f59", "#2a9d8f", "#cce6ff", "#7b5ea7", "#f7d98b"];

  if (!reduceMotion) {
    var hero = document.querySelector(".hero");
    var layer = document.createElement("div");
    layer.className = "confetti-layer";
    layer.setAttribute("aria-hidden", "true");
    hero.appendChild(layer);
    for (var c = 0; c < 34; c++) {
      var s = document.createElement("span");
      s.className = "confetti";
      var size = 5 + Math.random() * 7;
      s.style.width = size + "px";
      s.style.height = size * (0.35 + Math.random() * 0.85) + "px";
      s.style.left = Math.random() * 100 + "%";
      s.style.background = COLOURS[c % COLOURS.length];
      if (c % 3 === 0) s.style.borderRadius = "50%";
      s.style.animationDuration = (5 + Math.random() * 7) + "s";
      s.style.animationDelay = (-Math.random() * 12) + "s";
      layer.appendChild(s);
    }
  }

  // the same click-burst physics as /21st, trimmed to what this page uses
  var popLayer = document.createElement("div");
  popLayer.className = "pop-layer";
  popLayer.setAttribute("aria-hidden", "true");
  document.body.appendChild(popLayer);

  var pops = [];
  var popRunning = false;

  function popFrame() {
    var alive = 0;
    for (var i = 0; i < pops.length; i++) {
      var q = pops[i];
      if (!q.el) continue;
      q.life += 1;
      q.vy += 0.42;
      q.vx *= 0.985;
      q.x += q.vx;
      q.y += q.vy;
      q.spin += q.dSpin;
      var fade = 1 - q.life / q.max;
      if (fade <= 0) {
        popLayer.removeChild(q.el);
        q.el = null;
        continue;
      }
      q.el.style.opacity = fade;
      q.el.style.transform =
        "translate(" + q.x.toFixed(1) + "px," + q.y.toFixed(1) + "px) rotate(" + q.spin.toFixed(0) + "deg)";
      alive++;
    }
    if (alive) {
      requestAnimationFrame(popFrame);
    } else {
      pops = [];
      popRunning = false;
    }
  }

  function burst(x, y, o) {
    if (reduceMotion) return;
    var n = o.n || 20;
    for (var i = 0; i < n; i++) {
      var el = document.createElement("span");
      el.className = "pop";
      var size = 5 + Math.random() * 7;
      el.style.width = size + "px";
      el.style.height = size * (0.45 + Math.random() * 0.75) + "px";
      el.style.background = COLOURS[(Math.random() * COLOURS.length) | 0];
      if (i % 3 === 0) el.style.borderRadius = "50%";
      popLayer.appendChild(el);
      var angle = o.arc[0] + o.arc[1] * (i / n) + Math.random() * 0.12;
      var speed = 4.5 + Math.random() * 6;
      pops.push({
        el: el, x: x, y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 3.4,
        spin: Math.random() * 360,
        dSpin: (Math.random() - 0.5) * 26,
        life: 0,
        max: 60 + Math.random() * 30
      });
    }
    if (!popRunning) {
      popRunning = true;
      requestAnimationFrame(popFrame);
    }
  }

  setMode("idle");
})();
</script>
</body>
</html>
