        var start = x0 + (colW - blockW) / 2;
        b.items.forEach(function (a, k) {
          var c = k % perRow, r = Math.floor(k / perRow);
          pos[a.i] = { x: start + c * (t + g), y: baseY - (r + 1) * (th + g) + g, t: t, d: x0 / W };
        });
        var stackRows = Math.ceil(b.items.length / perRow);
        var cx = x0 + colW / 2;

        if (hist) {
          labels.push({ kind: "bin", mode: mode, key: b.key, x: cx, y: baseY + 9, cls: "center" });
          if (countEveryBin && b.items.length) labels.push({ kind: "text", text: b.items.length, x: cx, y: baseY - stackRows * (th + g) - 13, cls: "center count" });
          else if (!countEveryBin && b.items.length === maxCount) labels.push({ kind: "text", text: b.items.length, x: cx, y: baseY - stackRows * (th + g) - 13, cls: "center peak" });
        } else {
          if (b.key % 10 === 0 || i === 0 || i === N - 1) {
            labels.push({ kind: "text", text: b.key, x: cx, y: baseY + 9, cls: "center" + (b.key % 10 === 0 ? "" : " edge") });
          }
          if (b.items.length === maxCount) labels.push({ kind: "text", text: b.items.length, x: cx, y: baseY - stackRows * (th + g) - 13, cls: "center peak" });
        }
      });

      axes.push({ left: 0, top: baseY + 2, width: W, height: 1 });
      axes.push({ left: 0, top: baseY + 2, width: 0, height: 1 });

      // edge-year labels hide when they would collide with a decade label
      labels = labels.filter(function (l) {
        if (!/edge/.test(l.cls || "")) return true;
        return !labels.some(function (o) { return o !== l && !/edge|peak/.test(o.cls || "") && o.y === l.y && Math.abs(o.x - l.x) < 34; });
      });
    } else {
      var labelW = mode === "rating" ? 64 : mode === "director" ? 26 : 42;
      var tail = countEveryBin ? 30 : 26;
      var plotW = W - labelW - tail;
      var rowGap = mode === "rating" ? 9 : mode === "director" ? 5 : 2;
      // Each bin label is a tappable button, so a row has to be at least as tall
      // as one or consecutive labels collide. Year labels are plain text on only
      // a few rows, so they need no minimum.
      var pitch = mode === "rating" ? 26 : mode === "director" ? 20 : 0;
      var budgetV = mode === "rating" ? 460 : mode === "director" ? 580 : 620;
      var cols, R, rowH, gap;

      function fit(tile) {
        g = tile >= 8 ? 2 : 1;
        th = tile * RATIO;
        cols = Math.floor((plotW + g) / (tile + g));
        R = Math.ceil(maxCount / cols);
        rowH = R * (th + g) - g;
        gap = Math.max(rowGap, pitch - rowH);
        H = N * rowH + (N - 1) * gap + 4;
      }

      for (t = 11; t >= 3; t--) {
        fit(t);
        if (H <= budgetV) break;
      }
      if (t < 3) { t = 3; fit(3); }
      rowGap = gap;

      var axisX = labelW;
      B.forEach(function (b, i) {
        var y0 = 2 + i * (rowH + rowGap);
        b.items.forEach(function (a, k) {
          var c = Math.floor(k / R), r = k % R;
          pos[a.i] = { x: axisX + 4 + c * (t + g), y: y0 + r * (th + g), t: t, d: y0 / H };
        });
        // keep the first and last labels from hanging off the ends of the axis
        var cy = Math.min(Math.max(y0 + rowH / 2, 9), H - 9);
        var used = Math.ceil(b.items.length / R);
        if (hist) {
          labels.push({ kind: "bin", mode: mode, key: b.key, x: axisX - 8, y: cy, cls: "right" });
          if (countEveryBin && b.items.length) labels.push({ kind: "text", text: b.items.length, x: axisX + 4 + used * (t + g) + 5, y: cy, cls: "left count" });
          else if (!countEveryBin && b.items.length === maxCount) labels.push({ kind: "text", text: b.items.length, x: axisX + 4 + used * (t + g) + 5, y: cy, cls: "left peak" });
        } else {
          if (b.key % 10 === 0 || i === 0 || i === N - 1) labels.push({ kind: "text", text: b.key, x: axisX - 8, y: cy, cls: "right" + (b.key % 10 === 0 ? "" : " edge") });
          if (b.items.length === maxCount) labels.push({ kind: "text", text: b.items.length, x: axisX + 4 + used * (t + g) + 5, y: cy, cls: "left peak" });
        }
      });

      labels = labels.filter(function (l) {
        if (!/edge/.test(l.cls || "")) return true;
        return !labels.some(function (o) { return o !== l && !/edge|peak|count/.test(o.cls || "") && o.x === l.x && Math.abs(o.y - l.y) < 16; });
      });

      axes.push({ left: axisX, top: 0, width: 1, height: H });
      axes.push({ left: axisX, top: 0, width: 1, height: 0 });
    }

    return { pos: pos, labels: labels, axes: axes, H: Math.ceil(H), W: W, vertical: vertical, hist: hist, t: t, bands: bands };
  }

  var BIN_STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + STAR + '"/></svg>';

  // shift a horizontal layout down so its baseline sits at the bottom of a taller box
  function dropTo(L, H) {
    var dy = H - L.H;
    if (dy <= 0) return L;
    L.pos.forEach(function (p) { p.y += dy; });
    L.labels.forEach(function (l) { l.y += dy; });
    L.axes.forEach(function (a) { a.top += dy; });
    L.H = H;
    return L;
  }

  function drawChart(animate) {
    var L = computeLayout(sortMode);
    // on wide screens every view shares one height, so switching never moves the page
    if (!L.vertical) {
      var tallest = Math.max.apply(null, MODES.map(function (m) {
        return m === sortMode ? L.H : computeLayout(m).H;
      }));
      if (tallest > L.H) {
        // this view is shorter than the shared height, so grow it into the gap
        var filled = computeLayout(sortMode, tallest - L.bands);
        if (filled.H <= tallest) L = filled;
      }
      dropTo(L, tallest);
    }
    var modeChanged = lastMode !== null && lastMode !== sortMode;
    layout = L;

    plot.classList.toggle("instant", !animate || reduced);
    plot.style.height = L.H + "px";

    L.pos.forEach(function (p, i) {
      var d = dots[i];
      d.style.transitionDelay = animate && modeChanged && !reduced ? Math.round(p.d * 260) + "ms" : "0ms";
      d.style.transform = "translate(" + p.x.toFixed(2) + "px," + p.y.toFixed(2) + "px) scale(" + (p.t / BASE) + ")";
    });

    [axisA, axisB].forEach(function (el, i) {
      var a = L.axes[i];
      el.style.left = a.left + "px"; el.style.top = a.top + "px";
      el.style.width = a.width + "px"; el.style.height = a.height + "px";
    });

    // labels are rebuilt (they are cheap) and fade in after a mode change
    labelsEl.innerHTML = "";
    L.labels.forEach(function (l) {
      var el;
      if (l.kind === "bin") {
        el = document.createElement("button");
        el.type = "button";
        el.className = "lab " + l.cls;
        var missing;
        if (l.mode === "director") {
          el.textContent = l.key;
          el.dataset.target = letterId(l.key);
          missing = "No films under " + l.key;
          el.setAttribute("aria-label", "Jump to " + letterName(l.key).toLowerCase());
        } else {
          el.innerHTML = "<span>" + halfText(l.key) + "</span>" + BIN_STAR;
          el.dataset.target = "r-" + l.key;
          missing = "No films at " + starWords(l.key);
          el.setAttribute("aria-label", "Jump to " + starWords(l.key));
        }
        if (!document.getElementById(el.dataset.target)) { el.disabled = true; el.setAttribute("aria-label", missing); }
      } else {
        el = document.createElement("span");
        el.className = "lab " + l.cls;
        el.textContent = l.text;
        el.setAttribute("aria-hidden", "true");
      }
      el.style.left = l.x + "px";
      el.style.top = l.y + "px";
      labelsEl.appendChild(el);
    });
    if (modeChanged && animate && !reduced) {
      labelsEl.classList.remove("fade");
      void labelsEl.offsetWidth;
      labelsEl.classList.add("fade");
    }
    bindHover(labelsEl);

    if (!animate || reduced) {
      requestAnimationFrame(function () { plot.classList.remove("instant"); });
    }
    lastMode = sortMode;
  }

  labelsEl.addEventListener("click", function (e) {
    var b = e.target.closest("button.lab");
    if (!b || b.disabled) return;
    var target = document.getElementById(b.dataset.target);
    if (target) target.scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "start" });
  });

  function chartSummary() {
    if (sortMode === "director") {
      var letters = {};
      MOVIES.forEach(function (a) { var c = directorLetter(a.director); letters[c] = (letters[c] || 0) + 1; });
      var top = Object.keys(letters).sort(function (x, y) { return letters[y] - letters[x]; })[0];
      return "Chart of " + MOVIES.length + " films by the first letter of the director's surname, A to Z. " +
             top + " has the most, with " + letters[top] + " films.";
    }
    if (sortMode === "rating") {
      var parts = HALVES.slice().reverse().map(function (h) {
        var n = MOVIES.filter(function (a) { return a.half === h; }).length;
        return n ? starWords(h) + ": " + n : null;
      }).filter(Boolean);
      return "Histogram of " + MOVIES.length + " films by rating. " + parts.join(", ") + ".";
    }
    var counts = {};
    MOVIES.forEach(function (a) { counts[a.year] = (counts[a.year] || 0) + 1; });
    var peak = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; })[0];
    return "Timeline of " + MOVIES.length + " films released from " + minYear + " to " + maxYear +
           ". The busiest year is " + peak + " with " + counts[peak] + " films.";
  }

  /* ---------- chart hover / tap ---------- */
  var hot = -1;
  var touchSelected = false;

  function nearest(clientX, clientY) {
    if (!layout) return -1;
    var r = plot.getBoundingClientRect();
    var px = clientX - r.left, py = clientY - r.top;
    var best = -1, bestD = Infinity;
    var reach = Math.max(12, layout.t * 2.2);
    for (var i = 0; i < layout.pos.length; i++) {
      var p = layout.pos[i];
      var cx = p.x + p.t / 2, cy = p.y + p.t * RATIO / 2;
      // the tile is taller than it is wide, so the vertical gap is measured in tile widths
      var dx = px - cx, dy = (py - cy) / RATIO;
      var dd = dx * dx + dy * dy;
      if (dd < bestD) { bestD = dd; best = i; }
    }
    return bestD <= reach * reach ? best : -1;
  }

  function setHot(i, clientX, clientY, touch) {
    if (hot === i && !touch) { placeTip(clientX, clientY); return; }
    if (hot > -1) dots[hot].classList.remove("hot");
    hot = i;
    if (i < 0) {
      plot.classList.remove("hovering");
      tip.classList.remove("on", "touch");
      touchSelected = false;
      return;
    }
    dots[i].classList.add("hot");
    plot.classList.add("hovering");

    var a = MOVIES[i];
    document.getElementById("tipCover").style.backgroundImage = 'url("' + POSTERS + a.slug + '.jpg")';
    document.getElementById("tipTitle").textContent = a.title;
    document.getElementById("tipDirector").textContent = a.director;
    document.getElementById("tipMeta").innerHTML = stars(a.half) + "<span>· " + a.year + "</span>";
    tip.classList.toggle("touch", !!touch);
    tip.classList.add("on");
    touchSelected = !!touch;
    placeTip(clientX, clientY, touch);
  }

  function placeTip(clientX, clientY, touch) {
    var tw = tip.offsetWidth, th = tip.offsetHeight;
    var vw = document.documentElement.clientWidth, vh = window.innerHeight;
    var x, y;
    if (touch && hot > -1) {
      // anchor above the chosen poster so the finger does not cover the card
      var r = plot.getBoundingClientRect(), p = layout.pos[hot];
      clientX = r.left + p.x + p.t / 2;
      clientY = r.top + p.y;
      x = clientX - tw / 2;
      y = clientY - th - 14;
      if (y < 70) y = clientY + p.t * RATIO + 16;
    } else {
      x = clientX + 16;
      y = clientY - th - 12;
      if (x + tw > vw - 12) x = clientX - tw - 16;
      if (y < 8) y = clientY + 18;
    }
    x = Math.max(12, Math.min(x, vw - tw - 12));
    y = Math.max(8, Math.min(y, vh - th - 8));
    tip.style.transform = "";
    tip.style.left = x + "px";
    tip.style.top = y + "px";
  }

  plot.addEventListener("pointermove", function (e) {
    if (e.pointerType !== "mouse") return;
    setHot(nearest(e.clientX, e.clientY), e.clientX, e.clientY, false);
  });

  plot.addEventListener("pointerleave", function (e) {
    if (e.pointerType === "mouse") setHot(-1);
  });

  plot.addEventListener("click", function (e) {
    if (e.target.closest("button.lab")) return;
    var i = nearest(e.clientX, e.clientY);
    var touchLike = !window.matchMedia("(hover: hover)").matches;
    if (i < 0) { setHot(-1); return; }
    if (touchLike) {
      // first tap previews, tapping the preview (or the same poster again) opens it
      if (touchSelected && hot === i) { openFilm(MOVIES[i]); setHot(-1); }
      else setHot(i, e.clientX, e.clientY, true);
    } else {
      openFilm(MOVIES[i]);
    }
  });

  tip.addEventListener("click", function () {
    if (touchSelected && hot > -1) { var a = MOVIES[hot]; setHot(-1); openFilm(a); }
  });

  document.addEventListener("pointerdown", function (e) {
    if (touchSelected && !plot.contains(e.target) && !tip.contains(e.target)) setHot(-1);
  });

  window.addEventListener("scroll", function () {
    if (hot > -1 && !touchSelected) setHot(-1);
    else if (touchSelected) placeTip(0, 0, true);
    toolbar.classList.toggle("stuck", toolbar.getBoundingClientRect().top <= 0 && window.scrollY > 10);
  }, { passive: true });

  var toolbar = document.getElementById("toolbar");

  /* ---------- sort switch ---------- */
  function applySort(mode, animate) {
    sortMode = mode;
    document.querySelectorAll(".switch button").forEach(function (b) {
      b.setAttribute("aria-pressed", b.dataset.sort === mode ? "true" : "false");
    });
    document.getElementById("vizTitle").textContent =
      mode === "rating" ? "Every film, by rating" : mode === "year" ? "Every film, by release year" : "Every film, by director";
    setHot(-1);
    renderShelves();
    drawChart(animate);
    document.getElementById("vizSummary").textContent = chartSummary();
  }

  document.querySelectorAll(".switch button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (btn.dataset.sort === sortMode) return;
      try { localStorage.setItem("movieSort", btn.dataset.sort); } catch (err) {}
      applySort(btn.dataset.sort, true);
    });
  });

  /* ---------- detail ---------- */
  var current = -1;

  function openFilm(a) {
    var at = order.indexOf(a);
    if (at > -1) openAt(at);
  }

  function openAt(i) {
    current = (i + order.length) % order.length;
    var a = order[current];

    document.getElementById("dCover").innerHTML = posterHtml(a, true);
    document.getElementById("dTitle").textContent = a.title;
    document.getElementById("dDirector").textContent = a.director;
    document.getElementById("dFacts").innerHTML =
      "<span>" + a.year + "</span>" + stars(a.half) + "<span>" + starWords(a.half) + "</span>";

    var review = document.getElementById("dReview");
    review.innerHTML = a.review ? reviewHtml(a.review) : "No review written yet.";
    review.classList.toggle("empty", !a.review);

    // spoilers start blurred again on every film, including the one you came from
    var spoilers = document.getElementById("dSpoilers");
    spoilers.hidden = !a.spoilers;
    spoilers.classList.remove("open");
    document.getElementById("dSpoilerBtn").setAttribute("aria-expanded", "false");
    document.getElementById("dSpoilerBody").innerHTML = a.spoilers ? reviewHtml(a.spoilers) : "";

    document.getElementById("dPos").textContent = (current + 1) + " / " + order.length;
    dialog.querySelector(".info").scrollTop = 0;
    dialog.querySelector(".detail").scrollTop = 0;

    if (!dialog.open) {
      dialog.showModal();
      document.documentElement.classList.add("modal-open");
    }
    history.replaceState(null, "", "#" + a.slug);

    // warm the neighbours so paging feels instant
    [current + 1, current - 1].forEach(function (j) {
      new Image().src = POSTERS + order[(j + order.length) % order.length].slug + ".jpg";
    });
  }

  dialog.addEventListener("close", function () {
    document.documentElement.classList.remove("modal-open");
    tScale = 1;
    history.replaceState(null, "", location.pathname + location.search);
    var card = shelvesEl.querySelector('.card[data-i="' + current + '"]');
    if (card) card.focus({ preventScroll: true });
  });

  document.getElementById("dSpoilerBtn").addEventListener("click", function () {
    document.getElementById("dSpoilers").classList.add("open");
    this.setAttribute("aria-expanded", "true");
  });

  document.getElementById("dClose").addEventListener("click", function () { dialog.close(); });
  document.getElementById("dPrev").addEventListener("click", function () { openAt(current - 1); });
  document.getElementById("dNext").addEventListener("click", function () { openAt(current + 1); });

  // click on the backdrop closes
  dialog.addEventListener("click", function (e) { if (e.target === dialog) dialog.close(); });

  document.addEventListener("keydown", function (e) {
    if (!dialog.open) { if (e.key === "Escape") setHot(-1); return; }
    if (e.key === "ArrowRight") { e.preventDefault(); openAt(current + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); openAt(current - 1); }
  });

  // swipe between films on phones
  var sx = 0, sy = 0, tracking = false;
  dialog.addEventListener("touchstart", function (e) {
    if (e.touches.length !== 1) { tracking = false; return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; tracking = true;
  }, { passive: true });
  dialog.addEventListener("touchend", function (e) {
    if (!tracking) return;
    tracking = false;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.6) openAt(current + (dx < 0 ? 1 : -1));
  }, { passive: true });

  /* ---------- custom cursor (desktop pointers only) ---------- */
  var fine = window.matchMedia("(pointer: fine)").matches;
  var tScale = 1;

  function bindHover(root) {
    if (!fine || reduced) return;
    root.querySelectorAll("a, button").forEach(function (el) {
      el.addEventListener("mouseenter", function () { tScale = 0.001; });
      el.addEventListener("mouseleave", function () { tScale = 1; });
    });
  }

  if (fine && !reduced) {
    var cursor = document.querySelector(".cursor");
    var big = cursor.querySelector(".ball.big");
    var small = cursor.querySelector(".ball.small");
    var mx = -100, my = -100, bx = -100, by = -100, scale = 1;

    document.addEventListener("mousemove", function (e) { mx = e.clientX; my = e.clientY; });
    bindHover(document.querySelector(".switch"));

    (function loop() {
      bx += (mx - bx) * 0.14;
      by += (my - by) * 0.14;
      scale += (tScale - scale) * 0.2;
      big.style.transform = "translate(" + (bx - 25) + "px," + (by - 25) + "px) scale(" + scale + ")";
      small.style.transform = "translate(" + (mx - 5) + "px," + (my - 5) + "px)";
      requestAnimationFrame(loop);
    })();
  } else {
    var c = document.querySelector(".cursor");
    if (c) c.style.display = "none";
  }

  /* ---------- start ---------- */
  var startMode = "rating";
  try {
    var saved = localStorage.getItem("movieSort");
    if (MODES.indexOf(saved) > -1) startMode = saved;
  } catch (err) {}

  applySort(startMode, false);

  // re-flow the chart when its width changes (rotation, window resize), without animating
  var lastW = plot.clientWidth, resizeRaf = 0;
  new ResizeObserver(function () {
    var w = plot.clientWidth;
    if (w === lastW) return;
    lastW = w;
    cancelAnimationFrame(resizeRaf);
    resizeRaf = requestAnimationFrame(function () { setHot(-1); drawChart(false); });
  }).observe(plot);

  // links like /movies#inception-2010 open straight to that film
  function openFromHash() {
    var slug = decodeURIComponent((location.hash || "").slice(1));
    if (!slug) return;
    var at = order.findIndex(function (a) { return a.slug === slug; });
    if (at > -1) openAt(at);
  }

  openFromHash();
  window.addEventListener("hashchange", openFromHash);
})();
</script>

</body>
</html>
