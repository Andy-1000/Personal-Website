<!DOCTYPE html>
<html lang="en">
<!-- Rhys, Rhys, Goosen (or maybe Josh). So you thought you might check out the code... or perhaps even cheat. Well, you must do so at your own peril... -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f3f1">
<title>The Paper Game</title>
<meta name="description" content="Make paper. Sell paper. Run for mayor. Fold the universe.">
<link rel="icon" type="image/jpeg" href="paper.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap" rel="stylesheet">
<link href="paper.css?v=12" rel="stylesheet">
</head>
<body data-tab="work">

<header class="top">
  <div class="top-row">
    <h1>The Paper Game</h1>
    <span id="page-no" class="page-no hidden"></span>
  </div>
  <dl id="resources" class="resources"></dl>
</header>

<main class="desk">

  <section class="col" id="col-work">
    <div id="level-box" class="panel" data-tab="work">
      <p class="level-line">Level <span id="level"></span> <span id="title" class="title"></span></p>
      <button type="button" id="level-up" class="btn"></button>
    </div>

    <div id="projects" class="panel hidden" data-tab="work">
      <h2>Next project</h2>
      <button type="button" id="project" class="btn"></button>
      <p id="sign" class="sign hidden"></p>
    </div>

    <div id="manual" class="panel manual" data-tab="work"></div>
  </section>

  <section class="col" id="col-world">
    <div id="art" class="panel hidden" data-tab="art">
      <h2>Operation Bob Ross</h2>
      <div id="art-body"></div>
      <div id="progress" class="progress hidden"><div id="bar" class="bar"></div><span id="bar-text"></span></div>
      <p id="art-count" class="small"></p>
    </div>

    <div id="election" class="panel hidden" data-tab="art">
      <h2 id="election-title"></h2>
      <div class="chart" aria-hidden="true"><div id="bars" class="bars"></div></div>
      <button type="button" id="run" class="btn"></button>
    </div>

    <div id="cranes" class="panel hidden" data-tab="sky">
      <h2 id="cranes-title">Cranes</h2>
      <p class="big"><span id="crane-count"></span> cranes</p>
      <label class="slider">
        <span>Fold</span>
        <input type="range" id="alloc" min="0" max="100" step="5" aria-label="Cranes folding cranes or wishing for paper">
        <span>Wish</span>
      </label>
      <p id="crane-wish" class="crane-line"></p>
      <p id="crane-fold" class="crane-line"></p>
    </div>

    <div id="sheet" class="panel hidden" data-tab="sky">
      <h2>The Sheet</h2>
      <p class="big"><span id="folds"></span> folds</p>
      <p id="thick" class="small"></p>
      <div class="ruler" aria-hidden="true"><div id="ruler-fill" class="ruler-fill"></div><div id="ruler-marks"></div></div>
      <button type="button" id="fold" class="btn"></button>
      <label id="autofold-row" class="check hidden"><input type="checkbox" id="autofold"> Fold automatically</label>
      <details id="atlas-box" class="atlas-box hidden">
        <summary>The Atlas</summary>
        <ul id="atlas" class="atlas"></ul>
      </details>
    </div>
  </section>

  <section class="col" id="col-staff">
    <div id="employees" class="panel hidden" data-tab="staff">
      <h2>Staff</h2>
      <div id="staff-list"></div>
    </div>
    <div id="executives" class="panel hidden" data-tab="staff">
      <h2>Executives</h2>
      <div id="exec-list"></div>
    </div>
  </section>

</main>

<nav id="tabs" class="tabs hidden" aria-label="Sections">
  <button type="button" data-go="work">Work<i></i></button>
  <button type="button" data-go="staff">Staff<i></i></button>
  <button type="button" data-go="art">Art<i></i></button>
  <button type="button" data-go="sky">Sky<i></i></button>
</nav>

<footer class="foot">
  <button type="button" id="reset" class="linkish">Start over</button> &middot;
  <a href="/">andysansness.com</a>
</footer>

<button type="button" id="paused" class="overlay hidden">
  <img data-src="stile_photo.png" alt="" onerror="this.remove()">
  <span class="overlay-text">Paused. Press space to carry on.</span>
</button>

<button type="button" id="rick" class="overlay hidden">
  <img data-src="rick_photo.webp" alt="" onerror="this.remove()">
  <span class="overlay-text">&#9835; Never gonna give you up, never gonna let you down &#9835;</span>
</button>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="sheet-of-paper">
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
    <div id="modal-buttons" class="modal-buttons"></div>
  </div>
</div>

<button type="button" id="toast" class="toast" role="status" aria-live="polite"></button>

<div id="creases" class="creases" aria-hidden="true"></div>

<script src="engine.js?v=12"></script>
<script src="game.js?v=12"></script>
</body>
</html>
