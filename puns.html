<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pun Cartoons by Andy</title>
<meta name="description" content="A gallery of fun pun cartoons drawn by Andy Sansness.">
<link rel="icon" type="image/x-icon" href="thumbs_up_.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #004d99;
    --navy: #003366;
    --sky: #cce6ff;
    --sky-soft: #e9f3ff;
    --paper: #ffffff;
    --ink: #14243a;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Open Sans", sans-serif;
    line-height: 1.6;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100svh;
  }

  ::selection { color: #fff; background: var(--blue); }
  img { max-width: 100%; display: block; }

  /* ---------- top bar ---------- */
  .topbar {
    background: var(--blue);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.7rem 1rem;
  }

  .topbar a {
    color: #fff;
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 600;
    padding: 0.35rem 0.2rem;
    border-radius: 6px;
  }

  .topbar a:hover { text-decoration: underline; }
  .topbar .home { display: inline-flex; align-items: center; gap: 0.4rem; }

  /* ---------- heading ---------- */
  header.page {
    text-align: center;
    padding: 1.5rem 1rem 0.5rem;
  }

  header.page h1 {
    font-family: "Merriweather", serif;
    font-weight: 400;
    font-size: clamp(1.6rem, 6.5vw, 2.4rem);
    color: var(--navy);
    margin: 0;
  }

  header.page p {
    margin: 0.35rem 0 0;
    font-size: 0.88rem;
    color: #5a6b7d;
  }

  /* ---------- viewer ---------- */
  main {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    padding: 0.8rem 0.75rem 1rem;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
  }

  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    max-height: 58svh;
    background: var(--sky-soft);
    border: 2px solid var(--sky);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: pan-y;
  }

  .stage img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 1;
    transition: opacity 0.18s ease;
  }

  .stage img.loading { opacity: 0; }

  .stage .spinner {
    position: absolute;
    width: 34px;
    height: 34px;
    border: 3px solid var(--sky);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }

  .stage.busy .spinner { opacity: 1; }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* tap zones on the image itself (desktop convenience) */
  .stage .zone {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 22%;
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 0;
  }

  .stage .zone.left { left: 0; }
  .stage .zone.right { right: 0; }
  .stage .zone:focus-visible { outline: 3px solid var(--blue); outline-offset: -3px; }

  /* ---------- controls ---------- */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    margin-top: 0.85rem;
  }

  .nav-btn {
    flex: none;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 2px solid var(--blue);
    background: #fff;
    color: var(--blue);
    font-size: 1.35rem;
    line-height: 1;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, color 0.15s ease, transform 0.12s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .nav-btn:hover { background: var(--blue); color: #fff; }
  .nav-btn:active { transform: scale(0.94); }
  .nav-btn:focus-visible { outline: 3px solid var(--navy); outline-offset: 3px; }

  .meta {
    text-align: center;
    min-width: 8.5rem;
  }

  .meta .title {
    display: block;
    font-family: "Merriweather", serif;
    font-size: 1rem;
    color: var(--navy);
    line-height: 1.3;
  }

  .meta .count {
    display: block;
    font-size: 0.78rem;
    color: #6b7a8b;
    font-variant-numeric: tabular-nums;
    margin-top: 0.1rem;
  }

  .swipe-hint {
    text-align: center;
    font-size: 0.72rem;
    color: #8794a3;
    margin: 0.6rem 0 0;
  }

  /* ---------- thumbnails ---------- */
  .thumbs {
    display: flex;
    gap: 0.5rem;
    overflow-x: auto;
    padding: 0.9rem 0.15rem 0.5rem;
    margin-top: 0.4rem;
    scrollbar-width: thin;
    -webkit-overflow-scrolling: touch;
  }

  .thumbs::-webkit-scrollbar { height: 7px; }
  .thumbs::-webkit-scrollbar-thumb { background: var(--sky); border-radius: 99px; }

  .thumb {
    flex: none;
    width: 66px;
    height: 52px;
    padding: 0;
    border: 2px solid transparent;
    border-radius: 8px;
    background: var(--sky-soft);
    cursor: pointer;
    overflow: hidden;
    opacity: 0.62;
    transition: opacity 0.15s ease, border-color 0.15s ease, transform 0.12s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb:hover { opacity: 1; transform: translateY(-2px); }
  .thumb.active { opacity: 1; border-color: var(--blue); }
  .thumb:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }

  /* ---------- footer ---------- */
  footer {
    border-top: 1px solid var(--sky);
    text-align: center;
    padding: 1rem;
    font-size: 0.78rem;
    color: #7a8795;
  }

  footer a { color: var(--blue); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  /* ---------- custom cursor (desktop only, matches the rest of the site) ---------- */
  .cursor { pointer-events: none; }
  .cursor .ball { position: fixed; top: 0; left: 0; z-index: 1000; will-change: transform; }

  @media (pointer: fine) {
    body, a, button { cursor: none; }
  }

  @media (pointer: coarse) {
    .cursor { display: none; }
    .stage .zone { display: none; }
  }

  /* ---------- larger screens ---------- */
  @media (min-width: 700px) {
    main { padding: 1.2rem 1rem 1.5rem; }
    .stage { max-height: 62svh; border-radius: 18px; }
    .controls { gap: 1.6rem; margin-top: 1.1rem; }
    .meta .title { font-size: 1.15rem; }
    .thumb { width: 82px; height: 62px; }
    header.page { padding-top: 2rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .stage img, .nav-btn, .thumb, .stage .spinner { transition: none; animation: none; }
  }
</style>
</head>
<body>

<div class="cursor" aria-hidden="true">
  <div class="ball big">
    <svg height="50" width="50"><circle cx="25" cy="25" r="20" stroke-width="0" style="fill:#cce6ff;opacity:.7"></circle></svg>
  </div>
  <div class="ball small">
    <svg height="10" width="10"><circle cx="5" cy="5" r="4" stroke-width="0" style="fill:#004d99"></circle></svg>
  </div>
</div>

<nav class="topbar">
  <a class="home" href="index.html">&larr; Andy Sansness</a>
  <a href="21st.html">Andy's 21st</a>
</nav>

<header class="page">
  <h1>Pun Cartoons</h1>
  <p>Drawn by Andy. Groan responsibly.</p>
</header>

<main>
  <div class="stage" id="stage">
    <div class="spinner" aria-hidden="true"></div>
    <img id="punImg" alt="">
    <button class="zone left" id="zoneLeft" type="button" aria-label="Previous cartoon"></button>
    <button class="zone right" id="zoneRight" type="button" aria-label="Next cartoon"></button>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" type="button" aria-label="Previous cartoon">&#10094;</button>
    <div class="meta">
      <span class="title" id="punTitle">&nbsp;</span>
      <span class="count" id="punCount" aria-live="polite">&nbsp;</span>
    </div>
    <button class="nav-btn" id="nextBtn" type="button" aria-label="Next cartoon">&#10095;</button>
  </div>

  <p class="swipe-hint" id="swipeHint">Swipe, tap the arrows, or use &larr; &rarr;</p>

  <div class="thumbs" id="thumbs" role="tablist" aria-label="All cartoons"></div>
</main>

<footer>
  <a href="index.html">Back to andysansness.com</a>
</footer>

<script>
(function () {
  "use strict";

  var PUNS = [
    { f: "cartoon/mould.png",       t: "Mould" },
    { f: "cartoon/door.png",        t: "Door" },
    { f: "cartoon/partypies.png",   t: "Party Pies" },
    { f: "cartoon/puzzle.png",      t: "Puzzle" },
    { f: "cartoon/frog.png",        t: "Frog" },
    { f: "cartoon/ute.png",         t: "Ute" },
    { f: "cartoon/potato.png",      t: "Potato" },
    { f: "cartoon/buoy.png",        t: "Buoy" },
    { f: "cartoon/tea.jpeg",        t: "Tea" },
    { f: "cartoon/sieve.png",       t: "Sieve" },
    { f: "cartoon/ant.png",         t: "Ant" },
    { f: "cartoon/wok.png",         t: "Wok" },
    { f: "cartoon/reel.png",        t: "Fishing" },
    { f: "cartoon/turnip.png",      t: "Turnip" },
    { f: "cartoon/shell.png",       t: "Shell" },
    { f: "cartoon/pizza.png",       t: "Pizza" },
    { f: "cartoon/bond.png",        t: "Bonds" },
    { f: "cartoon/stain_alive.png", t: "Stain Alive" },
    { f: "cartoon/soup.png",        t: "Soup" },
    { f: "cartoon/power.png",       t: "Battery" },
    { f: "cartoon/pickle.png",      t: "Pickle" },
    { f: "cartoon/penne.png",       t: "Penne" },
    { f: "cartoon/mitten.png",      t: "Mitten" },
    { f: "cartoon/lime.png",        t: "Lime" },
    { f: "cartoon/leaf.png",        t: "Leaf" },
    { f: "cartoon/iphoney.png",     t: "iPhoney" },
    { f: "cartoon/hay.png",         t: "Hay" },
    { f: "cartoon/grass.png",       t: "Grass" },
    { f: "cartoon/ham.png",         t: "Ham" },
    { f: "cartoon/fig.png",         t: "Fig" },
    { f: "cartoon/cashew.png",      t: "Cashew" },
    { f: "cartoon/donut.png",       t: "Donut" },
    { f: "cartoon/leek.png",        t: "Leek" },
    { f: "cartoon/sick.png",        t: "Sick" },
    { f: "cartoon/mandarin.png",    t: "Mandarin" },
    { f: "cartoon/rice.png",        t: "Rice" },
    { f: "cartoon/core.png",        t: "Core" },
    { f: "cartoon/melon.png",       t: "Melon" },
    { f: "cartoon/bald.png",        t: "Bald Man" },
    { f: "cartoon/mint.png",        t: "Mint" },
    { f: "cartoon/lichen.png",      t: "Lichen" },
    { f: "cartoon/thyme.png",       t: "Thyme" }
  ];

  var stage = document.getElementById("stage");
  var img = document.getElementById("punImg");
  var titleEl = document.getElementById("punTitle");
  var countEl = document.getElementById("punCount");
  var thumbsEl = document.getElementById("thumbs");
  var idx = 0;

  /* ---------- thumbnails ---------- */
  var thumbBtns = PUNS.map(function (p, i) {
    var b = document.createElement("button");
    b.className = "thumb";
    b.type = "button";
    b.setAttribute("role", "tab");
    b.setAttribute("aria-label", p.t + " pun");
    var ti = document.createElement("img");
    ti.src = p.f;
    ti.alt = "";
    ti.loading = "lazy";
    ti.decoding = "async";
    b.appendChild(ti);
    b.addEventListener("click", function () { show(i); });
    thumbsEl.appendChild(b);
    return b;
  });

  /* ---------- main viewer ---------- */
  var busyTimer;

  function show(n, skipHash) {
    idx = (n % PUNS.length + PUNS.length) % PUNS.length;
    var p = PUNS[idx];

    // only show the spinner if loading takes a moment
    clearTimeout(busyTimer);
    busyTimer = setTimeout(function () { stage.classList.add("busy"); }, 180);

    img.classList.add("loading");
    img.onload = img.onerror = function () {
      clearTimeout(busyTimer);
      stage.classList.remove("busy");
      img.classList.remove("loading");
    };
    img.src = p.f;
    img.alt = p.t + " pun cartoon";

    titleEl.textContent = p.t;
    countEl.textContent = (idx + 1) + " / " + PUNS.length;

    thumbBtns.forEach(function (b, i) {
      var on = i === idx;
      b.classList.toggle("active", on);
      b.setAttribute("aria-selected", on ? "true" : "false");
    });

    // keep the active thumbnail in view
    var active = thumbBtns[idx];
    var tRect = active.getBoundingClientRect();
    var cRect = thumbsEl.getBoundingClientRect();
    if (tRect.left < cRect.left || tRect.right > cRect.right) {
      thumbsEl.scrollTo({
        left: active.offsetLeft - thumbsEl.clientWidth / 2 + active.clientWidth / 2,
        behavior: "smooth"
      });
    }

    // preload the neighbours so paging feels instant
    [idx + 1, idx - 1].forEach(function (j) {
      var q = PUNS[(j % PUNS.length + PUNS.length) % PUNS.length];
      var pre = new Image();
      pre.src = q.f;
    });

    if (!skipHash) history.replaceState(null, "", "#" + (idx + 1));
  }

  function next() { show(idx + 1); }
  function prev() { show(idx - 1); }

  document.getElementById("nextBtn").addEventListener("click", next);
  document.getElementById("prevBtn").addEventListener("click", prev);
  document.getElementById("zoneRight").addEventListener("click", next);
  document.getElementById("zoneLeft").addEventListener("click", prev);

  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") { e.preventDefault(); next(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
    else if (e.key === "Home") { e.preventDefault(); show(0); }
    else if (e.key === "End") { e.preventDefault(); show(PUNS.length - 1); }
  });

  /* ---------- swipe ---------- */
  var sx = 0, sy = 0, tracking = false;

  stage.addEventListener("touchstart", function (e) {
    if (e.touches.length !== 1) { tracking = false; return; }
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
    tracking = true;
  }, { passive: true });

  stage.addEventListener("touchend", function (e) {
    if (!tracking) return;
    tracking = false;
    var t = e.changedTouches[0];
    var dx = t.clientX - sx;
    var dy = t.clientY - sy;
    // horizontal, decisive, and not a vertical scroll
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      if (dx < 0) next(); else prev();
    }
  }, { passive: true });

  /* ---------- start ---------- */
  var start = parseInt((location.hash || "").replace("#", ""), 10);
  show(isNaN(start) ? 0 : start - 1, true);

  /* ---------- custom cursor (desktop pointers only) ---------- */
  var fine = window.matchMedia("(pointer: fine)").matches;
  var calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  if (fine && !calm) {
    var big = document.querySelector(".ball.big");
    var small = document.querySelector(".ball.small");
    var mx = -100, my = -100, bx = -100, by = -100, scale = 1, tScale = 1;

    document.addEventListener("mousemove", function (e) { mx = e.clientX; my = e.clientY; });

    document.querySelectorAll("a, button").forEach(function (el) {
      el.addEventListener("mouseenter", function () { tScale = 0.001; });
      el.addEventListener("mouseleave", function () { tScale = 1; });
    });

    (function loop() {
      bx += (mx - bx) * 0.14;
      by += (my - by) * 0.14;
      scale += (tScale - scale) * 0.2;
      big.style.transform = "translate(" + (bx - 25) + "px," + (by - 25) + "px) scale(" + scale + ")";
      small.style.transform = "translate(" + (mx - 5) + "px," + (my - 5) + "px)";
      requestAnimationFrame(loop);
    })();
  } else {
    var c = document.querySelector(".cursor");
    if (c) c.style.display = "none";
  }
})();
</script>

</body>
</html>
