f allows us to empathise with Viktor's unfortunate predicament.\n\n\"What can I do?\"\n\"There's only one thing you can do here Viktor... Shop\"\n\nThere are genuinely funny moments scattered generously throughout, and what makes them all the better is that they just don't seem forced. Tom Hanks works effortlessly in this role, somehow perfectly capturing the naiveté and confusion of a foreigner surrounded by the bureaucracy of American border security. He also employs a thick accent (Bulgarian?) which somehow doesn't come off as ridiculous or unnatural. Honestly, he's just too good.\n\nHanks' naiveté is complemented by Frank Dixon (Stanley Tucci), the head officer of customs and the one who has to figure out what to do with Viktor. Various methods are employed by Dixon to get rid of him, but Viktor's naiveté, luck, or nature means that he doesn't bite, so, for now, he stays. As the movie progresses, a love interest and a gradual unpacking of why Viktor is in New York in the first place both add to the story, all culminating in a sentimental but somewhat ambiguous conclusion. Overall, The Terminal is quaint, light and just generally enjoyable.","spoilers":""},{"slug":"daddy-day-care-2003","title":"Daddy Day Care","director":"Steve Carr","year":2003,"half":7,"review":"","spoilers":""},{"slug":"elf-2003","title":"Elf","director":"Jon Favreau","year":2003,"half":7,"review":"","spoilers":""},{"slug":"master-and-commander-the-far-side-of-the-world-2003","title":"Master and Commander: The Far Side of the World","director":"Peter Weir","year":2003,"half":7,"review":"","spoilers":""},{"slug":"matchstick-men-2003","title":"Matchstick Men","director":"Ridley Scott","year":2003,"half":7,"review":"In film there are twists and then there are twists. The first are the ones you see from a mile away, the ones poorly designed and sometimes barely thought out. The second are the ones which you missed but realize are completely obvious once you know. More importantly, it's this kind of twist in which you must re-evaluate every single frame of the entire film.\nMatchstick Men has a twist of the latter.\nThe plot follows a con man and his neurotic partner trying to pull off a big job.\nMeanwhile, Mr. con man finds himself with a teenage daughter who he's only just meeting for the very first time.\n\nNicolas Cage plays the protagonist, and does a superb job at bringing out the emotions, the neurosis and the humanity from his complex, and yet oftentimes so very simple character. What this film does – better than many of its compatriots – is provide exposition through implication. Not a word of dialogue is devoted to the protagonist’s neurosis, or to him and his partner’s history, or even what they do. Instead, the words which are spoken tell much; Cage's acting also speaks for itself in terms of what his character is thinking or feeling.\n\nThis is no groundbreaking exposé of a film, nor is it some grand, crime thriller – this is actually a small, somewhat quiet film – but damn is it done well.","spoilers":""},{"slug":"pirates-of-the-caribbean-the-curse-of-the-black-pearl-2003","title":"Pirates of the Caribbean: The Curse of the Black Pearl","director":"Gore Verbinski","year":2003,"half":7,"review":"","spoilers":""},{"slug":"runaway-jury-2003","title":"Runaway Jury","director":"Gary Fleder","year":2003,"half":7,"review":"Runaway Jury is a brilliant cat and mouse legal thriller. Framed against the gun industry, the focus is not so much on the case itself but the dynamics of the jury and those looking to manipulate them. Even outside of the execution of the movie, just the simple idea of jury-fixing in the first place was a fascinating topic in and of itself. But to layer in the dynamics of both sides of the courtroom, not to mention the jurors themselves, makes for an irresistibly compelling watch. At its core, Runaway Jury is a chess game of a movie, with moves and countermoves. The court is really just the board they're playing on. And man is it fun to watch. A surprisingly large cast makes the game feel all the bigger, while some outstanding performances ground the plot in rock solid stakes. There are some subtle details in these performances which sell the characters even more; little inflections in tone or tweaks in expression which go that much further in selling the story. The score is spare, with the focus primarily on the dialogue turning the gears of the plot forward. On a meta level, the manipulations of different characters are also manipulating us as the audience.","spoilers":""},{"slug":"shattered-glass-2003","title":"Shattered Glass","director":"Billy Ray","year":2003,"half":7,"review":"","spoilers":""},{"slug":"the-italian-job-2003","title":"The Italian Job","director":"F. Gary Gray","year":2003,"half":7,"review":"A classic heist movie. Nothing more, nothing less.\n\nFrom the very beginning the audience is instantly captured by the action-packed initial heist. A betrayal from one of the members then sets up the premise for the rest of the movie. Although following a fairly cliché format - scope out target, prepare for heist, something goes wrong in the execution of the heist, a hidden factor gets the job done - The Italian Job nevertheless does it very well.\n\nUnfortunately, like many heist movies, just a little bit too much relies on unrealistic hacking and technology; in this instance, the manipulation of every traffic light in the whole of LA. However, what was done well was the opening of the vault - as in a typical heist movie, one member of the team is the safecracker, but in this instance, by making that particular member's occupation be a 'security and vault specialist', this suddenly becomes a bit more feasible.\n\nActing was fine; characters were all likable enough - my only gripe here was that the main mastermind, Charlie Crocker (played by Mark Wahlberg), was smooth without being that likable... if I'm being perfectly honest, kind of boring. On the other hand, Steve (played by Edward Norton) was utterly excellent, being totally annoying and hate-able in the best way possible.\n\nBecause The Italian Job follows somewhat of a cliché, there really isn't much to the depth of the plot. Though its integrity is sound enough, it is in a word just a bit... basic? In the end though, this doesn't matter too much; the action throughout keeps the pace nicely and overall makes for highly entertaining viewing.","spoilers":""},{"slug":"catch-me-if-you-can-2002","title":"Catch Me If You Can","director":"Steven Spielberg","year":2002,"half":7,"review":"","spoilers":""},{"slug":"a-beautiful-mind-2001","title":"A Beautiful Mind","director":"Ron Howard","year":2001,"half":7,"review":"As a story, A Beautiful Mind is an effective exemplar of the plot twist. Rather than positioning the plot twist at the very end, in this instance it is located in the very middle.\n\nLike any good plot twist it turns the entire story on its head, leaving you dumbfounded, surprised and amazed. Additionally, the twist also lends itself very nicely to rewatchability. However, by having a plot twist not only as a payoff at the end, the audience is then invited to explore the aftermath.\n\nThe pacing of A Beautiful Mind never misses a beat - numerous jumps forward in time keep the plot moving along nicely, though one could argue that the price of this is that each stage isn't explored in much depth.\n\nA star-studded cast helps considerably as well, led by Russell Crowe in the titular role.\n\nThe role is undeniably an overt one, but Crowe does well to tease out its subtleties. The nature of the story thematically meant that moments and stretches of the film were basically a bit depressing, but the resolution does well to uplift the character and his heart-wrenching story.\n\nIf anything I think it could have been dwelt on a little further, as well as what else he actually accomplished, but in the end this was not a story devoted to his accomplishments nor even his mind! This is a story devoted to a man's heart, to overcome the obstacles before him and eventually become at peace with himself and the world.","spoilers":""},{"slug":"shrek-2001","title":"Shrek","director":"Andrew Adamson, Vicky Jenson","year":2001,"half":7,"review":"","spoilers":""},{"slug":"cast-away-2000","title":"Cast Away","director":"Robert Zemeckis","year":2000,"half":7,"review":"","spoilers":""},{"slug":"meet-joe-black-1998","title":"Meet Joe Black","director":"Martin Brest","year":1998,"half":7,"review":"","spoilers":""},{"slug":"the-truman-show-1998","title":"The Truman Show","director":"Peter Weir","year":1998,"half":7,"review":"","spoilers":""},{"slug":"groundhog-day-1993","title":"Groundhog Day","director":"Harold Ramis","year":1993,"half":7,"review":"","spoilers":""},{"slug":"the-fugitive-1993","title":"The Fugitive","director":"Andrew Davis","year":1993,"half":7,"review":"","spoilers":""},{"slug":"return-of-the-jedi-1983","title":"Return of the Jedi","director":"Richard Marquand","year":1983,"half":7,"review":"","spoilers":""},{"slug":"star-wars-1977","title":"Star Wars","director":"George Lucas","year":1977,"half":7,"review":"","spoilers":""},{"slug":"the-sting-1973","title":"The Sting","director":"George Roy Hill","year":1973,"half":7,"review":"","spoilers":""},{"slug":"the-great-escape-1963","title":"The Great Escape","director":"John Sturges","year":1963,"half":7,"review":"","spoilers":""},{"slug":"mission-impossible-the-final-reckoning-2025","title":"Mission: Impossible – The Final Reckoning","director":"Christopher McQuarrie","year":2025,"half":6,"review":"As the name suggests, this is the supposed last installment of the Mission Impossible franchise, and the second part to the previous film. The first act plays out like a best-of of Hunt's exploits, at once both reminiscent and pseudo-inspirational.\n\nBut there's not enough time to dwell on this; after a few more exposition dumps just to solidify the fact that the stakes are higher than ever, we launch into the action we have come to expect. The second act is a protracted sequence of pure suspense, from the high stakes, the stress of individuals, the ticking time limit, the mass of water on a body.\n\nAll that is to say that I was left gasping for air by the time that tension was released. Coming then to the third act, we are presented with action at its finest. At its heart action is a visual spectacle, not just mindless violence, if that at all. Stuntwork, one of Cruise's specialties, is equally as entertaining and action-packed as any hand-to-hand combat. Then, in its characteristic right-on-time conclusion, we are given a deeply cathartic send off. Certain plot elements in the aftermath are glossed over, nigh deus ex machina, but the story is rounded out so nicely it doesn't much matter.","spoilers":""},{"slug":"conclave-2024","title":"Conclave","director":"Edward Berger","year":2024,"half":6,"review":"Conclave is an outstanding work of both aesthetic and thematic brilliance. The film follows the subtly tense drama of a conclave following the pope's death to select a new one. Ambiguity is the primary mechanism that makes what could have been a good film truly great.\n\nThe backgrounds of all the key players begin obscured, even the circumstances of the old pope's passing. This creates an atmosphere of instant intrigue, which is also assisted by a score straight out of an old school murder mystery (the thought of such a plot reveal did cross my mind).\nAmbiguity also marks the film's conclusion, which initially doesn't hit as hard, but upon reflection reveals depth and further plot points which resolve nicely. Nothing is ever really said explicitly - it is up to the audience much of the time to read between the lines. As they do they will be greatly rewarded. In addition to the dramatic and thematic interplay which makes up the rest of the meal, how that meat is presented is outstanding. Purely from a cinematography point of view Conclave is a triumph. Shot framing not only looks & acts as a visual feast, but also works to set the tone of scenes. Conclave is an undeniable (if somewhat subtle) ripper of a film.","spoilers":""},{"slug":"guardians-of-the-galaxy-vol-3-2023","title":"Guardians of the Galaxy Vol. 3","director":"James Gunn","year":2023,"half":6,"review":"","spoilers":""},{"slug":"everything-everywhere-all-at-once-2022","title":"Everything Everywhere All at Once","director":"Daniel Kwan, Daniel Scheinert","year":2022,"half":6,"review":"","spoilers":""},{"slug":"the-gray-man-2022","title":"The Gray Man","director":"Anthony Russo, Joe Russo","year":2022,"half":6,"review":"","spoilers":""},{"slug":"the-man-from-toronto-2022","title":"The Man from Toronto","director":"Patrick Hughes","year":2022,"half":6,"review":"","spoilers":""},{"slug":"top-gun-maverick-2022","title":"Top Gun: Maverick","director":"Joseph Kosinski","year":2022,"half":6,"review":"","spoilers":""},{"slug":"no-time-to-die-2021","title":"No Time to Die","director":"Cary Joji Fukunaga","year":2021,"half":6,"review":"","spoilers":""},{"slug":"spider-man-no-way-home-2021","title":"Spider-Man: No Way Home","director":"Jon Watts","year":2021,"half":6,"review":"","spoilers":""},{"slug":"enola-holmes-2020","title":"Enola Holmes","director":"Harry Bradbeer","year":2020,"half":6,"review":"","spoilers":""},{"slug":"the-courier-2020","title":"The Courier","director":"Dominic Cooke","year":2020,"half":6,"review":"","spoilers":""},{"slug":"a-beautiful-day-in-the-neighborhood-2019","title":"A Beautiful Day in the Neighborhood","director":"Marielle Heller","year":2019,"half":6,"review":"","spoilers":""},{"slug":"ad-astra-2019","title":"Ad Astra","director":"James Gray","year":2019,"half":6,"review":"","spoilers":""},{"slug":"avengers-endgame-2019","title":"Avengers: Endgame","director":"Anthony Russo, Joe Russo","year":2019,"half":6,"review":"","spoilers":""},{"slug":"little-women-2019","title":"Little Women","director":"Greta Gerwig","year":2019,"half":6,"review":"","spoilers":""},{"slug":"avengers-infinity-war-2018","title":"Avengers: Infinity War","director":"Anthony Russo, Joe Russo","year":2018,"half":6,"review":"","spoilers":""},{"slug":"creed-ii-2018","title":"Creed II","director":"Steven Caple Jr.","year":2018,"half":6,"review":"","spoilers":""},{"slug":"ready-player-one-2018","title":"Ready Player One","director":"Steven Spielberg","year":2018,"half":6,"review":"","spoilers":""},{"slug":"teen-titans-go-to-the-movies-2018","title":"Teen Titans Go! To the Movies","director":"Aaron Horvath, Peter Rida Michail","year":2018,"half":6,"review":"","spoilers":""},{"slug":"jumanji-welcome-to-the-jungle-2017","title":"Jumanji: Welcome to the Jungle","director":"Jake Kasdan","year":2017,"half":6,"review":"","spoilers":""},{"slug":"kong-skull-island-2017","title":"Kong: Skull Island","director":"Jordan Vogt-Roberts","year":2017,"half":6,"review":"","spoilers":""},{"slug":"murder-on-the-orient-express-2017","title":"Murder on the Orient Express","director":"Kenneth Branagh","year":2017,"half":6,"review":"","spoilers":""},{"slug":"roman-j-israel-esq-2017","title":"Roman J. Israel, Esq.","director":"Dan Gilroy","year":2017,"half":6,"review":"I remain on the fence with this one. Roman J. Israel, Esq. is a rags to riches adjacent story, complete with moral quandaries, a sort of love interest, and The Meaning of Everything. The plot follows the journey and moral arc of a legal savant (you know this because they tell you; also, he apparently knows every legal document ever written) after the demise of his public facing partner. As you may guess, subtlety is minimal. The trouble is, it's as if this film doesn't know what it's trying to say. Though Denzel Washington's role as the titular character is fantastic, the true direction is unclear. It's hard to take it at face value when you've got nothing to base it on.","spoilers":""},{"slug":"wonder-woman-2017","title":"Wonder Woman","director":"Patty Jenkins","year":2017,"half":6,"review":"","spoilers":""},{"slug":"batman-v-superman-dawn-of-justice-2016","title":"Batman v Superman: Dawn of Justice","director":"Zack Snyder","year":2016,"half":6,"review":"","spoilers":""},{"slug":"hail-caesar-2016","title":"Hail, Caesar!","director":"Joel & Ethan Coen","year":2016,"half":6,"review":"Hail Caesar relies not on plot, character or any other traditional driver of story, but on what seems to be pure momentum. The film is fundamentally a comedy/satire, and genuinely hilarious scenes abound. Conceptually Hail Caesar follows a Hollywood \"fixer\", the person who covers up or resolves the misdeeds of movie stars to maintain the reputation of the studio. A day in the life involves dealing with a husbandless pregnancy, an immoral lead and a kidnapped lead.\n\nThroughout the playing out of these scenarios, we also get snippets of the fictional films they are in, providing an interesting insight into 1940s cinema. Amusingly, the cast of these fictional films are all famous actors in reality, blurring the line between where Hail, Caesar the movie starts and Hail, Caesar the movie within the movie ends. On the casting, such an ensemble would be enough to convince us that half of Hollywood was present, but what makes the casting even better is how well they have each been used: George Clooney as a dumb but charismatic lead man, Scarlett Johansson as a whiny Karen, Jonah Hill as a quiet 'person'. Much of the humour is actually visual gags, though decent writing helps as well.\n\nThrough such ingredients, mixed with zippy pacing, the momentum pushes this movie from start to finish.","spoilers":""},{"slug":"hidden-figures-2016","title":"Hidden Figures","director":"Theodore Melfi","year":2016,"half":6,"review":"","spoilers":""},{"slug":"the-accountant-2016","title":"The Accountant","director":"Gavin O'Connor","year":2016,"half":6,"review":"","spoilers":""},{"slug":"the-magnificent-seven-2016","title":"The Magnificent Seven","director":"Antoine Fuqua","year":2016,"half":6,"review":"","spoilers":""},{"slug":"zootopia-2016","title":"Zootopia","director":"Jared Bush, Byron Howard, Rich Moore","year":2016,"half":6,"review":"","spoilers":""},{"slug":"ant-man-2015","title":"Ant-Man","director":"Peyton Reed","year":2015,"half":6,"review":"","spoilers":""},{"slug":"creed-2015","title":"Creed","director":"Ryan Coogler","year":2015,"half":6,"review":"","spoilers":""},{"slug":"mcfarland-usa-2015","title":"McFarland, USA","director":"Niki Caro","year":2015,"half":6,"review":"","spoilers":""},{"slug":"mission-impossible-rogue-nation-2015","title":"Mission: Impossible – Rogue Nation","director":"Christopher McQuarrie","year":2015,"half":6,"review":"","spoilers":""},{"slug":"the-hunger-games-mockingjay-part-2-2015","title":"The Hunger Games: Mockingjay – Part 2","director":"Francis Lawrence","year":2015,"half":6,"review":"","spoilers":""},{"slug":"big-hero-6-2014","title":"Big Hero 6","director":"Don Hall, Chris Williams","year":2014,"half":6,"review":"","spoilers":""},{"slug":"guardians-of-the-galaxy-2014","title":"Guardians of the Galaxy","director":"James Gunn","year":2014,"half":6,"review":"","spoilers":""},{"slug":"the-hobbit-the-battle-of-the-five-armies-2014","title":"The Hobbit: The Battle of the Five Armies","director":"Peter Jackson","year":2014,"half":6,"review":"","spoilers":""},{"slug":"the-imitation-game-2014","title":"The Imitation Game","director":"Morten Tyldum","year":2014,"half":6,"review":"The Imitation Game is a seriously well made biographical drama chronicling the efforts of Alan Turing in World War 2 trying to break Germany's Enigma code.\n\nThe tortured, arrogant, lonely genius motif comes into its own, and with what could have been (and is) a very predictable plot, this film could very easily have slipped into mediocrity. However, The Imitation Game rises to borderline luminescence; this is achieved through nested framing of the events as they appear, rich tracking of drama from the sheer lucidity and intrigue of these events, and a deep exploration of character, which is only aided by a masterful performance from Benedict Cumberbatch. In retrospect, its predictability adds some sting, simply from the fact that you know at some point they will crack the code and that will be that. There was one point where a shady MI6 agent entered the story and I couldn't help but think a film focused on his story would be more interesting. This is a serious film with serious themes, with not a single frame of cinematic indulgence. All the action that happens is in the dialogue, which is fairly crackling, out of necessity more than anything else. The Imitation Game is a strong film.","spoilers":""},{"slug":"the-lego-movie-2014","title":"The Lego Movie","director":"Phil Lord, Christopher Miller","year":2014,"half":6,"review":"","spoilers":""},{"slug":"x-men-days-of-future-past-2014","title":"X-Men: Days of Future Past","director":"Bryan Singer","year":2014,"half":6,"review":"","spoilers":""},{"slug":"gravity-2013","title":"Gravity","director":"Alfonso Cuarón","year":2013,"half":6,"review":"","spoilers":""},{"slug":"man-of-steel-2013","title":"Man of Steel","director":"Zack Snyder","year":2013,"half":6,"review":"","spoilers":""},{"slug":"oblivion-2013","title":"Oblivion","director":"Joseph Kosinski","year":2013,"half":6,"review":"","spoilers":""},{"slug":"the-lone-ranger-2013","title":"The Lone Ranger","director":"Gore Verbinski","year":2013,"half":6,"review":"","spoilers":""},{"slug":"journey-2-the-mysterious-island-2012","title":"Journey 2: The Mysterious Island","director":"Brad Peyton","year":2012,"half":6,"review":"","spoilers":""},{"slug":"safe-house-2012","title":"Safe House","director":"Daniel Espinosa","year":2012,"half":6,"review":"Safe House is a mediocre spy thriller, the kind with a convoluted plot involving government secrets and characters everyone is after, including the government, because they hold possession of the aforementioned secrets. Now these movies are fine in and of themselves - Denzel and Ryan Reynolds make for great leads, and there are a handful of good moments scattered in there - but what kills this one is the so-so cinematography.\n\nMore specifically, the kind which opts to shoot the action sequences with a shaky camera. Ugh. Unfortunately flickers of greatness and stretches of watchability don't make up for these fundamental flaws (not to mention a truly un-engaging conclusion).","spoilers":""},{"slug":"the-amazing-spider-man-2012","title":"The Amazing Spider-Man","director":"Marc Webb","year":2012,"half":6,"review":"","spoilers":""},{"slug":"the-avengers-2012","title":"The Avengers","director":"Joss Whedon","year":2012,"half":6,"review":"","spoilers":""},{"slug":"contagion-2011","title":"Contagion","director":"Steven Soderbergh","year":2011,"half":6,"review":"","spoilers":""},{"slug":"johnny-english-reborn-2011","title":"Johnny English Reborn","director":"Oliver Parker","year":2011,"half":6,"review":"","spoilers":""},{"slug":"kung-fu-panda-2-2011","title":"Kung Fu Panda 2","director":"Jennifer Yuh Nelson","year":2011,"half":6,"review":"","spoilers":""},{"slug":"mission-impossible-ghost-protocol-2011","title":"Mission: Impossible – Ghost Protocol","director":"Brad Bird","year":2011,"half":6,"review":"","spoilers":""},{"slug":"sherlock-holmes-a-game-of-shadows-2011","title":"Sherlock Holmes: A Game of Shadows","director":"Guy Ritchie","year":2011,"half":6,"review":"","spoilers":""},{"slug":"source-code-2011","title":"Source Code","director":"Duncan Jones","year":2011,"half":6,"review":"","spoilers":""},{"slug":"the-adjustment-bureau-2011","title":"The Adjustment Bureau","director":"George Nolfi","year":2011,"half":6,"review":"","spoilers":""},{"slug":"the-adventures-of-tintin-2011","title":"The Adventures of Tintin","director":"Steven Spielberg","year":2011,"half":6,"review":"","spoilers":""},{"slug":"the-muppets-2011","title":"The Muppets","director":"James Bobin","year":2011,"half":6,"review":"","spoilers":""},{"slug":"we-bought-a-zoo-2011","title":"We Bought a Zoo","director":"Cameron Crowe","year":2011,"half":6,"review":"","spoilers":""},{"slug":"despicable-me-2010","title":"Despicable Me","director":"Pierre Coffin, Chris Renaud","year":2010,"half":6,"review":"","spoilers":""},{"slug":"harry-potter-and-the-deathly-hallows-part-1-2010","title":"Harry Potter and the Deathly Hallows: Part 1","director":"David Yates","year":2010,"half":6,"review":"","spoilers":""},{"slug":"harry-potter-and-the-half-blood-prince-2009","title":"Harry Potter and the Half-Blood Prince","director":"David Yates","year":2009,"half":6,"review":"","spoilers":""},{"slug":"night-at-the-museum-battle-of-the-smithsonian-2009","title":"Night at the Museum: Battle of the Smithsonian","director":"Shawn Levy","year":2009,"half":6,"review":"","spoilers":""},{"slug":"x-men-origins-wolverine-2009","title":"X-Men Origins: Wolverine","director":"Gavin Hood","year":2009,"half":6,"review":"","spoilers":""},{"slug":"bedtime-stories-2008","title":"Bedtime Stories","director":"Adam Shankman","year":2008,"half":6,"review":"","spoilers":""},{"slug":"iron-man-2008","title":"Iron Man","director":"Jon Favreau","year":2008,"half":6,"review":"","spoilers":""},{"slug":"quantum-of-solace-2008","title":"Quantum of Solace","director":"Marc Forster","year":2008,"half":6,"review":"The second Bond installment starring Daniel Craig.\nQuantum of Solace peers a little deeper into the character's psyche, teasing out a little further the depth of this strange and enigmatic character.\nThe main plot is passable, weighed down by a somewhat superfluous secondary plot attached to a somewhat superfluous supporting character. The same tight dialogue and generous action sequences keep things moving nicely, but you wonder sometimes at the direction of the plot; it's not quite aimless, just a little confused. Part of this is in presenting two villains - one, a CEO with nefarious plans for a third-world nation, the other, a petty dictator of said third-world nation. Both villains' plans are inexplicable. No matter. Bond's suaveness will always save the day.","spoilers":""},{"slug":"the-curious-case-of-benjamin-button-2008","title":"The Curious Case of Benjamin Button","director":"David Fincher","year":2008,"half":6,"review":"","spoilers":""},{"slug":"harry-potter-and-the-order-of-the-phoenix-2007","title":"Harry Potter and the Order of the Phoenix","director":"David Yates","year":2007,"half":6,"review":"","spoilers":""},{"slug":"ratatouille-2007","title":"Ratatouille","director":"Brad Bird, Jan Pinkava","year":2007,"half":6,"review":"","spoilers":""},{"slug":"the-bourne-ultimatum-2007","title":"The Bourne Ultimatum","director":"Paul Greengrass","year":2007,"half":6,"review":"","spoilers":""},{"slug":"harry-potter-and-the-goblet-of-fire-2005","title":"Harry Potter and the Goblet of Fire","director":"Mike Newell","year":2005,"half":6,"review":"","spoilers":""},{"slug":"kicking-and-screaming-2005","title":"Kicking & Screaming","director":"Jesse Dylan","year":2005,"half":6,"review":"","spoilers":""},{"slug":"star-wars-episode-iii-revenge-of-the-sith-2005","title":"Star Wars: Episode III – Revenge of the Sith","director":"George Lucas","year":2005,"half":6,"review":"","spoilers":""},{"slug":"i-robot-2004","title":"I, Robot","director":"Alex Proyas","year":2004,"half":6,"review":"","spoilers":""},{"slug":"starsky-and-hutch-2004","title":"Starsky & Hutch","director":"Todd Phillips","year":2004,"half":6,"review":"This was a stupid but funny buddy-up comedy. When I say stupid, I mean that in a positive way, the kind which has corny lines, a predictable plot and various idiotic situations; and yet, it's perfect for a buddy-up comedy. I wouldn't have it any other way. See, the purpose of movies is to engage their audience - the way a comedy does this is by making people laugh.\n\nThough stupid, this movie made me not only grin and chuckle, it made me laugh, so in my books, it is a successful comedy. By no means a cinematic tour de force, Starsky and Hutch is nevertheless a comedic riot.","spoilers":""},{"slug":"the-bourne-supremacy-2004","title":"The Bourne Supremacy","director":"Paul Greengrass","year":2004,"half":6,"review":"","spoilers":""},{"slug":"johnny-english-2003","title":"Johnny English","director":"Peter Howitt","year":2003,"half":6,"review":"","spoilers":""},{"slug":"signs-2002","title":"Signs","director":"M. Night Shyamalan","year":2002,"half":6,"review":"","spoilers":""},{"slug":"spider-man-2002","title":"Spider-Man","director":"Sam Raimi","year":2002,"half":6,"review":"","spoilers":""},{"slug":"the-bourne-identity-2002","title":"The Bourne Identity","director":"Doug Liman","year":2002,"half":6,"review":"","spoilers":""},{"slug":"bandits-2001","title":"Bandits","director":"Barry Levinson","year":2001,"half":6,"review":"Bandits is an off-beat heist flick, with strong elements of comedy and romance to boot. The story is framed as if through a true crime special, which itself is framed through extended flashbacks.\n\nTwo bank robbers escape from prison and go on a series of bank robberies; one, a smooth confidence man, the other a neurotic, medically obsessed schemer.\n\nThe comedy comes from their sleepover kidnapping of the bank manager, or, in one notable case, a random woman who stays with them. Suffice to say, the heist parts are terrific (notably the beginning and end) but the romance is kinda boring (second act).","spoilers":""},{"slug":"monsters-inc-2001","title":"Monsters, Inc.","director":"Pete Docter, David Silverman, Lee Unkrich","year":2001,"half":6,"review":"","spoilers":""},{"slug":"mission-impossible-ii-2000","title":"Mission: Impossible II","director":"John Woo","year":2000,"half":6,"review":"","spoilers":""},{"slug":"star-wars-episode-i-the-phantom-menace-1999","title":"Star Wars: Episode I – The Phantom Menace","director":"George Lucas","year":1999,"half":6,"review":"","spoilers":""},{"slug":"toy-story-2-1999","title":"Toy Story 2","director":"John Lasseter, Ash Brannon, Lee Unkrich","year":1999,"half":6,"review":"","spoilers":""},{"slug":"ronin-1998","title":"Ronin","director":"John Frankenheimer","year":1998,"half":6,"review":"Who needs a plot anyway? This is an action thriller distilled to only the most essential elements: car chases, double-crosses and fatalities. However, that doesn't necessarily translate to trashiness. The directing here is surprisingly refined, while a high-calibre all-star cast led by Robert De Niro makes it all even better. Which brings me back to plot. Cool characters in cool places doing cool things will inevitably be entertaining, but won't necessarily engage beyond entertainment. This being true, a mere McGuffin - in the unimaginative form of a briefcase no less - will have to suffice for plot.","spoilers":""},{"slug":"the-parent-trap-1998","title":"The Parent Trap","director":"Nancy Meyers","year":1998,"half":6,"review":"","spoilers":""},{"slug":"jumanji-1995","title":"Jumanji","director":"Joe Johnston","year":1995,"half":6,"review":"","spoilers":""},{"slug":"the-lion-king-1994","title":"The Lion King","director":"Roger Allers, Rob Minkoff","year":1994,"half":6,"review":"","spoilers":""},{"slug":"jurassic-park-1993","title":"Jurassic Park","director":"Steven Spielberg","year":1993,"half":6,"review":"","spoilers":""},{"slug":"mrs-doubtfire-1993","title":"Mrs. Doubtfire","director":"Chris Columbus","year":1993,"half":6,"review":"","spoilers":""},{"slug":"home-alone-1990","title":"Home Alone","director":"Chris Columbus","year":1990,"half":6,"review":"","spoilers":""},{"slug":"the-hunt-for-red-october-1990","title":"The Hunt for Red October","director":"John McTiernan","year":1990,"half":6,"review":"","spoilers":""},{"slug":"back-to-the-future-1985","title":"Back to the Future","director":"Robert Zemeckis","year":1985,"half":6,"review":"","spoilers":""},{"slug":"e-t-the-extra-terrestrial-1982","title":"E.T. the Extra-Terrestrial","director":"Steven Spielberg","year":1982,"half":6,"review":"","spoilers":""},{"slug":"the-empire-strikes-back-1980","title":"The Empire Strikes Back","director":"Irvin Kershner","year":1980,"half":6,"review":"","spoilers":""},{"slug":"all-the-presidents-men-1976","title":"All the President's Men","director":"Alan J. Pakula","year":1976,"half":6,"review":"\"How have you gone with getting in?\"\n\"We haven't had any luck yet.\"\n\"Get some.\"\n\nAll the President's Men follows two Washington Post reporters - Bob Woodward and Carl Bernstein - as they investigate and report what we now know as the Watergate affair. What at first seems like a suspicious break-in at a government facility, eventually escalates into a wide scale political conspiracy, of rigged elections, bribed officials, hushed up informants and stolen documents... And, it all actually happened.\n\nTo uncover what occurred required scores of interviews, telephone calls and good old investigative work. Even when legitimate information was uncovered, all sources refused to go on the record.\n\nUnfortunately, with so many names and shady accusations being thrown around, it's fairly difficult to keep track of what's specifically going on, other than a vague direction of Bob and Carl getting closer to a story.\n\nThe score is virtually non-existent, and is only used for brief tense moments... This is a pity. Something like music would have helped to move along the snail speed pace of the investigation. Acting is adequate, with the two main reporters providing just enough star power.\n\nThough a slow slog at times, All The President's Men was undeniably interesting purely by virtue of its content. Furthermore, its style has set a strong precedent in investigative journalism movies; most notably, I think of Steven Spielberg's The Post. If you're interested, give it a watch, but on the whole I'd say it's probably not worth it.","spoilers":""},{"slug":"rocky-1976","title":"Rocky","director":"John G. Avildsen","year":1976,"half":6,"review":"","spoilers":""},{"slug":"jaws-1975","title":"Jaws","director":"Steven Spielberg","year":1975,"half":6,"review":"","spoilers":""},{"slug":"butch-cassidy-and-the-sundance-kid-1969","title":"Butch Cassidy and the Sundance Kid","director":"George Roy Hill","year":1969,"half":6,"review":"","spoilers":""},{"slug":"the-woman-in-cabin-10-2025","title":"The Woman in Cabin 10","director":"Simon Stone","year":2025,"half":5,"review":"If you're looking for a decent enough thriller-mystery to pass your evening, by all means go for it, but just be prepared for something highly derivative. Unfortunately a strong cast, solid acting and stimulating visuals don't quite make up for a tragically cliché plot. And instead of leaning into the mystery, the film's attention is instead focused on the thriller aspects, to varying degrees of success. There are a few sequences which embody the paranoia and fear through how they are presented and edited, which was a novel and engaging feature. But fundamentally, it just doesn't do it for me.","spoilers":""},{"slug":"gladiator-ii-2024","title":"Gladiator II","director":"Ridley Scott","year":2024,"half":5,"review":"Though a little disjointed in parts, Gladiator 2 still carried the epicness which made the first installment so good in the first place.\nLarge scale battles and intense hand-to-hand combat carry the action, while political power plays and scheming carry the plot.\nThough this undeniably makes for premium entertainment, the overall focus remains just a little muddled; the cause of which is relying far too much on the first installment.\nUnneeded flashbacks and callbacks drew away from the drama at hand. On the flip side, truly sublime acting from Denzel Washington kept things interesting, his character throwing it all into sharp relief.","spoilers":""},{"slug":"creed-iii-2023","title":"Creed III","director":"Michael B. Jordan","year":2023,"half":5,"review":"","spoilers":""},{"slug":"operation-fortune-ruse-de-guerre-2023","title":"Operation Fortune: Ruse de Guerre","director":"Guy Ritchie","year":2023,"half":5,"review":"Operation Fortune is all style and no substance - in short, a popcorn pic, full of snarky banter and even snarkier action sequences. And yet in spite of this there are a few real gems which are able to set themselves apart from the flagrant and rampant use of cliché. The first is Hugh Grant, here a swanky billionaire arms dealer, and frankly hilarious. The second is the dispersion of a few really good scenes; the opening scene, the marquee finale, the conclusion of the elevator & chase scene. Aside from this, the pacing is also quite impressive; not a single moment is wasted, progressing quickly from the set up to the unfolding of the operation itself. The technical working of this movie is up to scratch, it just lacks any real stakes or substance.","spoilers":""},{"slug":"12-mighty-orphans-2021","title":"12 Mighty Orphans","director":"Ty Roberts","year":2021,"half":5,"review":"","spoilers":""},{"slug":"free-guy-2021","title":"Free Guy","director":"Shawn Levy","year":2021,"half":5,"review":"","spoilers":""},{"slug":"a-quiet-place-part-ii-2020","title":"A Quiet Place Part II","director":"John Krasinski","year":2020,"half":5,"review":"","spoilers":""},{"slug":"escape-room-2019","title":"Escape Room","director":"Adam Robitel","year":2019,"half":5,"review":"","spoilers":""},{"slug":"jumanji-the-next-level-2019","title":"Jumanji: The Next Level","director":"Jake Kasdan","year":2019,"half":5,"review":"","spoilers":""},{"slug":"just-mercy-2019","title":"Just Mercy","director":"Destin Daniel Cretton","year":2019,"half":5,"review":"Just Mercy is a slow burn legal procedural centered around innocent black men on death row in Alabama. The narrative choices and cinematic choices to tell this story are resounding; a character focused approach allows for a far more emotional attachment to the story while a minimalist soundtrack, slow pacing and plentiful close-up shots complement this. What complements it even further is the sheer magnetism of the acting, both of Michael B. Jordan's forcefully-hopeful attorney and even more so Jamie Foxx's death row inmate. As a movie this is good, but as a means of telling this particular story, this is top notch!","spoilers":""},{"slug":"spider-man-far-from-home-2019","title":"Spider-Man: Far From Home","director":"Jon Watts","year":2019,"half":5,"review":"","spoilers":""},{"slug":"the-peanut-butter-falcon-2019","title":"The Peanut Butter Falcon","director":"Tyler Nilson, Michael Schwartz","year":2019,"half":5,"review":"","spoilers":""},{"slug":"the-personal-history-of-david-copperfield-2019","title":"The Personal History of David Copperfield","director":"Armando Iannucci","year":2019,"half":5,"review":"","spoilers":""},{"slug":"yesterday-2019","title":"Yesterday","director":"Danny Boyle","year":2019,"half":5,"review":"","spoilers":""},{"slug":"aquaman-2018","title":"Aquaman","director":"James Wan","year":2018,"half":5,"review":"","spoilers":""},{"slug":"black-panther-2018","title":"Black Panther","director":"Ryan Coogler","year":2018,"half":5,"review":"","spoilers":""},{"slug":"instant-family-2018","title":"Instant Family","director":"Sean Anders","year":2018,"half":5,"review":"This is a comedy-drama about foster families. It's about what you'd expect it to be, with the added bonus of being actually funny. By leaning on an actually realistic representation, we get all the feels, but also all the real laughs as well.\n\nThough it leans a bit more on the drama than it does the comedy, any movie which can genuinely make me laugh will be worth watching. And in terms of the drama as well, though there was some inevitable cliché, much of it was fairly novel. Strong momentum also made a two hour flick go pretty quick. Overall, not nearly as bad as I thought it was going to be.","spoilers":""},{"slug":"johnny-english-strikes-again-2018","title":"Johnny English Strikes Again","director":"David Kerr","year":2018,"half":5,"review":"","spoilers":""},{"slug":"maze-runner-the-death-cure-2018","title":"Maze Runner: The Death Cure","director":"Wes Ball","year":2018,"half":5,"review":"","spoilers":""},{"slug":"solo-a-star-wars-story-2018","title":"Solo: A Star Wars Story","director":"Ron Howard","year":2018,"half":5,"review":"","spoilers":""},{"slug":"despicable-me-3-2017","title":"Despicable Me 3","director":"Kyle Balda, Pierre Coffin, Eric Guillon","year":2017,"half":5,"review":"","spoilers":""},{"slug":"going-in-style-2017","title":"Going in Style","director":"Zach Braff","year":2017,"half":5,"review":"Going in Style is a comfort comedy about three retirees robbing a bank. It is entirely predictable and yet entirely watchable. In this case, a surprisingly good production, cast and script is paired with a fairly quiet story to create a top-tier comfort film. It doesn't lean too heavily on crime, nor comedy, nor really even drama. But just enough of each makes for a unique category in its own right: the comfort film. By staying in this comfort zone, the most we can hope to gain as an audience is easy, modest entertainment. I don't have to think too hard, I don't have to feel too much - I can just sit back and enjoy the movie.","spoilers":""},{"slug":"guardians-of-the-galaxy-vol-2-2017","title":"Guardians of the Galaxy Vol. 2","director":"James Gunn","year":2017,"half":5,"review":"","spoilers":""},{"slug":"justice-league-2017","title":"Justice League","director":"Zack Snyder","year":2017,"half":5,"review":"","spoilers":""},{"slug":"pirates-of-the-caribbean-dead-men-tell-no-tales-2017","title":"Pirates of the Caribbean: Dead Men Tell No Tales","director":"Joachim Rønning, Espen Sandberg","year":2017,"half":5,"review":"","spoilers":""},{"slug":"spider-man-homecoming-2017","title":"Spider-Man: Homecoming","director":"Jon Watts","year":2017,"half":5,"review":"","spoilers":""},{"slug":"the-circle-2017","title":"The Circle","director":"James Ponsoldt","year":2017,"half":5,"review":"","spoilers":""},{"slug":"captain-america-civil-war-2016","title":"Captain Amer 009,"half":5,"review":"","spoilers":""},{"slug":"knowing-2009","title":"Knowing","director":"Alex Proyas","year":2009,"half":5,"review":"Knowing is an admittedly well made Nicolas Cage flick which relies too much on its premise and ultimately fails to deliver on its promise. The premise is superb - a girl accurately predicts 50 years' worth of disasters, whose predictions are found in a time capsule 50 years later. The last prediction is the end of the world. The exploration of this premise is highly visual and intriguing and entertaining. However, it runs out of steam in the second half, trapping itself in an almost inevitable conclusion. To some, there may lie further meaning, but to me, this remained vague entertainment, neither good nor bad.","spoilers":""},{"slug":"surrogates-2009","title":"Surrogates","director":"Jonathan Mostow","year":2009,"half":5,"review":"","spoilers":""},{"slug":"get-smart-2008","title":"Get Smart","director":"Peter Segal","year":2008,"half":5,"review":"Though it may have had some mildly funny moments, this action comedy remake of the classic 80s show doesn't try hard enough to be more than exactly that. Fair chunks of this movie you will spend cringing in that awkward, awful way which somehow still pops up consistently in P.G. Hollywood comedies. But in addition this movie earnestly wants to be an action movie as well, but it is obviously directed, written and staged by people used to comedy (if you could call it that). Absurd situations abound. It just doesn't lean far enough in either direction, and suffers because of it.","spoilers":""},{"slug":"journey-to-the-center-of-the-earth-2008","title":"Journey to the Center of the Earth","director":"Eric Brevig","year":2008,"half":5,"review":"","spoilers":""},{"slug":"madagascar-escape-2-africa-2008","title":"Madagascar: Escape 2 Africa","director":"Eric Darnell, Tom McGrath","year":2008,"half":5,"review":"","spoilers":""},{"slug":"wall-e-2008","title":"WALL·E","director":"Andrew Stanton","year":2008,"half":5,"review":"","spoilers":""},{"slug":"i-am-legend-2007","title":"I Am Legend","director":"Francis Lawrence","year":2007,"half":5,"review":"","spoilers":""},{"slug":"national-treasure-book-of-secrets-2007","title":"National Treasure: Book of Secrets","director":"Jon Turteltaub","year":2007,"half":5,"review":"","spoilers":""},{"slug":"the-great-debaters-2007","title":"The Great Debaters","director":"Denzel Washington","year":2007,"half":5,"review":"The Great Debaters is a surprisingly strong period piece, set in 30s black America, and centered on the story of how a group of black debaters from some backwater college went on to beat Harvard. I'd say spoiler, but from the very beginning you have a pretty good idea on the final outcome. What makes this film stand out from any other sports movie, and the painful cliché of a work based solely on winning or losing, is that the focus is instead on the individuals, enough so that the movie could probably have managed to be entertaining even without the debating. And yet, debating ends up being a thoughtful tool in communicating the themes and ideas of the movie. Racism is always rich ground for drama, a fact that is in full force here. To be clear, this is the raw and deep kind of drama I'm referring to, the kind that is so emotionally charged as to be electric. This is impressively conveyed by three strong young lead actors, the students, as well as the teacher, played masterfully by Denzel Washington. Washington also directed, portraying a simple but brutally effective small town community; though the focus in every frame is on the characters.\n\nThis is a great film - not quite groundbreaking or breathtaking, or mind-bending, but great in a quiet, grounded kind of way.","spoilers":""},{"slug":"the-simpsons-movie-2007","title":"The Simpsons Movie","director":"David Silverman","year":2007,"half":5,"review":"","spoilers":""},{"slug":"mission-impossible-iii-2006","title":"Mission: Impossible III","director":"J the-fellowship-of-the-ring-2001","title":"The Lord of the Rings: The Fellowship of the Ring","director":"Peter Jackson","year":2001,"half":5,"review":"","spoilers":""},{"slug":"the-emperors-new-groove-2000","title":"The Emperor's New Groove","director":"Mark Dindal","year":2000,"half":5,"review":"","spoilers":""},{"slug":"x-men-2000","title":"X-Men","director":"Bryan Singer","year":2000,"half":5,"review":"","spoilers":""},{"slug":"october-sky-1999","title":"October Sky","director":"Joe Johnston","year":1999,"half":5,"review":"While vaguely interesting and mildly entertaining, October Sky doesn't have enough substance to make it truly engaging. Four kids in an American coal town build rockets in an attempt to win a science fair – that should tell you everything you need to know about this movie.\n\nAnd as you might guess, the only reason such a movie could possibly exist is because it is based on a true story. If you like that sort of thing, there's a lot to like; otherwise, strap yourself in for a slow, quaint coming-of-age story, never quite entering the stage of what I would call boredom, but getting close.","spoilers":""},{"slug":"the-rainmaker-1997","title":"The Rainmaker","director":"Francis Ford Coppola","year":1997,"half":5,"review":"*The Rainmaker* is a legal drama told in an unusually meandering, multifaceted way. Rather than a single driving plot, the film presents a cluster of interrelated struggles faced by a young lawyer entering the profession: financial pressure, ethical dilemmas, corrupt corporate power, and romantic entanglements.\n\nThese threads are not tightly bundled in the conventional way, but unfold as parallel endeavors. While this structure initially feels unfocused, it works in retrospect, allowing character to take precedence over courtroom theatrics. The result is thoughtful rather than explosive, anchored by moral tension rather than spectacle. Also, Danny DeVito appears—for reasons that are never entirely clear.","spoilers":""},{"slug":"mission-impossible-1996","title":"Mission: Impossible","director":"Brian De Palma","year":1996,"half":5,"review":"","spoilers":""},{"slug":"home-alone-2-lost-in-new-york-1992","title":"Home Alone 2: Lost in New York","director":"Chris Columbus","year":1992,"half":5,"review":"","spoilers":""},{"slug":"batman-1989","title":"Batman","director":"Tim Burton","year":1989,"half":5,"review":"","spoilers":""},{"slug":"ferris-buellers-day-off-1986","title":"Ferris Bueller's Day Off","director":"John Hughes","year":1986,"half":5,"review":"","spoilers":""},{"slug":"the-karate-kid-part-ii-1986","title":"The Karate Kid Part II","director":"John G. Avildsen","year":1986,"half":5,"review":"","spoilers":""},{"slug":"ghostbusters-1984","title":"Ghostbusters","director":"Ivan Reitman","year":1984,"half":5,"review":"","spoilers":""},{"slug":"gremlins-1984","title":"Gremlins","director":"Joe Dante","year":1984,"half":5,"review":"","spoilers":""},{"slug":"the-karate-kid-1984","title":"The Karate Kid","director":"John G. Avildsen","year":1984,"half":5,"review":"","spoilers":""},{"slug":"rocky-iii-1982","title":"Rocky III","director":"Sylvester Stallone","year":1982,"half":5,"review":"","spoilers":""},{"slug":"rocky-ii-1979","title":"Rocky II","director":"Sylvester Stallone","year":1979,"half":5,"review":"","spoilers":""},{"slug":"superman-1978","title":"Superman","director":"Richard Donner","year":1978,"half":5,"review":"","spoilers":""},{"slug":"willy-wonka-and-the-chocolate-factory-1971","title":"Willy Wonka & the Chocolate Factory","director":"Mel Stuart","year":1971,"half":5,"review":"","spoilers":""},{"slug":"north-by-northwest-1959","title":"North by Northwest","director":"Alfred Hitchcock","year":1959,"half":5,"review":"","spoilers":""},{"slug":"to-catch-a-thief-1955","title":"To Catch a Thief","director":"Alfred Hitchcock","year":1955,"half":5,"review":"","spoilers":""},{"slug":"a-quiet-place-day-one-2024","title":"A Quiet Place: Day One","director":"Michael Sarnoski","year":2024,"half":4,"review":"A lot was done right in this A Quiet Place prequel. Set in NYC, the set-up is the first day of the noise sensitive and vicious creatures landing on Earth. Where this could have been a disastrous cash grab, the story instead opts to introduce a few interesting ideas; the trouble is that they don't quite come off right.\n\nThe biggest mishap of all was the baggage of too much sentimentality - this is a thriller after all. Maybe this would have landed better if I had been able to invest in the main character more? Technically, the harrowing sense of suspense is still omnipresent, but the impact is not quite as effective as the original's.","spoilers":""},{"slug":"juror-2-2024","title":"Juror #2","director":"Clint Eastwood","year":2024,"half":4,"review":"Juror #2 is a fairly basic courtroom drama, with the focus on the titular 2nd juror, who realises he has a little more to do with the case than he first thought. This is a small film in presence, filled with common, down-to-earth characters and driven by a plot which could happen to anyone.\n\nAnd while these are all by no means bad qualities in a movie, they do mean in their unremarkable nature that a little more is demanded from somewhere else. But no; the script and cinematography and acting are all equally as commonplace. This is a well-enough made movie, but unfortunately it lacks enough presence to truly capture character, in all their raw humanity.\n\nIn fact, humanity is the key underlying thematic driver of this movie, put in contrast with the merciless authority of governmental bodies.\n\nAnd while it is a kind of little guy sticking it to the man, the man isn't so much a bad guy as an overworked, frustrated little guy himself. The truly admirable thing about this movie is its smallness. It's not trying to be a blockbuster or a work of art. It is not trying to win awards or make money. It is simply trying to entertain, and it does just that.","spoilers":""},{"slug":"twisters-2024","title":"Twisters","director":"Lee Isaac Chung","year":2024,"half":4,"review":"Twisters, a remake of the 90s disaster film, is pure popcorn entertainment. It's about tornadoes in Oklahoma set in the 2020s - that just about tells you everything you need to know. Such a movie was never going to have a perfect script or soundtrack, but it may surprise you in having near perfect acting and visual effects. The acting kudos all go to supporting actor Glen Powell, whose sheer star power carries this film whenever it threatens to stagnate. And in terms of visual effects, they've achieved quite a feat in capturing the grandeur of a cloud formation and (obviously) tornadoes, each about as realistic as imaginable. The plot, a meandering, light-on affair, is well judged in its stakes. There is no need to save the world (thank goodness), like every other disaster movie that's ever existed. Instead, just check out our characters and some cool looking tornadoes.\n\nDon't worry, we'll make it entertaining to watch. This too is handled well - scenes of home life are succeeded by sequences of genuine terror, which are then framed by dialogue, then a montage.\n\nThough no masterpiece, Twisters achieves what it set out to do.","spoilers":""},{"slug":"avatar-the-way-of-water-2022","title":"Avatar: The Way of Water","director":"James Cameron","year":2022,"half":4,"review":"","spoilers":""},{"slug":"death-on-the-nile-2022","title":"Death on the Nile","director":"Kenneth Branagh","year":2022,"half":4,"review":"","spoilers":""},{"slug":"enola-holmes-2-2022","title":"Enola Holmes 2","director":"Harry Bradbeer","year":2022,"half":4,"review":"","spoilers":""},{"slug":"the-adam-project-2022","title":"The Adam Project","director":"Shawn Levy","year":2022,"half":4,"review":"","spoilers":""},{"slug":"escape-room-tournament-of-champions-2021","title":"Escape Room: Tournament of Champions","director":"Adam Robitel","year":2021,"half":4,"review":"","spoilers":""},{"slug":"ghostbusters-afterlife-2021","title" "","spoilers":""},{"slug":"brave-2012","title":"Brave","director":"Mark Andrews, Brenda Chapman, Steve Purcell","year":2012,"half":4,"review":"","spoilers":""},{"slug":"madagascar-3-europes-most-wanted-2012","title":"Madagascar 3: Europe's Most Wanted","director":"Eric Darnell, Tom McGrath, Conrad Vernon","year":2012,"half":4,"review":"","spoilers":""},{"slug":"the-lorax-2012","title":"The Lorax","director":"Chris Renaud, Kyle Balda","year":2012,"half":4,"review":"","spoilers":""},{"slug":"cars-2-2011","title":"Cars 2","director":"John Lasseter, Bradford Lewis","year":2011,"half":4,"review":"","spoilers":""},{"slug":"j-edgar-2011","title":"J. Edgar","director":"Clint Eastwood","year":2011,"half":4,"review":"While on many fronts this was shaping up to be a movie not worth watching, there was a small and subtle twist at the end which just tipped it over the edge. That and an actual interest in the subject matter, J. Edgar Hoover, founder and director of the FBI, famous for his pioneering of a federal approach to criminal justice as well as fingerprint databases, and infamous for his minor blackmailing of each of the six presidents he worked under. The film goes for a nested narrative, with the elderly Hoover dictating his recollections of the humble beginnings of both himself and the bureau. Though interesting, there is no real driving force to the narrative. It doesn't quite help matters that as far as cinematography goes things were pretty weak. Most shots were fairly ugly, and the soundtrack followed much of the same.\n\nBut where this movie did shine was in its acting. DiCaprio is characteristically outstanding, going deep to truly capture not just the character but the person behind that character as well. If not for a few weaknesses, both structural and superficial, this could have been much better. Instead you'll have to settle for what it is.","spoilers":""},{"slug":"thor-2011","title":"Thor","director":"Kenneth Branagh","year":2011,"half":4,"review":"","spoilers":""},{"slug":"shrek-forever-after-2010","title":"Shrek Forever After","director":"Mike Mitchell","year":2010,"half":4,"review":"","spoilers":""},{"slug":"the-karate-kid-2010","title":"The Karate Kid","director":"Harald Zwart","year":2010,"half":4,"review":"","spoilers":""},{"slug":"toy-story-3-2010","title":"Toy Story 3","director":"Lee Unkrich","year":2010,"half":4,"review":"","spoilers":""},{"slug":"cloudy-with-a-chance-of-meatballs-2009","title":"Cloudy with a Chance of Meatballs","director":"Phil Lord, Christopher Miller","year":2009,"half":4,"review":"","spoilers":""},{"slug":"land-of-the-lost-2009","title":"Land of the Lost","director":"Brad Silberling","year":2009,"half":4,"review":"","spoilers":""},{"slug":"up-2009","title":"Up","director":"Pete Docter, Bob Peterson","year":2009,"half":4,"review":"","spoilers":""},{"slug":"21-2008","title":"21","director":"Robert Luketic","year":2008,"half":4,"review":"","spoilers":""},{"slug":"the-chronicles-of-narnia-prince-caspian-2008","title":"The Chronicles of Narnia: Prince Caspian","director":"Andrew Adamson","year":2008,"half":4,"review":"","spoilers":""},{"slug":"fantastic-four-rise-of-the-silver-surfer-2007","title":"Fantastic Four: Rise of the Silver Surfer","director":"Tim Story","year":2007,"half":4,"review":"","spoilers":""},{"slug":"next-2007","title":"Next","director":"Lee Tamahori","year":2007,"half":4,"review":"Next is another trashy action flick with a decent enough idea, but mediocre execution. Cage stars as a Vegas magician who can see two minutes into the future, and only his future - as an idea, bucketloads of potential. Unfortunately, the film-makers couldn't quite settle on how to express this visually; then, they had to go ahead and add another caveat, that he can also see a random woman at an unknown time in the future. And you can guess where that led. Also there's a Russian nuke and the FBI think Cage - I mean Johnson - can help them. So yeah. Ultimately entertaining, and at moments sublime, but you'd need less than two brain cells to actually appreciate it.","spoilers":""},{"slug":"shrek-the-third-2007","title":"Shrek the Third","director":"Chris Miller, Raman Hui","year":2007,"half":4,"review":"","spoilers":""},{"slug":"spider-man-3-2007","title":"Spider-Man 3","director":"Sam Raimi","year":2007,"half":4,"review":"","spoilers":""},{"slug":"transformers-2007","title":"Transformers","director":"Michael Bay","year":2007,"half":4,"review":"","spoilers":""},{"slug":"invincible-2006","title":"Invincible","director":"Ericson Core","year":2006,"half":4,"review":"","spoilers":""},{"slug":"the-hitchhikers-guide-to-the-galaxy-2005","title":"The Hitchhiker's Guide to the Galaxy","director":"Garth Jennings","year":2005,"half":4,"review":"","spoilers":""},{"slug":"finding-nemo-2003","title":"Finding Nemo","director":"Andrew Stanton, Lee Unkrich","year":2003,"half":4,"review":"","spoilers":""},{"slug":"x2-2003","title":"X2","director":"Bryan Singer","year":2003,"half":4,"review":"","spoilers":""},{"slug":"scooby-doo-2002","title":"Scooby-Doo","director":"Raja Gosnell","year":2002,"half":4,"review":"","spoilers":""},{"slug":"star-wars-episode-ii-attack-of-the-clones-2002","title":"Star Wars: Episode II – Attack of the Clones","director":"George Lucas","year":2002,"half":4,"review":"","spoilers":""},{"slug":"the-lord-of-the-rings-the-two-towers-2002","title":"The Lord of the Rings: The Two Towers","director":"Peter Jackson","year":2002,"half":4,"review":"","spoilers":""},{"slug":"the-dish-2000","title":"The Dish","director":"Rob Sitch","year":2000,"half":4,"review":"","spoilers":""},{"slug":"the-lost-world-jurassic-park-1997","title":"The Lost World: Jurassic Park","director":"Steven Spielberg","year":1997,"half":4,"review":"","spoilers":""},{"slug":"batman-forever-1995","title":"Batman Forever","director":"Joel Schumacher","year":1995,"half":4,"review":"","spoilers":""},{"slug":"toy-story-1995","title":"Toy Story","director":"John Lasseter","year":1995,"half":4,"review":"","spoilers":""},{"slug":"back-to-the-future-part-iii-1990","title":"Back to the Future Part III","director":"Robert Zemeckis","year":1990,"half":4,"review":"","spoilers":""},{"slug":"back-to-the-future-part-ii-1989","title":"Back to the Future Part II","director":"Robert Zemeckis","year":1989,"half":4,"review":"","spoilers":""},{"slug":"the-karate-kid-part-iii-1989","title":"The Karate Kid Part III","director":"John G. Avildsen","year":1989,"half":4,"review":"","spoilers":""},{"slug":"superman-iii-1983","title":"Superman III","director":"Richard Lester","year":1983,"half":4,"review":"","spoilers":""},{"slug":"the-king-of-comedy-1982","title":"The King of Comedy","director":"Martin Scorsese","year":1982,"half":4,"review":"As a film, The King of Comedy is by all means well-made, well-acted and well-produced. But watching this movie was quite painful to say the least, purely due to the specific brand of awkwardness it inflicts. The kind where you can see from a mile away in scenes that it's not going to end well, and yet you watch on in a transfixed kind of horror as it unfolds before your eyes. And yet there is something of a magic trick in the way you are drawn in, and continually engaged.\n\nThe plot follows a nobody who is completely psychotically obsessed with a comic, not just for their sake, but for the sake of breaking into the comedy industry. Parts of this movie feel like a fever dream, and some parts are. The reality of this film is only as grounded as the reality of the Pupkin character, making for a thought-provoking exploration. Even the final resolution upon further inspection seems not so resolved, or even based in reality. You can see where other movies borrowed similar ideas; The Informant! and The Secret Life of Walter Mitty spring to mind. In spite of all this undeniable depth, the actual act of watching such blatant and extreme self-deprecation was just too much in too many places. Such social sadism is shocking and thoughtful, but ultimately it's just not my cup of tea.","spoilers":""},{"slug":"raiders-of-the-lost-ark-1981","title":"Raiders of the Lost Ark","director":"Steven Spielberg","year":1981,"half":4,"review":"This movie has not aged well. Though you can see some iconic and well thought out art choices, ultimately the standard for this kind of movie has risen too high to take Indiana Jones seriously. Most prominently, the action sequences are almost laughably chunky; but, this is a symptom of a much larger problem - almost nothing onscreen is believable. From the plot to the characters to the very McGuffin of the story itself, all of it is completely unbelievable, both in the real world, and even in the supposedly mystical world this story is set in. Aside from all this, some of the shots, especially all those including the use of shadows, were sublime.\n\nSpielberg yes. Indiana Jones no.","spoilers":""},{"slug":"superman-ii-1980","title":"Superman II","director":"Richard Lester, Richard Donner","year":1980,"half":4,"review":"","spoilers":""},{"slug":"the-man-who-knew-too-much-1956","title":"The Man Who Knew Too Much","director":"Alfred Hitchcock","year":1956,"half":4,"review":"","spoilers":""},{"slug":"the-wrong-man-1956","title":"The Wrong Man","director":"Alfred Hitchcock","year":1956,"half":4,"review":"","spoilers":""},{"slug":"dial-m-for-murder-1954","title":"Dial M for Murder","director":"Alfred Hitchcock","year":1954,"half":4,"review":"","spoilers":""},{"slug":"amsterdam-2022","title":"Amsterdam","director":"David O. Russell","year":2022,"half":3,"review":"","spoilers":""},{"slug":"minions-the-rise-of-gru-2022","title":"Minions: The Rise of Gru","director":"Kyle Balda, Brad Ableson, Jonathan del Val","year":2022,"half":3,"review":"","spoilers":""},{"slug":"thor-love-and-thunder-2022","title":"Thor: Love and Thunder","director":"Taika Waititi","year":2022,"half":3,"review":"","spoilers":""},{"slug":"black-widow-2021","title":"Black Widow","director":"Cate Shortland","year":2021,"half":3," is of its existence.\nA man is woken up from cryosleep 90 years before arriving at his destination. A passable enough first half explores this premise. Then a fairly dismal second half follows the inevitable outcomes. Watching this movie is like watching someone throw a ball – once it's in the air you know exactly where it's going to land. Not a single twist or turn in the plot is present at all. The premise of a movie is supposed to invite suspense, speculation; no amount of decent special effects (its only redeeming feature) will ever make up for a lack of plot interest.","spoilers":""},{"slug":"the-secret-life-of-pets-2016","title":"The Secret Life of Pets","director":"Chris Renaud","year":2016,"half":3,"review":"","spoilers":""},{"slug":"daddys-home-2015","title":"Daddy's Home","director":"Sean Anders","year":2015,"half":3,"review":"Daddy's Home is a stereotypical American comedy at its most stereotypical, by which I mean its worst. The key underlying assumption of American comedy is fundamentally flawed - stupidity does not equal hilarity. It just equals stupidity.\n\nPart of this stupidity is that it's not even set in the real world, but some semi-surrealist one where a hand can perform an electric shock. And sure, watching a father and step-father one up each other is amusing, but it's not funny. At no point did I actually laugh, so this has failed as a film. Nice try Will Ferrell & Mark Wahlberg.","spoilers":""},{"slug":"fantastic-four-2015","title":"Fantastic Four","director":"Josh Trank","year":2015,"half":3,"review":"","spoilers":""},{"slug":"maze-runner-the-scorch-trials-2015","title":"Maze Runner: The Scorch Trials","director":"Wes Ball","year":2015,"half":3,"review":"","spoilers":""},{"slug":"the-intern-2015","title":"The Intern","director":"Nancy Meyers","year":2015,"half":3,"review":"Quaint chic-flick. One funny moment. Mostly fluff.","spoilers":""},{"slug":"the-amazing-spider-man-2-2014","title":"The Amazing Spider-Man 2","director":"Marc Webb","yea often barely intelligible, smothered by an accent so thick it borders on parody.\n\nThis is unfortunate, because what dialogue *is* decipherable is sharp and strong, and the film is occasionally buoyed by handsome framing and composition. Still, there is a fine line between a slow burn and simply being slow, and too often this film crosses it.","spoilers":""},{"slug":"eagle-eye-2008","title":"Eagle Eye","director":"D.J. Caruso","year":2008,"half":3,"review":"","spoilers":""},{"slug":"charlie-and-the-chocolate-factory-2005","title":"Charlie and the Chocolate Factory","director":"Tim Burton","year":2005,"half":3,"review":"","spoilers":""},{"slug":"jurassic-park-iii-2001","title":"Jurassic Park III","director":"Joe Johnston","year":2001,"half":3,"review":"","spoilers":""},{"slug":"a-bugs-life-1998","title":"A Bug's Life","director":"John Lasseter, Andrew Stanton","year":1998,"half":3,"review":"","spoilers":""},{"slug":"close-encounters-of-the-third-kind-1977","title":"Close Encounters of the Third Kind","director":"Steven Spielberg","year":1977,"half":3,"review":"","spoilers":""},{"slug":"psycho-1960","title":"Psycho","director":"Alfred Hitchcock","year":1960,"half":3,"review":"","spoilers":""},{"slug":"kung-fu-panda-4-2024","title":"Kung Fu Panda 4","director":"Mike Mitchell","year":2024,"half":2,"review":"Another mindless sequel. Give up already.","spoilers":""},{"slug":"ant-man-and-the-wasp-quantumania-2023","title":"Ant-Man and the Wasp: Quantumania","director":"Peyton Reed","year":2023,"half":2,"review":"","spoilers":""},{"slug":"black-panther-wakanda-forever-2022","title":"Black Panther: Wakanda Forever","director":"Ryan Coogler","year":2022,"half":2,"review":"","spoilers":""},{"slug":"doctor-strange-in-the-multiverse-of-madness-2022","title":"Doctor Strange in the Multiverse of Madness","director":"Sam Raimi","year":2022,"half":2,"review":"","spoilers":""},{"slug":"fantastic-beasts-the-secrets-of-dumbledore-2022","title":"Fantastic Beasts: The Secrets of Dumbled
