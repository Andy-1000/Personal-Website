<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Novels | Andy Sansness</title>
<meta name="description" content="Every novel Andy has read and rated, sortable by star rating, release year or author.">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/png" href="thumbs_up_.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="book-covers/sprite.jpg?v=8834a788fd">
<style>
  :root {
    --blue: #004d99;
    --navy: #003366;
    --sky: #cce6ff;
    --sky-soft: #e9f3ff;
    --paper: #ffffff;
    --ink: #14243a;
    --muted: #6b7a8b;
    --hairline: #dbe6f1;
    --gold: #e0a100;
    --star-empty: #d9e2ec;
    --gutter: 16px;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Open Sans", sans-serif;
    line-height: 1.6;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  ::selection { color: #fff; background: var(--blue); }

  img { display: block; max-width: 100%; }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- heading ---------- */
  header.page {
    text-align: center;
    padding: calc(2rem + env(safe-area-inset-top)) var(--gutter) 0.25rem;
  }

  header.page h1 {
    font-family: "Merriweather", serif;
    font-weight: 400;
    font-size: clamp(1.8rem, 7vw, 2.6rem);
    line-height: 1.2;
    color: var(--navy);
    margin: 0;
  }

  /* ---------- sort switch ---------- */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    justify-content: center;
    padding: 0.75rem var(--gutter);
    background: rgba(255, 255, 255, 0.9);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    transition: box-shadow 0.2s ease;
  }

  .toolbar.stuck { box-shadow: 0 1px 0 var(--hairline); }

  .switch {
    display: inline-flex;
    padding: 4px;
    border: 2px solid var(--sky);
    border-radius: 999px;
    background: #fff;
  }

  .switch button {
    font: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--blue);
    background: transparent;
    border: 0;
    border-radius: 999px;
    padding: 0.45rem 1.1rem;
    min-height: 40px;
    white-space: nowrap;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .switch button[aria-pressed="true"] { background: var(--blue); color: #fff; }
  .switch button:not([aria-pressed="true"]):hover { background: var(--sky-soft); }
  .switch button:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }

  /* ---------- page column ---------- */
  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 0.25rem calc(var(--gutter) + env(safe-area-inset-right)) 3rem calc(var(--gutter) + env(safe-area-inset-left));
  }

  /* ---------- overview chart ---------- */
  .viz {
    margin: 0.75rem 0 0.5rem;
    padding: 1.1rem 1.25rem 0.9rem;
    border: 1px solid var(--hairline);
    border-radius: 16px;
    background: linear-gradient(180deg, #fbfdff 0%, #ffffff 70%);
  }

  .viz-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.2rem 1rem;
    margin-bottom: 0.9rem;
  }

  .viz-head h2 {
    margin: 0;
    font-family: "Open Sans", sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--navy);
  }

  .viz-key {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.78rem;
    color: var(--muted);
  }

  /* the key swatch is one sprite cell, kept at the same 2:3 as every other cover */
  .viz-key i {
    display: inline-block;
    width: 8px;
    height: 12px;
    border-radius: 2px;
    background: url("book-covers/sprite.jpg?v=8834a788fd") 0 0 / 64px auto;
  }

  .plot {
    position: relative;
    width: 100%;
    height: 200px;
    transition: height 0.65s cubic-bezier(0.2, 0.8, 0.2, 1);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .plot.instant, .plot.instant * { transition: none !important; }

  /* one tiny cover per novel: 16 x 24, so it scales as a 2:3 poster, never a square */
  .dot {
    position: absolute;
    top: 0;
    left: 0;
    width: 16px;
    height: 24px;
    transform-origin: 0 0;
    will-change: transform;
    transition: transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.25s ease;
    pointer-events: none;
  }

  .dot .face {
    display: block;
    width: 16px;
    height: 24px;
    border-radius: 2px;
    background-image: url("book-covers/sprite.jpg?v=8834a788fd");
    background-size: 128px auto;
    background-color: var(--sky);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }

  .plot.hovering .dot { opacity: 0.45; }
  .plot.hovering .dot.hot { opacity: 1; z-index: 3; }

  .dot.hot .face {
    transform: scale(2.6);
    box-shadow: 0 0 0 1px #fff, 0 3px 10px rgba(0, 25, 51, 0.35);
  }

  .axis {
    position: absolute;
    background: var(--hairline);
    transition: all 0.65s cubic-bezier(0.2, 0.8, 0.2, 1);
    pointer-events: none;
  }

  .labels { position: absolute; inset: 0; pointer-events: none; }
  .labels.fade { animation: labelsIn 0.45s ease both 0.2s; }
  @keyframes labelsIn { from { opacity: 0; } }

  .lab {
    position: absolute;
    font-size: 0.72rem;
    line-height: 1;
    color: var(--muted);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .lab.center { transform: translateX(-50%); }
  .lab.right { transform: translate(-100%, -50%); }
  .lab.left { transform: translateY(-50%); }
  .lab.count { font-weight: 600; color: var(--ink); opacity: 0.7; }
  .lab.peak { font-weight: 600; color: var(--navy); }

  button.lab {
    pointer-events: auto;
    font: inherit;
    font-size: 0.74rem;
    line-height: 1;
    color: var(--ink);
    background: transparent;
    border: 0;
    border-radius: 6px;
    padding: 6px 7px;
    margin: -6px -7px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 2px;
    -webkit-tap-highlight-color: transparent;
  }

  button.lab.center { transform: translateX(-50%); }
  button.lab.right { transform: translate(-100%, -50%); }
  button.lab:hover { background: var(--sky-soft); color: var(--blue); }
  button.lab:focus-visible { outline: 2px solid var(--blue); outline-offset: 0; }
  button.lab[disabled] { cursor: default; color: #a7b3bf; background: transparent; }
  .lab svg { width: 0.95em; height: 0.95em; fill: var(--gold); flex: none; }
  button.lab[disabled] svg { fill: var(--star-empty); }
  .lab.unrated { color: var(--muted); }

  /* ---------- tooltip ---------- */
  .tip {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 0.7rem;
    width: max-content;
    max-width: min(300px, calc(100vw - 24px));
    padding: 0.55rem 0.75rem 0.55rem 0.55rem;
    border-radius: 12px;
    background: #fff;
    box-shadow: 0 1px 2px rgba(0, 25, 51, 0.12), 0 12px 32px rgba(0, 25, 51, 0.22);
    opacity: 0;
    visibility: hidden;
    transform: translateY(4px);
    transition: opacity 0.14s ease, transform 0.14s ease, visibility 0s linear 0.14s;
    pointer-events: none;
  }

  .tip.on {
    opacity: 1;
    visibility: visible;
    transform: none;
    transition: opacity 0.14s ease, transform 0.14s ease;
  }

  .tip.touch { pointer-events: auto; cursor: pointer; }

  .tip .tc {
    flex: none;
    width: 44px;
    height: 66px;
    border-radius: 4px;
    background-color: var(--sky-soft);
    background-size: cover;
  }

  .tip .tt {
    font-size: 0.86rem;
    font-weight: 600;
    line-height: 1.3;
    color: var(--ink);
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
  }

  .tip .ta { font-size: 0.78rem; line-height: 1.35; color: var(--muted); }

  .tip .tm {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    margin-top: 0.2rem;
    font-size: 0.75rem;
    color: var(--muted);
  }

  .tip .tm .stars { font-size: 12px; }
  .tip .go { display: none; margin-top: 0.25rem; font-size: 0.75rem; font-weight: 600; color: var(--blue); }
  .tip.touch .go { display: block; }

  /* ---------- shelves ---------- */
  .shelf { margin-top: 1.8rem; scroll-margin-top: 76px; }

  .shelf-head {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding-bottom: 0.55rem;
    margin-bottom: 1rem;
    border-bottom: 1px solid var(--sky);
  }

  .shelf-head h2 {
    margin: 0;
    font-family: "Merriweather", serif;
    font-weight: 400;
    font-size: 1.2rem;
    line-height: 1.3;
    color: var(--navy);
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .shelf-head .n {
    margin-left: auto;
    font-size: 0.8rem;
    color: var(--muted);
    white-space: nowrap;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 1.4rem 1.1rem;
  }

  .card {
    display: block;
    width: 100%;
    min-width: 0;
    padding: 0;
    border: 0;
    background: none;
    text-align: left;
    font: inherit;
    color: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  /* every cover is the same 2:3 poster, whatever the source image */
  .art {
    position: relative;
    width: 100%;
    aspect-ratio: 2 / 3;
    border-radius: 6px;
    overflow: hidden;
    background: var(--sky-soft);
    box-shadow: 0 1px 2px rgba(20, 36, 58, 0.12), 0 4px 14px rgba(20, 36, 58, 0.08);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }

  .art img {
    position: absolute;
    inset: 0;
    z-index: 1;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .art img.ready { opacity: 1; }

  .fallback {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.8rem;
    text-align: center;
    font-family: "Merriweather", serif;
    font-size: 0.85rem;
    line-height: 1.35;
    color: var(--navy);
    overflow-wrap: anywhere;
  }

  @media (hover: hover) {
    .card:hover .art {
      transform: translateY(-3px);
      box-shadow: 0 2px 4px rgba(20, 36, 58, 0.14), 0 10px 24px rgba(20, 36, 58, 0.16);
    }
  }

  .card:active .art { transform: scale(0.97); }
  .card:focus-visible { outline: none; }
  .card:focus-visible .art { outline: 3px solid var(--blue); outline-offset: 3px; }

  .card .t,
  .card .a {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 1;
    overflow: hidden;
    overflow-wrap: anywhere;
  }

  .card .t {
    margin-top: 0.55rem;
    font-size: 0.88rem;
    font-weight: 600;
    line-height: 1.3;
    color: var(--ink);
  }

  .card .a {
    font-size: 0.8rem;
    line-height: 1.35;
    color: var(--muted);
  }

  .card .sub {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    margin-top: 0.15rem;
    min-height: 14px;
  }

  /* ---------- stars ---------- */
  .stars { display: inline-flex; gap: 1px; line-height: 0; flex: none; }
  .stars svg { width: 1em; height: 1em; }
  .stars .on { fill: var(--gold); }
  .stars .off { fill: var(--star-empty); }
  .card .stars { font-size: 12px; }
  .shelf-head .stars { font-size: 18px; }
  .unrated-label { font-size: 0.75rem; line-height: 1.2; color: var(--muted); }

  /* ---------- detail dialog ---------- */
  dialog {
    width: min(880px, calc(100vw - 32px));
    max-width: none;
    max-height: calc(100dvh - 32px);
    padding: 0;
    border: 0;
    border-radius: 16px;
    color: var(--ink);
    background: #fff;
    box-shadow: 0 24px 70px rgba(0, 25, 51, 0.35);
    overflow: hidden;
    overscroll-behavior: contain;
  }

  dialog::backdrop {
    background: rgba(0, 25, 51, 0.55);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
  }

  dialog[open] { animation: rise 0.22s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px) scale(0.98); } }

  .detail {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    /* the row has to be allowed to shrink, or a long review makes .info taller
       than the dialog and the prev / next arrows fall outside it */
    grid-template-rows: minmax(0, 1fr);
    max-height: calc(100dvh - 32px);
  }

  /* a 2:3 cover is half again as tall as it is wide, so the height budget sets the width */
  .detail .cover {
    position: relative;
    align-self: start;
    width: min(260px, calc((100dvh - 32px - 3.2rem) / 1.5));
    aspect-ratio: 2 / 3;
    margin: 1.6rem 0 1.6rem 1.6rem;
    border-radius: 8px;
    overflow: hidden;
    background: var(--sky-soft);
    box-shadow: 0 4px 18px rgba(20, 36, 58, 0.15);
  }

  .detail .cover img { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; object-fit: cover; }
  .detail .cover .fallback { font-size: 1.1rem; padding: 1.2rem; }

  .detail .info {
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
    padding: 1.6rem 1.6rem 1.2rem;
    overflow-y: auto;
    overscroll-behavior: contain;
  }

  .detail h2 {
    margin: 0 2.4rem 0 0;
    font-family: "Merriweather", serif;
    font-weight: 400;
    font-size: clamp(1.3rem, 4.5vw, 1.75rem);
    line-height: 1.25;
    color: var(--navy);
    overflow-wrap: anywhere;
  }

  .detail .by {
    margin: 0.35rem 0 0;
    font-size: 1rem;
    color: var(--blue);
    font-weight: 600;
  }

  .detail .facts {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.4rem 1rem;
    margin: 0.8rem 0 0;
    font-size: 0.88rem;
    color: var(--muted);
  }

  .detail .facts .stars { font-size: 20px; }

  .detail .review { margin: 1.1rem 0 0; font-size: 0.95rem; white-space: pre-line; }
  .detail .review.empty { color: var(--muted); font-style: italic; }

  .detail .pick {
    margin: 1rem 0 0;
    padding: 0.6rem 0.8rem;
    border-left: 3px solid var(--blue);
    background: var(--sky-soft);
    border-radius: 0 8px 8px 0;
    font-size: 0.9rem;
  }

  .detail .pick b { color: var(--navy); font-weight: 600; }

  .detail nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.5rem;
    margin-top: auto;
    padding-top: 1.2rem;
  }

  .detail nav .pos { font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }

  .round {
    flex: none;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 2px solid var(--blue);
    background: #fff;
    color: var(--blue);
    font-size: 1.05rem;
    line-height: 1;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, color 0.15s ease, transform 0.12s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .round:hover { background: var(--blue); color: #fff; }
  .round:active { transform: scale(0.94); }
  .round:focus-visible { outline: 3px solid var(--navy); outline-offset: 3px; }

  .close {
    position: absolute;
    top: 0.9rem;
    right: 0.9rem;
    z-index: 2;
    width: 40px;
    height: 40px;
    border-color: var(--sky);
    background: rgba(255, 255, 255, 0.92);
    font-size: 1.35rem;
  }

  /* ---------- footer ---------- */
  footer {
    border-top: 1px solid var(--sky);
    text-align: center;
    padding: 1rem var(--gutter) calc(1rem + env(safe-area-inset-bottom));
    font-size: 0.78rem;
    color: #7a8795;
  }

  /* ---------- custom cursor (desktop only, matches the rest of the site) ---------- */
  .cursor { pointer-events: none; }
  .cursor .ball { position: fixed; top: 0; left: 0; z-index: 1000; will-change: transform; }

  /* the dialog sits in the browser's top layer, above the custom cursor, so it uses the normal pointer */
  .modal-open .cursor { display: none; }

  @media (pointer: fine) {
    body, a, button { cursor: none; }
    dialog, dialog::backdrop { cursor: auto; }
    dialog button { cursor: pointer; }
  }

  @media (pointer: coarse) {
    .cursor { display: none; }
  }

  /* ---------- tablets ---------- */
  @media (max-width: 900px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 1.25rem 0.9rem; }
  }

  /* ---------- phones ---------- */
  @media (max-width: 640px) {
    header.page { padding-top: calc(1.5rem + env(safe-area-inset-top)); }
    .viz { padding: 0.9rem 0.9rem 0.8rem; border-radius: 14px; }
    .viz-head { margin-bottom: 0.75rem; }
    .viz-head h2 { font-size: 0.9rem; }
    .viz-key { font-size: 0.72rem; }

    .shelf { margin-top: 1.5rem; }
    .shelf-head h2 { font-size: 1.05rem; gap: 0.45rem; }
    .shelf-head .stars { font-size: 15px; }

    .grid {
      grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
      gap: 1.1rem 0.7rem;
    }
    .card .t { font-size: 0.8rem; }
    .card .a { font-size: 0.74rem; }
    .card .stars { font-size: 11px; }

    dialog { width: calc(100vw - 20px); max-height: calc(100dvh - 20px); border-radius: 14px; }
    .detail {
      grid-template-columns: minmax(0, 1fr);
      /* on phones the whole card scrolls as one, so the rows size to content */
      grid-template-rows: auto;
      max-height: calc(100dvh - 20px);
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    .detail .cover { width: min(46%, 24dvh); margin: 1.4rem auto 0; }
    .detail .info { overflow: visible; padding: 1.1rem 1.15rem 1rem; }
    .detail h2 { margin: 0 0.5rem; text-align: center; }
    .detail .by { text-align: center; }
    .detail .facts { justify-content: center; }
    .detail nav {
      position: sticky;
      bottom: -1rem;
      margin: 0 -1.15rem -1rem;
      padding: 0.7rem 1.15rem calc(0.7rem + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(255,255,255,0) 0%, #fff 30%);
    }
    .close { top: 0.6rem; right: 0.6rem; }
  }

  @media (max-width: 360px) {
    :root { --gutter: 12px; }
    .switch button { padding: 0.45rem 0.8rem; font-size: 0.82rem; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>

<div class="cursor" aria-hidden="true">
  <div class="ball big">
    <svg height="50" width="50"><circle cx="25" cy="25" r="20" stroke-width="0" style="fill:#cce6ff;opacity:.7"></circle></svg>
  </div>
  <div class="ball small">
    <svg height="10" width="10"><circle cx="5" cy="5" r="4" stroke-width="0" style="fill:#004d99"></circle></svg>
  </div>
</div>

<header class="page">
  <h1>Novels</h1>
</header>

<div class="toolbar" id="toolbar">
  <div class="switch" role="group" aria-label="Sort novels by">
    <button type="button" data-sort="rating" aria-pressed="true">Rating</button>
    <button type="button" data-sort="year" aria-pressed="false">Release year</button>
    <button type="button" data-sort="author" aria-pressed="false">Author</button>
  </div>
</div>

<main>
  <section class="viz" aria-labelledby="vizTitle" aria-describedby="vizSummary">
    <div class="viz-head">
      <h2 id="vizTitle">Every novel, by rating</h2>
      <span class="viz-key" aria-hidden="true"><i></i>Each cover is one novel</span>
    </div>
    <div class="plot" id="plot">
      <div class="tiles" id="tiles" aria-hidden="true"></div>
      <div class="labels" id="labels"></div>
    </div>
    <p class="sr-only" id="vizSummary" aria-live="polite"></p>
  </section>

  <div id="shelves"></div>
</main>

<footer>
  All reviews by Andy.
</footer>

<script>
(function () {
  "use strict";

  /* Generated from the Fiction Reviews notes. half = rating in half stars (10 = 5 stars), null = not yet rated */
  var NOVELS = [{"slug":"a-naked-singularity-sergio-de-la-pava","title":"A Naked Singularity","author":"Sergio De La Pava","year":2012,"half":10,"pick":null,"review":"Hands down the best book I've read this year. Maybe ever? In fact very likely ever. A Naked Singularity is a lot of things; it is the story of a young lawyer in New York; it is a crime thriller; it's a philosophical discourse; it is a riveting snapshot of 80s boxing; it is a biting satire of the American criminal justice system; it is a fever dream of a novel that alternates between the starkness of reality and the surrealness of the mind. It is also sharply hilarious. The way this novel can be all these things is through copious amounts of tangents, tangents which nevertheless flow with the momentum of the narrative, sometimes shifting into completely new territory but always moving forward. The reason every tangent remains so engaging is twofold – for one, the flow acts like all human thought does, thought unrestrained and unleashed. Of course, it's going to find connections, follow rabbit holes. For another, the prose is stellar. Readable to the utmost while explaining heavy concepts, shifting arrays of character and weaving various levels of abstraction. It helps as well to have a hefty scattering of zingers hidden amongst the fold, because there is a certain element of subtlety at play, the kind where you blink and you miss it. All these elements may seem like a bit much for the average reader, the kind who just wants a simple, straightforward story. Not for me. There's something in that post-modern literary fiction which hits different. Reflecting on the overall impression it left on me, A Naked Singularity seems so much more human, a story that transcends being a mere story and becomes a reflection of life. It's also simply as entertaining as hell."},{"slug":"a-prisoner-of-birth-jeffrey-archer","title":"A Prisoner of Birth","author":"Jeffrey Archer","year":2008,"half":7,"pick":null,"review":"A powerful story of revenge, complete with Archer's characteristic storytelling and a razor-sharp plot."},{"slug":"a-tale-of-two-cities-charles-dickens","title":"A Tale of Two Cities","author":"Charles Dickens","year":1859,"half":3,"pick":null,"review":"This particular Dickens didn't do it for me. I enjoyed Oliver Twist. I hated Great Expectations. And I can't say I have much feeling at all around A Tale of Two Cities. About a third of the way in, there was nothing keeping me engaged or invested in the story. So I stopped. I don't deny it could be enjoyed; I don't deny it could be hated. In the end I remain on the fence between the two. The writing had to be read slowly, if you get what I mean, and suffered from some cultural dissonance. The characters seemed more like characteristics, while the plot stagnated."},{"slug":"the-alloy-of-law-brandon-sanderson","title":"The Alloy of Law","author":"Brandon Sanderson","year":2011,"half":6,"pick":null,"review":"*Mistborn Era 2 Book 1*\n\nThough fun, The Alloy of Law feels just a bit lackluster as a complete story. Between the character introductions and establishment of setting, as well as references and plot points setting up future payoffs, there was little room left for the actual plot itself. Even the plot was disappointing - a criminal organisation is committing robberies and the apparent solution is to... kill them all? Apart from this, the primary redeeming feature beyond the customarily epic worldbuilding was the whimsy of one particular character, who, while not quite laugh-out-loud, was undeniably amusing. Overall though, there just wasn't quite enough substance."},{"slug":"annihilation-jeff-vandermeer","title":"Annihilation","author":"Jeff VanderMeer","year":2014,"half":4,"pick":null,"review":"Took too long. Did not finish. Too bad."},{"slug":"billy-summers-stephen-king","title":"Billy Summers","author":"Stephen King","year":2021,"half":1,"pick":null,"review":"Too long, too boring, too witless. Nice try."},{"slug":"children-of-time-adrian-tchaikovsky","title":"Children of Time","author":"Adrian Tchaikovsky","year":2015,"half":8,"pick":null,"review":"Children of Time is sci-fi of the best kind (or at least the best of what I expect from the genre). What drives the story is its ideas, ideas so numerous and diverse that you can't help but want to know more.\n\nAll these ideas are built on the premise of a terraforming project gone wrong, creating a society of sentient spiders, as well as a ship carrying the last remaining humans.\n\nWhile as a sci-fi this novel does well, it does admittedly lack a little in the character department (as so many often do). A remarkable job is done presenting the spider characters as the timeline jumps from generation to generation - instead of individuals, we are presented with recurring archetypes of a similar character.\n\nIronically, it is the human characters, and in particular the main human character, who seem stuck just observing it all without any real agency.\n\nHowever, a ripper plot saves the day here, with the underlying tension of an eventual showdown hanging between the pages from the very start, and the progression towards it only heightening the effectiveness of the ideas at play.\n\nSpanning centuries at breakneck pace, Children of Time makes for a smart, enjoyable and engaging read."},{"slug":"dark-matter-blake-crouch","title":"Dark Matter","author":"Blake Crouch","year":2016,"half":5,"pick":null,"review":"First off, don't be fooled by the title or the blurb - this is not science fiction, this is a thriller. Sure, the mechanics of the plot rely on some sort of a science fiction concept, but they remain squarely on the periphery.\n\nWhat drives this book is action; short, fast-paced scenes, clipped fast-paced dialogue and rushed fast-paced characterization.\n\nAnd because the driver is action, not the writing itself, prose is handled very superficially. The rhythm is undeniably there, but there is no art to it. I must say that this is not a bad thing. This style of writing is purely in service to the plot, and as such it does a masterful job. As for the plot itself, conceptually it was very well handled, though one could argue that it lacked a certain depth.\n\nMan kidnapped by alternate self, man finds his way back to his world, man reclaims his life. And yet the twists and turns along the way make the journey top quality. Again - this is reminiscent of the fact that this is written as a thriller, not a sci-fi.\n\nFor the record, as a thriller it does an outstanding job - to be on the edge of your seat, to want to know at every moment what happens next. But once it all happens, it leaves you wondering if there is just a bit more..."},{"slug":"deaths-end-liu-cixin","title":"Death's End","author":"Liu Cixin","year":2010,"half":7,"pick":null,"review":"Death's End marks the conclusion of the Earth's Past trilogy, and marks the end of a wildly creative history spanning space and time at its very furthest limits. This book is brimming with enough ideas to populate a lesser author's entire body of work. And yet the expression of these ideas is not just in terms of density, but also complexity.\n\nInterrelations between ideas abound - even more, the building of and upon them as well. And yet this is all necessary to cram so much into the story. The protagonist, another representative of humanity, is this time a more empathetic, though equally helpless soul. In this way she serves as both a contrast for humanity's desperate, survivalist drive, as well as a parallel for the hopeless, doomed situation humanity continues to find itself in, decade after decade, century after century. And yet in spite of this, Death's End remains a restlessly human story.\n\nThough the focus is on humanity's history and how it unfolds, this character and their development are still the vehicle for telling this story. Of course, because they are not the primary focus, characterization suffers a bit, especially when a completely new character is introduced purely for the sake of exposition. So be it. What makes this story worth reading is its ideas, ideas that are so captivating that every step of the way I remained absolutely dying to know what happened next."},{"slug":"false-impression-jeffrey-archer","title":"False Impression","author":"Jeffrey Archer","year":2006,"half":6,"pick":null,"review":"False Impression, by Jeffrey Archer, is a fast-paced thriller set in the world of classical art collectors, dealers, and consumers. Although oftentimes wildly improbable, False Impression was also wildly enjoyable; it's the type of story where you excuse the unbelievability, for the pure reason that you want to see what happens next.\n\nAfter an action-packed first act - one of the first plot points is the 9/11 attack, and it doesn't get much more action-packed than that - the story then shifts gear into a high-paced, globetrotting chase. From then on until the finale, the story is driven primarily by tension, not action. Despite the busyness of the plot, it remains remarkably grounded in its characters and stakes. Talking of stakes, the plot revolves around the possession of a valuable Van Gogh, and like many MacGuffins, you wonder sometimes whether it's really worth the effort. Two more nits to pick:\n\n1. Why do so many characters need photographic memory? Nine times out of ten it is totally needless. 2. Why does the bad guy need a second in command if they are going to be barely differentiable characters?\n\nOther than that, the plot moves along wonderfully, which is helped by sharp, speedy prose. Characters are diverse, but ultimately secondary to the plot; they are only just interesting enough for the audience to be invested in them."},{"slug":"farewell-my-lovely-raymond-chandler","title":"Farewell, My Lovely","author":"Raymond Chandler","year":1940,"half":7,"pick":null,"review":"Farewell, My Lovely is another triumph of dramatic prose and hardboiled noir from the world of Raymond Chandler's Philip Marlowe. The plot, similar in formula to some other installments, follows two separate crimes, seemingly unrelated, and then slowly but surely links them together.\n\nThe array of shared supporting characters in this particular installment is much wider, and yet each of them is rendered so completely: instantly recognizable, yet completely unique. You know the kind of person they are without them being some clichéd archetype. The devil's in the details.\n\nOverall, another highly satisfying mystery."},{"slug":"honour-among-thieves-jeffrey-archer","title":"Honour Among Thieves","author":"Jeffrey Archer","year":1993,"half":4,"pick":null,"review":"An entertaining but shallow thriller."},{"slug":"if-we-were-villains-m-l-rio","title":"If We Were Villains","author":"M.L. Rio","year":2017,"half":5,"pick":null,"review":"There's a fine line between a narrative, and a bunch of characters with a bunch of things happening to them. Though the narrative is definitely there, the slow burn structure makes it difficult to see. If We Were Villains is, at its core, a murder mystery; layered upon this is what's known as dark academia, as well as Shakespearean theatre, not to mention a frankly redundant nested callback from some year in the future. The ingredients were there for a decent whodunnit; the trouble was the needless extra weight. Slow burns can be powerful, but something does have to burn eventually."},{"slug":"little-big-john-crowley","title":"Little, Big","author":"John Crowley","year":1981,"half":6,"pick":null,"review":"Little, Big left me seriously conflicted as to whether it was worth reading or not. On one hand you have a generously proportioned narrative where very little happens for the first 150 or so pages, and which doesn't really have what I might typically call a plot. But on the other hand you have some of the most consistently magnificent prose I've ever seen, along with the most visceral realisation of wonder and magic. This is truly unlike any book I've read before - there are elements of fantasy, myth, postmodernism, romance, stream-of-consciousness. The direction of the novel very squarely takes the route of storytelling as opposed to any structured approach. The perspective shifts from chapter to expansive chapter between the members of the five-generation Drinkwater family, swiftly and somewhat spontaneously switching between generations. See, this family are part of A Tale, and because of it they are protected. And so their tale is told, full of love and betrayal and happenings of all sorts, until finally it comes to a conclusion, or rather an increasingly abstract and figurative resolution. If you are after a unique story, occasionally baffling and occasionally frustratingly so, this is worth a try."},{"slug":"magpie-murders-anthony-horowitz","title":"Magpie Murders","author":"Anthony Horowitz","year":2016,"half":6,"pick":null,"review":"This nested meta-fictional who-done-it does well to walk the line between gimmicky novelty (novelty for the sake of novelty) and innovation (novelty as a result of imitation). Where it doesn't quite come up to scratch is in the full impact of the reveal. The best reveals leave you kicking yourself, wondering how you didn't see it earlier; these reveals, upon reflection, seemed fairly left of field. Regardless, the plotting in and of itself is nigh flawless, a complex web is laid bare, though not without a fair amount of effort. Homages to the golden age of crime novels are saturated throughout the novel, both implicitly in the first half and explicitly in the second. Ironically, without the second half's metafictional commentary and genre-teasing at work, the first half would be inexcusably cliché. Equally, the slower, more procedural nature of the first half is paid off in its necessity to the second half. A lesser author could have handled the entire concept far more clumsily than the intelligent, tight work which Horowitz delivers. If only it were just a little more impactful, a little more engaging every step of the way, it could be one of the greats. As it stands, it's still a ripping, damn strong read."},{"slug":"night-watch-terry-pratchett","title":"Night Watch","author":"Terry Pratchett","year":2002,"half":10,"pick":null,"review":"What sounds a bit silly on paper makes unquestionable sense in the context of the story and the Discworld in which it is set. The thing is, Night Watch is clear about what it needs to do, and it does it well. It is not trying to be a satire; a pure police procedural; a pure fantasy; a pure time travel adventure; a pure revolution novel; a pure comedy. It is in fact all of these things, and it is this unique, unparalleled combination of things that transcends cliché and makes Night Watch a truly great story. And to then wrap up this story in such biting, effortless prose makes Night Watch a truly great novel."},{"slug":"no-country-for-old-men-cormac-mccarthy","title":"No Country for Old Men","author":"Cormac McCarthy","year":2005,"half":7,"pick":null,"review":"No Country for Old Men is a visceral, brutal Western of a distinctly modern flavor. Three characters – a sheriff, a psychopathic killer and an opportunistic civilian – collide in the wake of a drug deal which has produced a MacGuffin in the form of a bag of money. Now as a thriller it does its job, but the unique prose employed works to create something far deeper and richer than any mere thriller. While simplistic, the sentences and turns of phrase used conjure up so much meaning, so much detail. Such writing then works alongside the other stylistic choice from McCarthy, which is to show rather than tell. In this way, No Country for Old Men is a very visual, almost cinematic novel; where a cheap thriller would have a character tell another character what's going on in the story, this novel doesn't. This forces you to take in every word, and especially towards the end - to have a somewhat looser understanding of what's going on. There is no climax or resolution as such. There are a few climaxes throughout, while the final few chapters opt for a quiet peter-out. This novel is sophisticated yet reads simply; it is introspective yet impactful. It is also very vivid."},{"slug":"not-a-penny-more-not-a-penny-less-jeffrey-archer","title":"Not a Penny More, Not a Penny Less","author":"Jeffrey Archer","year":1976,"half":7,"pick":null,"review":"A well-built revenge sting, with strong characters and an entertaining (but slightly unbelievable) plot."},{"slug":"out-of-the-silent-planet-c-s-lewis","title":"Out of the Silent Planet","author":"C.S. Lewis","year":1938,"half":7,"pick":null,"review":"A climactic and somehow believable combination of mythos and science fiction, telling a story of good versus evil in the most cunning of forms - where it lacks slightly in plot, it makes up with outstanding prose."},{"slug":"piranesi-susanna-clarke","title":"Piranesi","author":"Susanna Clarke","year":2020,"half":7,"pick":null,"review":"Piranesi is a unique, spellbinding story told in a unique, spellbinding way. Uniqueness in both story and storytelling is a rarity, so it's a joy to encounter both. Both these aspects start simple, but as the book progresses, they snowball into something much greater. Piranesi starts with a world of statue-laden, sea-drenched halls, depicted and described through journal logs. As the world, or The House, is explored more deeply, the mystery at the heart of this story rises to mythic proportions; and, slowly but surely, each of its mysteries is revealed. Mythic truly is the word for the underlying atmosphere, one which is as ever-present as it is compelling. There is virtually no evidence of what would be classified as classical sci-fi, nor even fantasy. Rather, a sci-fi idea has been presented as a mythos. This narrative laying of myth onto an already mystifying, laden story works to great effect. The characters are few and far between, and as with many world driven novels, they are simply vehicles of exploration and of the plot.\n\nWhile some mysteries can become tedious, Piranesi is fortunately a very short book, offering an absorbing package guaranteed to take you places."},{"slug":"project-hail-mary-andy-weir","title":"Project Hail Mary","author":"Andy Weir","year":2021,"half":8,"pick":null,"review":"Project Hail Mary is an exemplary work of hard science fiction. An impending apocalypse, a space adventure and a scientific exploration. The set up – of an astronaut waking up in space with no memory of why he is there – is compelling, to say the least, and the slow piecing together of events is handled masterfully. To be perfectly honest, I can barely fault this book for what it is. Sure, the prose is basic and sometimes meanders a bit too deep into scientific context and sure, characterisation, or what little there is, is pretty flimsy – but that is what it's meant to be. What this novel does so well is nailing the exact genre niche it's aiming for. Though this means that some aspects suffer, on the flip-side it means that interesting and novel scientific ideas are introduced left, right and centre. If sci-fi introduces novel scientific ideas and explores them, hard sci-fi doesn't just explore these ideas, it dissects them, extends them, brings out every angle from which to view them, every angle bringing a new and novel perspective to an already novel idea. This is what Project Hail Mary excels at, in combination with decent storytelling, the kind of storytelling which knows how to keep an audience guessing."},{"slug":"rhythm-of-war-brandon-sanderson","title":"Rhythm of War","author":"Brandon Sanderson","year":2020,"half":6,"pick":null,"review":"*Stormlight Archive Book 4*\n\nWhat these books lack in brevity, they make up for in epicness. This fourth installment of the Stormlight Archive poses this paradox - is it worth trudging through approximately 200 redundant pages in a 1000+ page book? The answer, in this case, is yes. As a high fantasy come sci-fi epic, the main driver of this series is its worldbuilding, and in this Brandon Sanderson has done a work of unprecedented genius. Each installment without fail extends the border of its world at a remarkable rate. And, because the paradigm of the world shifts so consistently, so too does the plot. To solve a mystery is good, but if you can add some adventure, some fun, all the better. Where in other fantasy or sci-fi the world and plot are connected, here they are so closely knit as to be occasionally indistinguishable. Again, the paradox is in being presented with so many interesting details, all key to the plot, while also struggling to keep track of it all. I guess this is part of the prerogative of such length - it allows you to get clear on what's what. The final piece of this narrative is character. These characters are rich, flawed, multifaceted individuals; 'done well' is an understatement. Rhythm of War is a slog, but a triumphant one."},{"slug":"ripleys-game-patricia-highsmith","title":"Ripley's Game","author":"Patricia Highsmith","year":1974,"half":6,"pick":null,"review":"Ripley's Game is set very squarely in the thriller genre, and yet at times it reads almost like a mystery. When it does, the mystery almost always is how something will be achieved. It is this underlying interference which elevates the suspense. Most obviously, what differentiates Ripley's from the typical ludicrous globetrotting, high-stakes political/historical/spy thriller is that it is far more quaint and far more refined. The plot of the novel revolves around an acquaintance of Tom Ripley needing a murder to be done. Tom Ripley lives a life of leisure and has a past of dubious origins. Of course, Tom has just the person in mind. The game then is Ripley's manipulation of a perfectly ordinary man into committing murder. Compelling to be sure. To fully play out how this is done, the perspective rapidly shifts between Ripley and his victim.\n\nAt times it's as if Ripley has real compassion for this man, and at other times it seems as though he is completely using him. This moral ambiguity is played at, not only here, but also in the minds of both protagonists individually. When is it moral to murder a human being? Prose is basic, as usually befits a thriller, while the atmosphere has an enchanting European, 60s-era plainness, but it is not the focus. Murder is the focus."},{"slug":"roadside-picnic-arkady-and-boris-strugatsky","title":"Roadside Picnic","author":"Arkady & Boris Strugatsky","year":1972,"half":6,"pick":null,"review":"Roadside Picnic is a neat little sci-fi novella, but not one I would go out of my way to find. What you get is more of a quick foray rather than a deep dive, meaning the overall payoff of the story suffers. However, the premise is sound - random regions across the Earth are flooded with lethal scraps of alien paraphernalia, some of which can do some cool stuff. What brings an interesting point of difference to other sci-fi is the micro view rather than a macro view, that of a lowlife devoted to scavenging."},{"slug":"shadows-of-self-brandon-sanderson","title":"Shadows of Self","author":"Brandon Sanderson","year":2015,"half":7,"pick":null,"review":"*Mistborn Era 2 Book 2*\n\nWhere the first installment lacked the cohesion it needed, this second installment lifted the series considerably. Somehow the banter felt a bit wittier, the plot a bit tighter – with the characters and world already established, this makes sense. Most of all, it was a certain sense of 'bigger things at play' which Sanderson brings, too, a feature that was noticeably missing from the first one. The plot followed Wax and Wayne, big city lawmen, going after a powerful new foe. More than ever, the influence of Pratchett is evident, or rather attempted emulation. While an improvement, Shadows of Self still remains just a smidge unpolished. Being unblushingly unsophisticated doesn't mean it shouldn't have any polish."},{"slug":"shall-we-tell-the-president-jeffrey-archer","title":"Shall We Tell the President","author":"Jeffrey Archer","year":1977,"half":6,"pick":null,"review":"A taut political thriller."},{"slug":"sophies-world-jostein-gaarder","title":"Sophie's World","author":"Jostein Gaarder","year":1991,"half":8,"pick":null,"review":"Sophie's World is both a guide to the history of philosophy and a complementary meta-fictional narrative. By embedding elaborate and tricky ideas within a larger context, it becomes far more accessible; its conversational nature helps as well. In this way, the history of philosophy, including its key figures, eras and ideas, is packaged in a highly understandable and graspable format. Prose suffers a little due to translation, but this is not a book based primarily on its writing; instead the focus is on the philosophical ideas and how they are presented and explored. And my, are they explored. Sophie's World is truly a delight."},{"slug":"that-hideous-strength-c-s-lewis","title":"That Hideous Strength","author":"C.S. Lewis","year":1945,"half":8,"pick":null,"review":"A masterfully written battle between good and evil, detailing the diabolical machinations which unfold in the region of Belbury. From the beginning to the end of the novel a gradual transition occurs from political and humanitarian ideas, to a rich and dense tapestry of what can only be described as mythos; a blend of Arthurian legend, Greek religion and Christianity, all woven together effortlessly. The weakest part is the resolution (an embodiment of the mythos kind of just appears and deals with the evil), and yet the build around it is just so well done."},{"slug":"the-bands-of-mourning-brandon-sanderson","title":"The Bands of Mourning","author":"Brandon Sanderson","year":2016,"half":5,"pick":null,"review":"*Mistborn Era 2 Book 3*\n\nThis third installment of Mistborn Era II shows Sanderson's skill in building upon the foundation he's already set, in plot, characters and world. Where other authors slip into formulaic repetition, Sanderson excels in finding a fresh take with familiar characters, all of whom, by this point, the audience has become firmly invested in. As always it is the worldbuilding which takes center stage, with just enough development in character and plot to keep us engaged. Unfortunately the two major reveals were fairly predictable this time, but the climax still hit."},{"slug":"the-blade-itself-joe-abercrombie","title":"The Blade Itself","author":"Joe Abercrombie","year":2006,"half":5,"pick":null,"review":"The Blade Itself posed a conundrum, a dilemma universal to narrative - the balance between setup and payoff. As the first in a trilogy, it would be completely understandable to go fairly exposition-heavy in the first installment, but denying plot altogether is just too heavy handed for my liking. Not a single arc to be seen. All we are given is character, character, character. Not that this is a bad thing. But for my particular taste, I need something more than character to chew on. Even the fantasy elements are subdued, nigh on unnoticeable. You see a few uses of magic all up, and all of them are just flagrant violence. In fact, other than character, the writing is easily the second strongest part. The writing itself is closer to a thriller. Fast-paced and very easy to read. You'll find not a single trace of sophistication here. The Blade Itself is like most of its characters - brutish. Not dumb, not mindless, just gritty and grim in a simplistic, straightforward way. And so we come back to the conundrum. As a book, highly readable, highly engaging, right up until the moment you turn the final page. From there, there is no lasting payoff, no satisfying resolution, no effective closure. Nothing is resolved because there's barely anything to resolve in the first place."},{"slug":"city-of-glass-paul-auster","title":"City of Glass","author":"Paul Auster","year":1985,"half":3,"pick":null,"review":"Though a magnificent example of postmodernism, it is for this very reason that it arrives at an anticlimactic conclusion. City of Glass takes the premise of a typical hard-boiled detective novel, but in doing so deconstructs what such narratives create. Most of the novel, though short enough to be called a novella, follows the 'detective' and so reads like a typical mystery. However, the further along you go, the more the events become curiously uncanny, creating a sort of confused, indeterminate atmosphere. The prose is excellent, and the reading itself is actually enjoyable. The trouble is that it just stops. Deeper and deeper you've been led down this rabbit hole, and suddenly it drops into oblivion. Where the conclusion of a normal detective novel solves the mystery, there is a deep resolution, tying everything up in a neat bow and casting a new light on the events that preceded it. Here, the effect is the opposite; though the reading itself was enjoyable, without a satisfactory conclusion you are left unsatisfied. That's not to say it ends mid-mystery, it's just that the ending is not satisfying. As an example of postmodernist literature, you couldn't ask for better."},{"slug":"the-colour-of-magic-terry-pratchett","title":"The Colour of Magic","author":"Terry Pratchett","year":1983,"half":4,"pick":null,"review":"An inventive, witty and interesting fantasy, but it's Pratchett's debut - and it shows."},{"slug":"the-dark-forest-liu-cixin","title":"The Dark Forest","author":"Liu Cixin","year":2008,"half":6,"pick":null,"review":"The Dark Forest is an epic, spanning hundreds of years and thousands of light-years. And yet, despite this, it still remains grounded in its characters and in particular its protagonist. What sets up this book for success before it even begins is its premise: humanity is threatened by an all-seeing alien enemy approaching Earth from across the galaxy; but this enemy has no concept of deception. So, humanity has staked its resources and hopes on 'Wallfacers', whose strategy remains a secret. If I had one qualm in relation to this book, it would be that too much time is spent on characters in the periphery. Though, holistically, many of them were necessary for ongoing exposition, there were three old men who were completely redundant. Other than this, conceptual exploration was sublime, and focused not only on the traditional sci-fi vein of technology, but also on the implications for the cultural and political landscape. The richness of these considerations is in no small part due to the terrific pacing of The Dark Forest - to say that a lot happens is a massive understatement. However, where other novels may balk at such bulk, the plot and ideas considered are rendered highly coherent, and remain grounded in individuals, not events. Most impressive about The Dark Forest is the linking of thematic elements which are brought together in the final act, making for a resounding and powerful catharsis."},{"slug":"the-extraordinary-adventures-of-arsene-lupin-gentleman-burglar-maurice-leblanc","title":"The Extraordinary Adventures of Arsène Lupin, Gentleman-Burglar","author":"Maurice Leblanc","year":1907,"half":7,"pick":null,"review":"A highly entertaining collection of short stories detailing, well, it's in the name."},{"slug":"the-final-empire-brandon-sanderson","title":"The Final Empire","author":"Brandon Sanderson","year":2006,"half":7,"pick":null,"review":"*Mistborn Book 1*\n\nThe Final Empire has all of the intrigue of a classic Sanderson fantasy world, with an added touch of a neat, nicely (enough) resolved plot. (This is a rare find in the fantasy genre, where such resolution is typically traded for never-ceasing set-ups and for never-ceasing sequels). The world is of enslaved, feudal kingdoms, set in the aftermath of a Lord Ruler's conquest, where some people of noble blood can have powers when they consume metal.\n\nThe characters: a thriving crew, led by a rebellious leader and with a young girl in tow. The plot: a wanna-be heist, but really just a hero's journey. Each aspect on the surface seems fraught with insubstantial potential cliché, but they are admittedly handled with poise every step of the way. And thank goodness for this; without such an engaging narrative this novel would be in dire straits. This is all despite its prose, or rather lack thereof.\n\nSentences flow on the whole, but never shine. In the end, The Final Empire is more popcorn entertainment than seriously well written piece of literature. Part of this is also demonstrated in the subtle counterplay between whimsy and grittiness, never falling too far in either direction, while still providing sizable doses of both.\n\nA good read. A great narrative. A fine novel."},{"slug":"the-firm-john-grisham","title":"The Firm","author":"John Grisham","year":1991,"half":6,"pick":null,"review":"Interesting but ultimately one-dimensional thriller of a lawyer who accidentally falls in with a morally questionable law firm. Again, starts well but ends up becoming slightly ludicrous and unbelievable. Still, easy to read and doesn't require much thought."},{"slug":"the-goldfinch-donna-tartt","title":"The Goldfinch","author":"Donna Tartt","year":2013,"half":10,"pick":null,"review":"Behind the coming of age, set alongside orphanhood, is the enigma of a painting, stolen in pure coincidence, and the hidden driver behind the plot. Pacing is somewhat slow, especially around the middle, but in retrospect this reflects the plot and character in a way that seems very deliberate. What makes the pacing more forgivable is the deep knowledge embedded within every technical detail, from art, antique furniture and sports gambling to the cities where the events take place. Though long, this was a highly rewarding read. I'd also go so far as to say it has one of the best conclusions to a novel."},{"slug":"the-hero-of-ages-brandon-sanderson","title":"The Hero of Ages","author":"Brandon Sanderson","year":2008,"half":6,"pick":null,"review":"*Mistborn Book 3*\n\nWhile this was undoubtedly the third installment in a fantasy trilogy, at times it felt more like the third act of a murder mystery. That's because the primary driver here is plot - tying up multitudes of loose ends, some of which you didn't even realize existed. And, like any good third act of a murder mystery, these final conclusions and resolutions hit so hard. Like a puzzle that's been solved, a mechanism which clicks right into place, suddenly every element makes sense and fits into one cohesive whole. My one qualm is that it could have happened just a little quicker. That's not to fault the story as a whole, but just to suggest that there still was a fair bit of fat which could be trimmed.\n\nThe character arcs here definitely take the backfoot - not necessarily a bad thing. What's amazing though is how embedded world development is with plot development, almost using the world itself as the mystery which is being solved - its history, religion, economics, power - each gradually being revealed to further the immediate plot at hand, and eventually resolve it.\n\nWhile the writing and prose itself is fairly ordinary, the payoff of the story itself more than makes up for this.\n\nI challenge you to find a better trilogy."},{"slug":"the-last-policeman-ben-h-winters","title":"The Last Policeman","author":"Ben H. Winters","year":2012,"half":4,"pick":null,"review":"The Last Policeman takes a hard boiled detective story and puts it right in the context of a pre-apocalyptic society. The world will soon be destroyed by a meteorite, and in a time when suicides have become common-place, Detective Palace decides to investigate one suspicious case.\n\nIn terms of the hard boiled, police procedural elements, these are done very well; influences of and parallels with the works of Chandler are undeniably present. The Last Policeman subverts enough elements to make it unique. For one, the protagonist, Detective Palace, is borderline neurotic, a fanatic who finds the sheer intensity to explain every monstrosity.\n\nFor another, there is the world which is gradually portrayed, of what society might look like in the wake of an imminent apocalypse.\n\nThis is shown through exposition, directly but more often than not indirectly - for example using new colloquialisms, like 'hangers' and bucket lists. If anything, this could even have been doubled down on. This may have bridged the two driving features of the novel (murder mystery x pre-apocalypse) a bit better. Though there was some nice bridging not only in terms of behavior and motives but also existential reflections. My only qualm was a questionable side plot which lacked sense or closure, but which I'm guessing is followed up on in a later installment! Nice and short, too."},{"slug":"the-little-sister-raymond-chandler","title":"The Little Sister","author":"Raymond Chandler","year":1949,"half":8,"pick":null,"review":"The master of detective prose does it again, complete with a riveting plot and zingers coming off every page. Though, I concluded the plot of The Little Sister demonstrates a bit more depth and overall cohesiveness, which allows for some epic twists and a far more resolved, concise conclusion. Marlowe's moral compass gets him involved in the worst kind of trouble, and yet provides a subtle characterization. Between blackmail via tape, ice-pick murders and the obligatory dodgy doctor, Marlowe gets caught in a right mess, and yet he somehow (as always) comes out right as rain."},{"slug":"the-long-goodbye-raymond-chandler","title":"The Long Goodbye","author":"Raymond Chandler","year":1953,"half":9,"pick":null,"review":"There are two things which make The Long Goodbye the very best the mystery genre has to offer. The first is its prose. Every line of dialogue is as sharp as it is smooth. Every description is as immaculate as it is effective. And every other word shows either insight into the characters or progression of the plot. The second is its atmosphere. This is noir at its finest. The world of Philip Marlowe, private detective, is harsh, bitter and unforgiving. As a result, this makes Marlowe harsh, bitter and unforgiving as well. But, unlike most of the other characters, of which there is a dynamic and eclectic display, Philip still has a streak of sentimentality, of a quiet-but-not-quite honour. In one scene he'll be insulting the life out of somebody, and in the next he'll be refusing payment because he says he hasn't completed the job. The plot is occasionally disjointed, but ultimately cathartic. While most murder mysteries tend to rely on that final reveal, The Long Goodbye makes every step of the procedure just as interesting as the reveal itself. In fact, The Long Goodbye barely even reads like a murder mystery, even though that's fundamentally what it is. My summative thoughts? A masterpiece."},{"slug":"the-lost-metal-brandon-sanderson","title":"The Lost Metal","author":"Brandon Sanderson","year":2022,"half":6,"pick":null,"review":"*Mistborn Era 2 Book 4*\n\nThis final installment in the second era of the Mistborn series makes for an epic conclusion. Many long-standing plot threads are resolved, but for every question answered there naturally seemed to be another question implicitly raised. In a way this book in particular acts almost as an advertisement for Sanderson's other novels tied into the same universe, dubbed 'the cosmere'. Outside of this, on the scale of individual characters, we had some decent character arcs concluded as well, though they admittedly felt fairly forced and in some ways handled clumsily. And yet in spite of this, each resolution of an arc has an almost inevitable satisfaction. Likewise with the plot – not quite as tight as it could have been, but it had a solid resolution. To be perfectly honest, without the wider intrigue of the cosmere level worldbuilding, this quartet would probably be worth a miss. Though there are glimmers of mastery, the key point of interest has always been the worldbuilding. Character has been strong enough, plot just so; the writing itself remains in service of the story, not an end in itself. Era 2 of Mistborn is by no means bad, but by no means perfect."},{"slug":"the-mezzanine-nicholson-baker","title":"The Mezzanine","author":"Nicholson Baker","year":1988,"half":7,"pick":null,"review":"The Mezzanine, by Nicholson Baker, is a postmodern masterpiece which follows the thoughts of an office worker as he travels up the escalator of a 1980s office-space mezzanine.\n\nThough fictional, The Mezzanine is very much set in the real world; however, something odd is occurring as you progress through the story (could you even call it that?).\n\nThe trick Baker employs here is something you would very easily miss if you took the story at its surface value, and the trick is that every thought which the unnamed protagonist has, every unremarkable and commonplace observation, insight or anecdote is *carried out to the very end*.\n\nWhat I mean by this is when the protagonist mentions milk, having just bought some, he then delves into the historical progression of milk delivery and milk containers, touching also on the mechanics of ice cubes and societal isolation.\n\nAs this goes on, and continues in many different ways, the reader begins to realise that in the supposed course of five minutes travelling outside and then back up an escalator, the protagonist has conveyed several hours' worth of thoughts.\n\nIn real life this is completely impossible, and in this way The Mezzanine is very much fictional. And yet somehow there is some element of this which we can all relate to. We have all made insights which are not remarkable, nor groundbreaking, but are nevertheless interesting, and it's this, this fundamental phenomenon, that Baker is counting on for everyone to appreciate."},{"slug":"the-overstory-richard-powers","title":"The Overstory","author":"Richard Powers","year":2018,"half":7,"pick":null,"review":"The Overstory begins with what is essentially 8 short stories detailing the background of each of the 9 main characters.\n\nMy first impression of The Overstory was that it was simply a book about the lives of nine random people. But as their lives intertwine, you begin to realise that this is not a book about people. This is a book about trees.\n\nThe reason I began this book was that I had heard it recommended in an interview by Hugh Jackman, and it had been briefly mentioned in half a dozen other places in passing. Sure, a Pulitzer Prize as well. Whatever. At this point I'm only about halfway through, but man... The Overstory's prose is just staggering. Sure, the characters are interesting, and endearing, and flawed. I'm sure the subplots will cascade into a beautiful and heart-wrenching climax. But the thing is, the only reason I've kept reading is the effortless and smooth flow of Powers' prose. All I can say is keep it coming.\n\nSomething of a postmodern feel. Subtle self reference and analogies of books to trees, nature and life abound.\n\nIntelligent - ideas of programming, sociology, therapy, accounting.\n\nWith so many absurdly dramatic things happening, it couldn't have been too hard to achieve two or three more crossovers to achieve an entirely unified plot.\n\nQuotes:\n\nThe older the word, the more likely it is to be both useful and true\n\nLife has a way of talking to the future. It's called memory.\n\nSome see the glass as half empty, some as half full; an engineer sees a containment device twice as big as it needs to be.\n\nLife will not answer to reason. And meaning is too young a thing to have much power over it.\n\nI only went out for a walk and finally concluded to stay out till sundown, for going out, I found, was really going in.\n\nTrees fall with spectacular crashes. But planting is silent and growth is invisible.\n\nThey mean to hit his pride, but Douglas preempts them by having none."},{"slug":"the-paper-menagerie-ken-liu","title":"The Paper Menagerie","author":"Ken Liu","year":2016,"half":3,"pick":null,"review":"A collection of short stories which dance effortlessly between fantasy and science fiction. Smooth, easy reading, but nothing particularly top tier."},{"slug":"the-secret-history-donna-tartt","title":"The Secret History","author":"Donna Tartt","year":1992,"half":10,"pick":null,"review":"The Secret History is immersive. Between the sheer strength of both the writing, and what that writing creates, it is almost impossible not to be drawn into the world which Donna Tartt creates. The contents of this world are a handful of entitled, flawed college students, in a small Hampden college, and a murder. From the very beginning we know who committed the murder, as well as where and when and how. What we don't know, and what keeps us reading, is the question of why. However, this is not actually a book about a murder at all; rather, the murder, as well as the other events described in this book, is an illustration of human nature. Though each character searches and is driven by a search for beauty and meaning, they fail to recognize the terrible nature of such a chase. Of the novel itself I remain breath-taken. The prose is astounding, simultaneously creating perfectly realistic descriptions, so realistic they play out like scenes in the mind's eye, and alongside a slow burning pace which perpetually demands 'what happens next?'. There are many novels in which you have some indication of what will actually happen next, but from the second half of this novel onwards, you truly do have no earthly clue what will happen next. The Secret History is one of the best novels I have read in a long, long time."},{"slug":"the-space-trilogy-c-s-lewis","title":"The Space Trilogy","author":"C.S. Lewis","year":1938,"half":8,"pick":null,"review":"Just finished reading C.S. Lewis's Space Trilogy - *Out of the Silent Planet*, *Perelandra* and *That Hideous Strength*.\n\nInsane and utterly underrated trilogy - undoubtedly C.S. Lewis's magnum opus. The first book takes a fairly typical space adventure plot - more or less man vs unfamiliar environment, but fleshed out with such detail as to make it compellingly believable. The second book takes the same premise but is centered more around a man vs man plot, in such a brutal and fundamental way as to leave one breathless. The final book is again different, located back on Earth, but takes some of the key ideas of the previous books and creates an epic, grand mythos, while also pitting two forces of good and evil against each other in a truly spectacular fashion. Characters and prose are impeccable; the story suffers in parts with a slower pace and the last book is a little wanting in its resolution, but other than that... sheer brilliance."},{"slug":"the-three-body-problem-liu-cixin","title":"The Three-Body Problem","author":"Liu Cixin","year":2008,"half":7,"pick":null,"review":"The Three-Body Problem is undeniably unique. It is a hard science sci-fi set against the backdrop of the cultural revolution. It reads sometimes like a mystery, sometimes like a periodical, sometimes like a speculative science magazine, sometimes like something out of a dream. Its prose is immensely different, which is the result of it being translated from Chinese. You can tell that sometimes things have been lost in translation, but some things have been gained. The translation note in the back does well to explain this. In terms of the contents of the book itself, The Three-Body Problem is brimming with ideas, which are expressed excellently through clever world building and incorporated nicely within the plot itself. Maybe because of all the effort put towards this, characterisation suffers significantly. Of the few characters developed, all of them feel fairly empty; though I'm not complaining too much, for all the development seemingly was channeled into worldbuilding.\n\nThe pacing of the novel moves along nicely, though the beginning takes its time setting up the contextual history, which is then followed up later. Themes of nihilism are thrown around on more than one occasion, but ultimately this is a story of survival, and on that front it is great. For all its high science explanation and indirect exposition, The Three-Body Problem remains an absorbing read which sucks you in the further you progress. The book also ends on a massive cliffhanger (though admittedly does well to present a complete story in itself), so don't expect complete closure."},{"slug":"the-well-of-ascension-brandon-sanderson","title":"The Well of Ascension","author":"Brandon Sanderson","year":2007,"half":6,"pick":null,"review":"*Mistborn Book 2*\n\nThe Well of Ascension unfortunately demonstrates classic sequel behavior, relying a little too much on the aftermath of the first installment rather than crafting more of its own narrative. However, this being said, it still remains a strong installment. Twists and turns, revelations and intrigue abound; though there is entertainment to be found, there just isn't as much as in the first. Or, maybe just a different type of entertainment, playing with existing character arcs and plots, rather than completely new ones.\n\nThe political machinations of the major plotline were well handled, while the subplot of a side character felt aimless and reeked of long term set up rather than immediate engagement. The character development across the board felt ambiguous and muddy, but an argument could be made that this is more realistic anyway. Again, it is worth remarking that what we are being delivered here is entertainment, not sophistication - and on that part, The Well of Ascension delivers.\n\nOne last thing. Inherent in this installment are subtle but noticeable efforts towards further set up. While not necessarily a bad thing, it forces expectations of the eventual payoff to be awesome."},{"slug":"the-lathe-of-heaven-ursula-k-le-guin","title":"The Lathe of Heaven","author":"Ursula K. Le Guin","year":1971,"half":5,"pick":null,"review":"While the actual story was enjoyable to read, the payoff just didn't do it for me. A solid sci-fi to be sure, and well written as well, but for such high-concept material I was hoping for the threads to be tied together a little more neatly. The concept is that George Orr can dream new realities. This is interesting enough to explore; its use, its exploitation, its eventual finalisation. But the arc of the plot didn't quite land, which is unfortunate given the strength of page to page. That writing undeniably is strong; prose is employed efficiently and relentlessly, making an already slim work move even faster.\n\nMaybe even too fast. The Lathe of Heaven is lacking, but only in a small way."},{"slug":"the-strange-case-of-dr-jekyll-and-mr-hyde-robert-louis-stevenson","title":"The Strange Case of Dr Jekyll and Mr Hyde","author":"Robert Louis Stevenson","year":1886,"half":4,"pick":null,"review":"A Victorian-era London classic with decent prose but minimal plot."},{"slug":"there-is-no-antimemetics-division-qntm","title":"There Is No Antimemetics Division","author":"qntm","year":2020,"half":9,"pick":null,"review":"This book is very short, very sharp and pure genius. What constitutes the genius are the underlying ideas, or more specifically, how these complex and abstract ideas are expressed in an easily graspable form. When I say ideas, what I'm really referring to is one core underlying idea, that of an anti-meme. The concept goes that if a meme is a highly viral idea, then an anti-meme is a highly forgettable idea; so much so that you completely forget all about it the second you stop thinking about it. Like almost all good sci-fi, the focus is primarily on world-building and world-exploration. Interestingly, when it comes to plot, There Is No Antimemetics Division relies heavily on implied narrative. Each chapter is highly fragmented, reading closer to conjoined short stories. It is implied that there are many other divisions of what's called \"the Foundation\", who also fight anti-memes. It is implied there are many instances of capturing or killing many other anti-memes. And so on. In addition to this agency given to the audience to join up the dots, horror elements lend another layer of intrigue. Each resolution is very Terry Pratchett in its lateral but logical solution. As I said, genius."},{"slug":"thief-of-time-terry-pratchett","title":"Thief of Time","author":"Terry Pratchett","year":2001,"half":7,"pick":null,"review":"Quotes:\n\nThere was a scream from somewhere in the mob. 'Democracy at work,' said Lu-Tze.\n\nPeople like that don't need a reason apart from \"because I can\". They have a nightmare and try to make it happen.\n\nShe gave Igor the willies, and he was a man not usually subject to even the smallest willy.\n\nHe was definitely a boy with special needs. In the view of the staffroom, these began with an exorcism.\n\nIf children were weapons, Jason would have been banned by international treaty.\n\nI've never been very venerable, except in cases of bad spelling.\n\nIf Vincent's hand had gone up any faster it would have fried from air friction.\n\nThe Auditors, Death's perpetual antagonists, commission a clockmaker to create a perfectly accurate clock, which if created will stop time itself. A schoolteacher (who also happens to be the granddaughter of Death) and a young apprentice to the history monks (who also happens to be the son of Time) go on a desperate mission to prevent catastrophe.\n\nYes, the plot is complicated, probably a little more so than Pratchett's usual approach (switching between three different perspectives, each separated by the tick of a clock to create something like chapters). But somehow... it works. The flow is nice, the pacing is excellent. Admittedly, looking back, the overall resolution was probably not up to scratch, with plot conveniences being used a little too much. Ignoring the plot integrity, the actual reading itself was nothing short of top notch. While there weren't as many laugh out loud moments as in other Pratchett, there were plenty of chuckles, with Pratchett's trademark witticisms scattered throughout."},{"slug":"ubik-philip-k-dick","title":"Ubik","author":"Philip K. Dick","year":1969,"half":7,"pick":null,"review":"This nefariously tantalizing work of Philip K. Dick is definitively sci-fi. What is presented in this novel is not really an ideas driven narrative, but narrative driven ideas. From the very first page we are given a smorgasbord of futuristic machines, abilities, technologies and cultures, and every moment forward is a progression of a few key ideas. All sci-fi has novel ideas, but the best sci-fi takes these ideas to their furthest limit. This is what Philip K. Dick does in Ubik, making it undoubtedly a triumph as a work of science fiction, but, as simply a work of fiction, it doesn't quite do it for me. The prose is a little disjointed, the characters fairly shallow, the plot inexplicably scattered (though the finale came together sensationally). This is a good book purely for its ideas, and as such I would rate it highly. Ironically, however, relying only on the worth of its worldbuilding ideas makes its readability suffer - instead I'd rather read something else of his with new ideas. Ubik is ultimately a unique work, though being my first experience of Philip K. Dick, I'm guessing it won't be for long."},{"slug":"uneasy-money-p-g-wodehouse","title":"Uneasy Money","author":"P.G. Wodehouse","year":1916,"half":6,"pick":null,"review":"A quaint romantic comedy."},{"slug":"witches-abroad-terry-pratchett","title":"Witches Abroad","author":"Terry Pratchett","year":1991,"half":4,"pick":null,"review":"As good as Pratchett is, this relies too much on parody."},{"slug":"the-lady-in-the-lake-raymond-chandler","title":"The Lady in the Lake","author":"Raymond Chandler","year":1943,"half":7,"pick":null,"review":""},{"slug":"the-high-window-raymond-chandler","title":"The High Window","author":"Raymond Chandler","year":1942,"half":7,"pick":null,"review":""
