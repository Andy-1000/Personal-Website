<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Movies | Andy Sansness</title>
<meta name="description" content="Every film Andy has watched and rated, sortable by star rating, release year or director.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" href="thumbs_up_.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="movie-posters/sprite.jpg?v=abdbd6aa3a">
<style>
  :root {
    --blue: #004d99;
    --navy: #003366;
    --sky: #cce6ff;
    --sky-soft: #e9f3ff;
    --paper: #ffffff;
    --ink: #14243a;
    --muted: #6b7a8b;
    --hairline: #dbe6f1;
    --gold: #e0a100;
    --star-empty: #d9e2ec;
    --gutter: 16px;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Open Sans", sans-serif;
    line-height: 1.6;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  ::selection { color: #fff; background: var(--blue); }

  img { display: block; max-width: 100%; }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- heading ---------- */
  header.page {
    text-align: center;
    padding: calc(2rem + env(safe-area-inset-top)) var(--gutter) 0.25rem;
  }

  header.page h1 {
    font-family: "Merriweather", serif;
    font-weight: 400;
    font-size: clamp(1.8rem, 7vw, 2.6rem);
    line-height: 1.2;
    color: var(--navy);
    margin: 0;
  }

  /* ---------- sort switch ---------- */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    justify-content: center;
    padding: 0.75rem var(--gutter);
    background: rgba(255, 255, 255, 0.9);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    transition: box-shadow 0.2s ease;
  }

  .toolbar.stuck { box-shadow: 0 1px 0 var(--hairline); }

  .switch {
    display: inline-flex;
    padding: 4px;
    border: 2px solid var(--sky);
    border-radius: 999px;
    background: #fff;
  }

  .switch button {
    font: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--blue);
    background: transparent;
    border: 0;
    border-radius: 999px;
    padding: 0.45rem 1.1rem;
    min-height: 40px;
    white-space: nowrap;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .switch button[aria-pressed="true"] { background: var(--blue); color: #fff; }
  .switch button:not([aria-pressed="true"]):hover { background: var(--sky-soft); }
  .switch button:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }

  /* ---------- page column ---------- */
  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 0.25rem calc(var(--gutter) + env(safe-area-inset-right)) 3rem calc(var(--gutter) + env(safe-area-inset-left));
  }

  /* ---------- overview chart ---------- */
  .viz {
    margin: 0.75rem 0 0.5rem;
    padding: 1.1rem 1.25rem 0.9rem;
    border: 1px solid var(--hairline);
    border-radius: 16px;
    background: linear-gradient(180deg, #fbfdff 0%, #ffffff 70%);
  }

  .viz-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.2rem 1rem;
    margin-bottom: 0.9rem;
  }

  .viz-head h2 {
    margin: 0;
    font-family: "Open Sans", sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--navy);
  }

  .viz-key {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.78rem;
    color: var(--muted);
  }

  .viz-key i {
    display: inline-block;
    width: 8px;
    height: 12px;
    border-radius: 1.5px;
    background: url("movie-posters/sprite.jpg?v=abdbd6aa3a") 0 0 / 160px auto;
  }

  .plot {
    position: relative;
    width: 100%;
    height: 200px;
    transition: height 0.65s cubic-bezier(0.2, 0.8, 0.2, 1);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .plot.instant, .plot.instant * { transition: none !important; }

  /* posters are 2:3, so the tile is 16 x 24 and scales as one piece */
  .dot {
    position: absolute;
    top: 0;
    left: 0;
    width: 16px;
    height: 24px;
    transform-origin: 0 0;
    will-change: transform;
    transition: transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.25s ease;
    pointer-events: none;
  }

  .dot .face {
    display: block;
    width: 16px;
    height: 24px;
    border-radius: 2px;
    background-image: url("movie-posters/sprite.jpg?v=abdbd6aa3a");
    background-size: 320px auto;
    background-color: var(--sky);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }

  .plot.hovering .dot { opacity: 0.45; }
  .plot.hovering .dot.hot { opacity: 1; z-index: 3; }

  .dot.hot .face {
    transform: scale(2.6);
    box-shadow: 0 0 0 1px #fff, 0 3px 10px rgba(0, 25, 51, 0.35);
  }

  .axis {
    position: absolute;
    background: var(--hairline);
    transition: all 0.65s cubic-bezier(0.2, 0.8, 0.2, 1);
    pointer-events: none;
  }

  .labels { position: absolute; inset: 0; pointer-events: none; }
  .labels.fade { animation: labelsIn 0.45s ease both 0.2s; }
  @keyframes labelsIn { from { opacity: 0; } }

  .lab {
    position: absolute;
    font-size: 0.72rem;
    line-height: 1;
    color: var(--muted);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .lab.center { transform: translateX(-50%); }
  .lab.right { transform: translate(-100%, -50%); }
  .lab.left { transform: translateY(-50%); }
  .lab.count { font-weight: 600; color: var(--ink); opacity: 0.7; }
  .lab.peak { font-weight: 600; color: var(--navy); }

  button.lab {
    pointer-events: auto;
    font: inherit;
    font-size: 0.74rem;
    line-height: 1;
    color: var(--ink);
    background: transparent;
    border: 0;
    border-radius: 6px;
    padding: 6px 7px;
    margin: -6px -7px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 2px;
    -webkit-tap-highlight-color: transparent;
  }

  button.lab.center { transform: translateX(-50%); }
  button.lab.right { transform: translate(-100%, -50%); }
  button.lab:hover { background: var(--sky-soft); color: var(--blue); }
  button.lab:focus-visible { outline: 2px solid var(--blue); outline-offset: 0; }
  button.lab[disabled] { cursor: default; color: #a7b3bf; background: transparent; }
  .lab svg { width: 0.95em; height: 0.95em; fill: var(--gold); flex: none; }
  button.lab[disabled] svg { fill: var(--star-empty); }

  /* ---------- tooltip ---------- */
  .tip {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 0.7rem;
    width: max-content;
    max-width: min(300px, calc(100vw - 24px));
    padding: 0.55rem 0.75rem 0.55rem 0.55rem;
    border-radius: 12px;
    background: #fff;
    box-shadow: 0 1px 2px rgba(0, 25, 51, 0.12), 0 12px 32px rgba(0, 25, 51, 0.22);
    opacity: 0;
    visibility: hidden;
    transform: translateY(4px);
    transition: opacity 0.14s ease, transform 0.14s ease, visibility 0s linear 0.14s;
    pointer-events: none;
  }

  .tip.on {
    opacity: 1;
    visibility: visible;
    transform: none;
    transition: opacity 0.14s ease, transform 0.14s ease;
  }

  .tip.touch { pointer-events: auto; cursor: pointer; }

  .tip .tc {
    flex: none;
    width: 44px;
    height: 66px;
    border-radius: 5px;
    background-color: var(--sky-soft);
    background-size: cover;
    background-position: center;
  }

  .tip .tt {
    font-size: 0.86rem;
    font-weight: 600;
    line-height: 1.3;
    color: var(--ink);
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
  }

  .tip .ta { font-size: 0.78rem; line-height: 1.35; color: var(--muted); }

  .tip .tm {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    margin-top: 0.2rem;
    font-size: 0.75rem;
    color: var(--muted);
  }

  .tip .tm .stars { font-size: 12px; }
  .tip .go { display: none; margin-top: 0.25rem; font-size: 0.75rem; font-weight: 600; color: var(--blue); }
  .tip.touch .go { display: block; }

  /* ---------- shelves ---------- */
  .shelf { margin-top: 1.8rem; scroll-margin-top: 76px; }

  .shelf-head {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding-bottom: 0.55rem;
    margin-bottom: 1rem;
    border-bottom: 1px solid var(--sky);
  }

  .shelf-head h2 {
    margin: 0;
    font-family: "Merriweather", serif;
    font-weight: 400;
    font-size: 1.2rem;
    line-height: 1.3;
    color: var(--navy);
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .shelf-head .n {
    margin-left: auto;
    font-size: 0.8rem;
    color: var(--muted);
    white-space: nowrap;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 1.4rem 1.1rem;
  }

  .card {
    display: block;
    width: 100%;
    min-width: 0;
    padding: 0;
    border: 0;
    background: none;
    text-align: left;
    font: inherit;
    color: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  /* every poster is the same 2:3 rectangle, whatever the source image */
  .art {
    position: relative;
    width: 100%;
    aspect-ratio: 2 / 3;
    border-radius: 8px;
    overflow: hidden;
    background: var(--sky-soft);
    box-shadow: 0 1px 2px rgba(20, 36, 58, 0.12), 0 4px 14px rgba(20, 36, 58, 0.08);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }

  .art img {
    position: absolute;
    inset: 0;
    z-index: 1;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .art img.ready { opacity: 1; }

  .fallback {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.8rem;
    text-align: center;
    font-family: "Merriweather", serif;
    font-size: 0.85rem;
    line-height: 1.35;
    color: var(--navy);
    overflow-wrap: anywhere;
  }

  @media (hover: hover) {
    .card:hover .art {
      transform: translateY(-3px);
      box-shadow: 0 2px 4px rgba(20, 36, 58, 0.14), 0 10px 24px rgba(20, 36, 58, 0.16);
    }
  }

  .card:active .art { transform: scale(0.97); }
  .card:focus-visible { outline: none; }
  .card:focus-visible .art { outline: 3px solid var(--blue); outline-offset: 3px; }

  .card .t,
  .card .a {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 1;
    overflow: hidden;
    overflow-wrap: anywhere;
  }

  .card .t {
    margin-top: 0.55rem;
    font-size: 0.88rem;
    font-weight: 600;
    line-height: 1.3;
    color: var(--ink);
  }

  .card .a {
    font-size: 0.8rem;
    line-height: 1.35;
    color: var(--muted);
  }

  .card .sub {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    margin-top: 0.15rem;
    min-height: 14px;
  }

  .card .year-label { font-size: 0.75rem; line-height: 1.2; color: var(--muted); }

  /* ---------- stars ---------- */
  .stars { display: inline-flex; gap: 1px; line-height: 0; flex: none; }
  .stars svg { width: 1em; height: 1em; }
  .stars .on { fill: var(--gold); }
  .stars .off { fill: var(--star-empty); }
  .card .stars { font-size: 12px; }
  .shelf-head .stars { font-size: 18px; }

  /* ---------- detail dialog ---------- */
  dialog {
    width: min(880px, calc(100vw - 32px));
    max-width: none;
    max-height: calc(100dvh - 32px);
    padding: 0;
    border: 0;
    border-radius: 16px;
    color: var(--ink);
    background: #fff;
    box-shadow: 0 24px 70px rgba(0, 25, 51, 0.35);
    overflow: hidden;
    overscroll-behavior: contain;
  }

  dialog::backdrop {
    background: rgba(0, 25, 51, 0.55);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
  }

  dialog[open] { animation: rise 0.22s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px) scale(0.98); } }

  .detail {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    /* the row has to be allowed to shrink, or a long review makes .info taller
       than the dialog and the prev / next arrows fall outside it */
    grid-template-rows: minmax(0, 1fr);
    max-height: calc(100dvh - 32px);
  }

  /* the poster is 2:3, so its width is capped by the height the dialog can give it */
  .detail .cover {
    position: relative;
    align-self: start;
    width: min(260px, calc((100dvh - 32px - 3.2rem) / 1.5));
    aspect-ratio: 2 / 3;
    margin: 1.6rem 0 1.6rem 1.6rem;
    border-radius: 10px;
    overflow: hidden;
    background: var(--sky-soft);
    box-shadow: 0 4px 18px rgba(20, 36, 58, 0.15);
  }

  .detail .cover img { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; object-fit: cover; }
  .detail .cover .fallback { font-size: 1.1rem; padding: 1.2rem; }

  .detail .info {
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
    padding: 1.6rem 1.6rem 1.2rem;
    overflow-y: auto;
    overscroll-behavior: contain;
  }

  .detail h2 {
    margin: 0 2.4rem 0 0;
    font-family: "Merriweather", serif;
    font-weight: 400;
    font-size: clamp(1.3rem, 4.5vw, 1.75rem);
    line-height: 1.25;
    color: var(--navy);
    overflow-wrap: anywhere;
  }

  .detail .by {
    margin: 0.35rem 0 0;
    font-size: 1rem;
    color: var(--blue);
    font-weight: 600;
  }

  .detail .facts {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.4rem 1rem;
    margin: 0.8rem 0 0;
    font-size: 0.88rem;
    color: var(--muted);
  }

  .detail .facts .stars { font-size: 20px; }

  .detail .review { margin: 1.1rem 0 0; font-size: 0.95rem; white-space: pre-line; }
  .detail .review.empty { color: var(--muted); font-style: italic; }

  /* ---------- spoilers: blurred until asked for ---------- */
  .spoilers { position: relative; margin: 1.1rem 0 0; }

  .spoilers .body {
    font-size: 0.95rem;
    white-space: pre-line;
    filter: blur(7px);
    user-select: none;
    -webkit-user-select: none;
    transition: filter 0.35s ease;
  }

  .spoilers.open .body { filter: none; user-select: auto; -webkit-user-select: auto; }

  .spoilers .peek {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    /* the block runs long, so the label sits at the top where it is seen at
       once; the whole blurred area stays tappable */
    align-items: flex-start;
    padding-top: 0.9rem;
    justify-content: center;
    width: 100%;
    border: 0;
    background: transparent;
    font: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .spoilers.open .peek { display: none; }

  .spoilers .peek span {
    padding: 0.45rem 0.95rem;
    border-radius: 999px;
    border: 1px solid var(--sky);
    background: rgba(255, 255, 255, 0.94);
    box-shadow: 0 1px 2px rgba(0, 25, 51, 0.1), 0 6px 18px rgba(0, 25, 51, 0.16);
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--blue);
    white-space: nowrap;
  }

  .spoilers .peek:hover span { background: #fff; border-color: var(--blue); }
  .spoilers .peek:focus-visible span { outline: 3px solid var(--blue); outline-offset: 2px; }

  .detail nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.5rem;
    margin-top: auto;
    padding-top: 1.2rem;
  }

  .detail nav .pos { font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }

  .round {
    flex: none;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 2px solid var(--blue);
    background: #fff;
    color: var(--blue);
    font-size: 1.05rem;
    line-height: 1;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, color 0.15s ease, transform 0.12s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .round:hover { background: var(--blue); color: #fff; }
  .round:active { transform: scale(0.94); }
  .round:focus-visible { outline: 3px solid var(--navy); outline-offset: 3px; }

  .close {
    position: absolute;
    top: 0.9rem;
    right: 0.9rem;
    z-index: 2;
    width: 40px;
    height: 40px;
    border-color: var(--sky);
    background: rgba(255, 255, 255, 0.92);
    font-size: 1.35rem;
  }

  /* ---------- footer ---------- */
  footer {
    border-top: 1px solid var(--sky);
    text-align: center;
    padding: 1rem var(--gutter) calc(1rem + env(safe-area-inset-bottom));
    font-size: 0.78rem;
    color: #7a8795;
  }

  /* ---------- custom cursor (desktop only, matches the rest of the site) ---------- */
  .cursor { pointer-events: none; }
  .cursor .ball { position: fixed; top: 0; left: 0; z-index: 1000; will-change: transform; }

  /* the dialog sits in the browser's top layer, above the custom cursor, so it uses the normal pointer */
  .modal-open .cursor { display: none; }

  @media (pointer: fine) {
    body, a, button { cursor: none; }
    dialog, dialog::backdrop { cursor: auto; }
    dialog button { cursor: pointer; }
  }

  @media (pointer: coarse) {
    .cursor { display: none; }
  }

  /* ---------- tablets ---------- */
  @media (max-width: 900px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(116px, 1fr)); gap: 1.25rem 0.9rem; }
  }

  /* ---------- phones ---------- */
  @media (max-width: 640px) {
    header.page { padding-top: calc(1.5rem + env(safe-area-inset-top)); }
    .viz { padding: 0.9rem 0.9rem 0.8rem; border-radius: 14px; }
    .viz-head { margin-bottom: 0.75rem; }
    .viz-head h2 { font-size: 0.9rem; }
    .viz-key { font-size: 0.72rem; }

    /* the stacked chart puts one label per row, so they have to sit tighter */
    button.lab { padding: 4px 7px; margin: -4px -7px; }

    .shelf { margin-top: 1.5rem; }
    .shelf-head h2 { font-size: 1.05rem; gap: 0.45rem; }
    .shelf-head .stars { font-size: 15px; }

    .grid {
      grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
      gap: 1.1rem 0.7rem;
    }
    .card .t { font-size: 0.8rem; }
    .card .a { font-size: 0.74rem; }
    .card .stars { font-size: 11px; }

    dialog { width: calc(100vw - 20px); max-height: calc(100dvh - 20px); border-radius: 14px; }
    .detail {
      grid-template-columns: minmax(0, 1fr);
      /* on phones the whole card scrolls as one, so the rows size to content */
      grid-template-rows: auto;
      max-height: calc(100dvh - 20px);
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    .detail .cover { width: min(46%, calc(34dvh / 1.5)); margin: 1.4rem auto 0; }
    .detail .info { overflow: visible; padding: 1.1rem 1.15rem 1rem; }
    .detail h2 { margin: 0 0.5rem; text-align: center; }
    .detail .by { text-align: center; }
    .detail .facts { justify-content: center; }
    .detail nav {
      position: sticky;
      bottom: -1rem;
      margin: 0 -1.15rem -1rem;
      padding: 0.7rem 1.15rem calc(0.7rem + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(255,255,255,0) 0%, #fff 30%);
    }
    .close { top: 0.6rem; right: 0.6rem; }
  }

  @media (max-width: 360px) {
    :root { --gutter: 12px; }
    .switch button { padding: 0.45rem 0.7rem; font-size: 0.82rem; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>

<div class="cursor" aria-hidden="true">
  <div class="ball big">
    <svg height="50" width="50"><circle cx="25" cy="25" r="20" stroke-width="0" style="fill:#cce6ff;opacity:.7"></circle></svg>

<script>
(function () {
  "use strict";

  /* Generated from the Movie Reviews notes. half = rating in half stars (10 = 5 stars) */
  var MOVIES = [{"slug":"inception-2010","title":"Inception","director":"Christopher Nolan","year":2010,"half":10,"review":"Personally, Inception is my favourite movie ever. The score, the script, the acting... all just brilliant. The plot, though complex, is nothing short of genius.\n\nInception takes the established format of a heist movie, and puts it in the mindbending context of a dream. The action packed prologue of the movie throws the audience into the deep end, and brief exposition sets up the underlying mechanism and premise of the rest of the movie. Put simply, imagine a drug which allowed you to enter someone else's dream. Inception is then the process by which an idea can be implanted within someone's mind in the dream state.\n\nThe heist format then follows: specialists (architect, forger, chemist) are recruited into the team, and they then plan the heist. All the while we follow Cobb (Leonardo DiCaprio), a skilled extractor and operator within dreams, who is haunted by his mysterious past.\n\nThe 'heist' itself - implanting an idea in their target's mind - is just sublime. Importantly, in order to achieve inception, their target, Fischer (Cillian Murphy), must give himself the idea they are implanting. To get Fischer to do this, they recruit his help within a deeper dream state. At first this seems strange, especially as Fischer in a deeper dream state even breaks into the fortress of his own mind. However, that's the beauty of a dream - what may seem preposterous in reality seems entirely normal within a dream. Where in other action movies I might roll my eyes at needless stunts, unbelievable fight scenes and ludicrous chase scenes, Inception makes them perfectly believable because they are occurring in a dream.\n\nCobb's wife, Mal, appears in dreams and threatens Cobb's operations. Interestingly, Mal's acting is flat and emotionless, which makes sense as you learn that she is just a projection within the dream. This is given even more impact when Cobb is forced to let go of her near the end - while this version of Mal is all the audience has known of her, Cobb finally recognises that this is not his wife.\n'With all your perfections, all your imperfections... you're not my wife... you're just a shade.'\n\nThis is almost an inception moment for Cobb as well, for halfway through the heist we learn that 'the further we go into Fischer, the further we go into your mind as well'. The idea being planted in Cobb's mind is 'something he once knew... a truth from a half remembered dream'... namely, that Cobb did in fact live out a lifetime with his wife, and in doing so fulfilled his marriage vow. Like much of Nolan's films, themes and thoughts like these are reinforced and given greater meaning as they are repeated throughout the movie.\n\nBy coming to terms with the truth of his wife's death, Cobb is now able to live his life without guilt and shame, and can now look at his children's faces. Prior to this inception moment, Cobb refused to look at his children's faces, maybe in part because he knew that if he did see them, that's what he would accept as reality. When Cobb returns to what he considers reality and looks upon his children's faces, he no longer cares whether or not he is living in a dream.\n\nThe ambiguity of the final sequence - Cobb's totem teetering - shows that neither the audience nor Cobb knows whether he is living in reality or a dream. This provides a nice commentary on our own reality, and whether what we perceive to be reality, truly is reality. No matter what we think, like Cobb, we can never truly be sure.","spoilers":""},{"slug":"there-will-be-blood-2007","title":"There Will Be Blood","director":"Paul Thomas Anderson","year":2007,"half":10,"review":"This film is a true cinematic force.\nFrom a purely technical point of view it is a masterpiece. From a narrative point of view it is a brutal, unforgiving portrayal of human nature at its very darkest; darkest not in an overt way, but in a more unsettlingly subtle way. While the story itself was fairly slow, each scene was completely and utterly enrapturing. Following an oilman in early 1900s America, the story starts in greed and ends in madness. And yet early on you can sense the outcome with a kind of terrifying yet captivating inevitability. As you learn more and more about this character, his hatred, his fury and the impact he has on those who enter his sphere, the ending thematically becomes clearer and clearer. With the focus dwelling on the scene by scene, the elements which make up a scene are elevated to great impact.\n\nThe main character's performance is a thing of brilliance. Haunting, tension building score is too much at times, where too much is exactly where director Paul Thomas Anderson wants to go. And yet it is all treated with such subtlety – for a title with the word blood in it, there isn't much blood. But that doesn't stop it being a bleak, brooding masterpiece.","spoilers":""},{"slug":"dune-part-two-2024","title":"Dune: Part Two","director":"Denis Villeneuve","year":2024,"half":9,"review":"","spoilers":""},{"slug":"spider-man-across-the-spider-verse-2023","title":"Spider-Man: Across the Spider-Verse","director":"Joaquim Dos Santos, Kemp Powers & Justin K. Thompson","year":2023,"half":9,"review":"A postmodern stylistic masterpiece (or half of one at least). The trouble with multipart movies is that the hype is so high for the second half - if you're gonna end on a cliff hanger, you better have an outstanding resolution. We shall see. But for a first part I can barely fault it, though that doesn't mean it was faultless. For one, I've never been a fan of prophetic vision scenarios in any movie, aka. 'oh no Spot is gonna kill everyone'. This just teases a battle for no other reason than to say: 'bad things are going to happen' *spooky voice*. Whatever. We get it.\n\nOther than that, the stylisation worked to tantalising effect, truly differentiating it from any other animation style (even if it was a little bit much at times, like in Gwen's universe). My absolute highlight was the direction it took with the plot. Essentially, the Spider universes are supposed to follow 'canon', that is, certain things are supposed to happen. But what if they didn't? Enter Miles Morales. Spider-Man: Into the Spider-Verse was basically just an origin story for him, setting the groundwork for this main production. When I describe it as postmodern, what I mean is a playful self-reference, a nuanced balance between fiction and metafiction (and sometimes even metametafiction). By acknowledging and integrating the 'universal' Spider-Man story into this one, Spider-Man: Across the Spider-Verse makes room to play on this.\n\nAnd play it does.","spoilers":""},{"slug":"knives-out-2019","title":"Knives Out","director":"Rian Johnson","year":2019,"half":9,"review":"'In for a penny, in for a pound'\n\nKnives Out is your quintessential murder mystery, but with a subtle twist. From the very beginning the typical whodunnit formula is stark - a hated, rich father is killed in a secluded manor and seemingly everyone has a motive. However, while a solution is presented fairly early, something of a mystery remains, leaving the audience intrigued and compelled from start to finish.\n\nThe plot is absolutely impeccable, and provides the backbone of the entire movie. Acting is really solid and the soundtrack is used highly effectively.\n\nScript is sharp and keeps the pace moving along nicely, especially when considering that a stereotypical murder mystery tends to dawdle through the investigation before the big reveal. Modern details and pop culture references, from Biscoff biscuits to New Yorker articles, also gave a nice contrast to the typical 1900s cliche.\n\nOverall, the best murder mystery I've ever seen.","spoilers":""},{"slug":"mollys-game-2017","title":"Molly's Game","director":"Aaron Sorkin","year":2017,"half":9,"review":"Molly's Game is a semi-biographic crime drama of Molly Bloom, an ex-skier who created some of the most exclusive and expensive poker games ever.\n\nThe writer and director, Aaron Sorkin, takes on a fast-paced, drama filled tour of Molly's life, bouncing between her origins to her criminal prosecution, a non-linear framework not unlike what he did with the Social Network. Because this is Aaron Sorkin, the dialogue is filled with absolute zingers, whilst the ongoing narration adds further flavour to events unfolding. As a film Molly's Game feels different from standard Hollywood; somehow it is more gritty, more down to earth, and definitely more intelligent.\nEven postmodern flourishes like the discussion of the film rights within the actual film add a subtle depth, uncharacteristic to say the least.\nThere is psychological analysis whose insights land so cathartically that they essentially constitute the resolution in and of themselves, without being trivial or unrigorous. You just don't get that in many movies. Novelty adds value, yes, but when it's so cleverly and effectively added into the storytelling and the actual story itself, the value is far amplified. Molly's Game is a triumph.","spoilers":""},{"slug":"arrival-2016","title":"Arrival","director":"Denis Villeneuve","year":2016,"half":9,"review":"Dang this movie hits hard. Arrival tells a world-shattering narrative of aliens, unintelligible and mysterious, and humanity's attempts to communicate with them. And yet it also is a much smaller narrative of a melancholic woman reflecting on life; both of these narratives are deeply intertwined. What could have been a true cliche sci-fi action is instead a thoughtful mystery drama of the highest order. Though captivating in many ways, the most spellbinding elements of this film are the aliens. Far more eerie yet strangely expressive, they are also almost always accompanied by equally alien music, a brooding, atmospheric twang of other-worldliness. Just as engaging as the soundtrack is the cinematography at play here; some truly magnificent shots abound. But it's the character of the protagonist which keeps you musing.\n\nWe are her, desperate for answers, confused, concerned, amazed. It's cool to see how deliberately the story takes us in different directions, both emotionally and thematically. At its core though, this is a mystery, and a mystery is only as good as its reveal. This one will knock your socks off.","spoilers":""},{"slug":"la-la-land-2016","title":"La La Land","director":"Damien Chazelle","year":2016,"half":9,"review":"Some films make you think. This film makes you feel. Wonder. Awe. Joy. Sadness. Anger. Respite. Hope. How does it make you feel these things? Through music and through words, mostly. Sublime acting, exquisite cinematography, and a razor sharp script. Individually these features are strong, but the way they are perfectly fit together is even stronger.\n\nLa La Land follows an actor and a jazz pianist in L.A., whose lives intersect in the course of pursuing their dreams. It is a romance, not only in the traditional sense, but also in the two characters' romance for their dream; therein lies the tension, but also the resolution, a compelling yet melancholy ending. This is also a musical, with a specific focus on jazz. In each music number, what happens onscreen reflects the character's interpretation of what's going on around them, making for highly stylized, ambiguous sequences. I usually stay away from both musicals and romances, finding them either boring or annoying (or just plain stupid). But in this case, as I let myself enjoy each moment, it was an entirely different experience. Such pure cinematic prowess is beyond a joy to watch.","spoilers":""},{"slug":"interstellar-2014","title":"Interstellar","director":"Christopher Nolan","year":2014,"half":9,"review":"","spoilers":""},{"slug":"moneyball-2011","title":"Moneyball","director":"Bennett Miller","year":2011,"half":9,"review":"Moneyball takes the typical Underdog Comeback Story, and turns it on its head in the best way possible. Instead of pitting a team against other teams Moneyball pits a baseball general manager against the system itself. Moneyball swaps cliched teamwork and camaraderie for intellectual rebellion and boldness. This makes for a much deeper, more interesting exploration of both the characters and the systems of baseball itself. The stakes of Moneyball are tied directly to the Oakland A's GM: Billy Beane, played by Brad Pitt. Importantly, these stakes transition throughout the movie from winning a championship, to changing the very game of baseball itself. \"The first man through the wall always gets bloody. Always.\" Witty lines like this are rampant, and while the story itself is interesting, what's even better is the writing. Though not the engine of the movie, the writing works wonders to enhance the story in a million different ways. This comes down to subtlety, not just in writing but in acting, in cinematography, in score. A culmination of all these details help to produce not just a fascinating story, but a story with heart.","spoilers":""},{"slug":"the-social-network-2010","title":"The Social Network","director":"David Fincher","year":2010,"half":9,"review":"","spoilers":""},{"slug":"the-dark-knight-2008","title":"The Dark Knight","director":"Christopher Nolan","year":2008,"half":9,"review":"'You either die a hero, or live long enough to see yourself become the villain'\n\nThe Dark Knight is undoubtedly the greatest superhero movie ever made. That's because it doesn't particularly feel like a superhero movie in the first place. For one, CGI is minimal, with action instead relying on stuntwork and the occasional dramatic explosion. But even action itself is not the driving force of the movie... what elevates The Dark Knight to another level beyond its predecessors is its plot and characters.\n\nA hero movie is only as good as its villains, and boy does The Dark Knight deliver. The Joker (Heath Ledger), is not only acted to chilling perfection, but also provides the driving force of the plot from the very beginning of the movie (while we're on the subject, I'm going to propose that the opening sequence of The Dark Knight is one of the greatest ever made).\n\nAlthough the Joker is characterised as a sociopathic, sadistic mastermind - in the words of Alfred, 'some people just want to watch the world burn' - it's undeniable that he's also got style. Every step of the way, the Joker is seven steps in front of everyone else, even in the moment you think he has finally been defeated. This makes for a Batman less of a hero and more of a force in and of himself. Instead of clear cut good guys and bad guys, The Dark Knight portrays more shades of grey across all of its characters.\n\nThis is especially shown in the film's secondary villain, Two-Face, who is probably the most well developed character portrayed. His relationship to both Batman and The Joker makes for a dynamic and dramatic trifecta.\n\nDespite being pretty dark at times, The Dark Knight also somehow provides a fair few laughs as well, though still while remaining completely and utterly serious. While some moments are obvious (the Joker making a pencil 'disappear' by slamming a mobster's head on it) others are far more subtle (the Joker setting a firetruck on fire to block a police route). My personal favourite occurs after Rachel lashes out at the Joker.\n\nJoker: Oooo... you've got a bit of fight left in you - I like that\n(Batman appears from nowhere and tackles the Joker)\nBatman: Then you're gonna love me!\n\nDialogue like this is prolific. One liners and razor sharp dialogue help to create some highly dramatic moments, the peak of which would have to be the closing dialogue, which very neatly ties everything together both thematically and logistically.\n\nOverall, The Dark Knight provides a refreshing new portrayal of Batman, breaking free of the superhero genre to become an independently top tier movie.","spoilers":""},{"slug":"changing-lanes-2002","title":"Changing Lanes","director":"Roger Michell","year":2002,"half":9,"review":"*Changing Lanes* is a sharp, biting drama about two men locked in a brutal psychological battle. Their conflict begins with a minor traffic accident, something that could have been resolved immediately, but one man’s desperation causes him to flee, igniting a war of escalation. What follows is ingenious and unsettling. Each man attacks the other without ever laying a hand on him, with every move ratcheting the stakes higher. The entire conflict unfolds over a single day, giving the film a relentless momentum. While tightly plotted and nail-biting, what you're really staying for is the characters. Slowly but surely you explore the circumstances which push them to take the actions they do, and over the course of the film you shift from indignation to complete empathy with both of them. Although there is plenty to think about, all of it happening with a relentless pace, this movie is primarily making you feel, to feel what the characters are feeling. Technically, in terms of acting, score, cinematography, we have not brilliance, because brilliance is not what this movie needs, but in its own context, a competence which is perfection.","spoilers":""},{"slug":"gladiator-2000","title":"Gladiator","director":"Ridley Scott","year":2000,"half":9,"review":"'A general who became a slave. A slave who became a gladiator. A gladiator who defied an emperor.'\n\nUtterly epic. Acting is sensational, with the obvious highlight being Joaquin Phoenix. Though Russell Crowe may have some naysayers, I rate him. Any other actor may have gone over the top; instead Crowe provided exactly what the role of Maximus required, a character world weary but revenge fueled.\n\nThe best part about this movie was the script - almost every single line spoken throughout the movie is quotable. (My personal favourite: 'Death smiles upon all of us. The best a man can do is smile back').\n\nPlot is strong enough and realistically didn't even need to be too complex - just enough to tie in with the historical context, and complement the overall epicness of it.\n\nOverall, close to a masterpiece. I mean come on... 'Are you not entertained?!'","spoilers":""},{"slug":"project-hail-mary-2026","title":"Project Hail Mary","director":"Phil Lord, Christopher Miller","year":2026,"half":8,"review":"","spoilers":""},{"slug":"la-chimera-2023","title":"La Chimera","director":"Alice Rohrwacher","year":2023,"half":8,"review":"La Chimera is a modern day folk tale, a long lost dream, a vision of the lost and the broken and the free. This is a film which fundamentally makes you feel human. Forget the age-old narrative beats of plot and character; here we are given moods, and reflections, and echoes. While in principle the film follows Arthur, a leader of his own merry band of grave robbers in rural Italy, what we are given goes much deeper. In fact, the surreal holds more to the true story than any twist of plot.\n\nLa Chimera at first seems to move slow (frustratingly so), but in actuality it is just moving at a different rhythm than the typical Hollywood offering. In this respect, La Chimera is unrecognisable in what would typically be labelled a movie. This is not a Movie, but a Film. Where a Movie is designed to entertain, a Film is designed to express. And La Chimera does just that.\n\nIn the end, La Chimera left me breathless, an ethereal wonder and a reflective masterpiece.","spoilers":""},{"slug":"the-killer-2023","title":"The Killer","director":"David Fincher","year":2023,"half":8,"review":"The Killer left me... divided. On one hand a cinematic masterclass in suspense and tension to rival even that of Hitchcock. On the other hand, a simplistic plot (hitman botches job, hitman's partner is assaulted as punishment, hitman takes revenge on all parties involved) meant that the pacing suffered.\n\nFirst, the suspense. We learn early in the movie that every time the Killer meets someone, at some point he is going to kill them - the tension is not knowing when. In terms of soundtrack, the background whine - similar to the one used in The Social Network - works brilliantly to sustain and build this tension. A selection of The Smiths tunes then dryly balances out the intensity with a human element (I would have liked to hear a bit more of the songs though).\n\nSecondly, the plot. Now usually a simplistic plot would indicate that you are watching a movie about a character, which in this case you very much are. We get inside the Killer's head through a seemingly neverending monologue comprised of gloomy observations and Weet-Bix dry humour, which works well to keep the character human. These monologues are made all the more tantalising by Fassbender's voice, one of those voices you could listen to all day. Apart from this, Fassbender's acting is superb in creating the Killer's dull, sometimes seemingly lifeless role (double kudos to Fassbender for not blinking until the very last scene).\n\nSo, if the character is acted and built superbly, why not 5 stars? The thing is, Fincher here is a victim of his own style. The Killer is an excellently realistic hitman, but the fact that he has no feeling, no emotion - well, I don't really care about him that much. And so, why should I care about his quaint little murder spree? In answer to my own question, what I do care about is everything around the Killer - the monologues, the suspense, the aliases he uses, the hitman tips and tricks he employs, the constant dumping of possessions, the cultural references, the Smiths songs.\n\nThe Killer feels so different from typical Hollywood filmography - you won't find mindless action here (okay, maybe a little bit) - and because of this I love it. Instead, what Fincher has created is a cold, hard slice of reality, or at least what reality would be.\n\nAnd just remember if you're ever being chased for accidentally killing the wrong guy: WWJWBD","spoilers":""},{"slug":"glass-onion-2022","title":"Glass Onion","director":"Rian Johnson","year":2022,"half":8,"review":"","spoilers":""},{"slug":"tenet-2020","title":"Tenet","director":"Christopher Nolan","year":2020,"half":8,"review":"Tenet is the most Christopher Nolan-esque movie you will ever see. While Time is an underlying theme in most of his films, in Tenet, Time is the primary underlying mechanism. Most of the time, time travel in a movie is a bit of a red flag - I don't know if I've ever seen a top notch movie with time travel. Tenet however does not use time travel; instead, reversed entropy, which causes objects to run backwards in time. Like most of Nolan's science fiction, it's based on a very solid scientific foundation (In Feynman diagrams anti-particles actually do move backwards in time).\n\nThe plot of the movie runs almost along Bond lines - a sinister villain threatens to destroy the world, and the protagonist must stop this from happening. And yes, the protagonist in this movie is only known throughout the movie as The Protagonist. Personally, I like this as an idea because it suggests on a postmodern level that the protagonist could be anyone, that this is just a story and the protagonist is expected to fulfil his role and remove the antagonists (yeah, bad guys are also referred to as antagonists as well).\n\nWhat makes Tenet so different is the use of this reverse entropy mechanism in a variety of contexts, and man does it look sick. From people moving backwards in time to fight scenes, car chases and battle scenes. What makes it even better is that you are able to see two sides of the exact same scene: one from the perspective of the Protagonist moving forward in time, and another from the Protagonist moving backwards in time.\n\nUnfortunately this insane visual masterpiece comes at a cost. There is minimal emotional depth - some sob story about a child we never see doesn't really cut it. Construction of character depth is traded instead for exposition, although the exposition of this particular movie is comparably pretty interesting.\n\nSome people seem to think the plot of Tenet is too complex and doesn't resolve itself. Personally, I very much disagree. A first watch may leave you confused plot-wise, but very much satisfied in terms of visual entertainment. A second watch allows for a greater understanding of plot and the mechanism at play. While some may think that a movie should be able to be fully appreciated on its first watch, I consider this level of depth refreshingly uncharacteristic of Hollywood movies, which seem to consider the average viewer to be of below-average intelligence.\n\nOther than this, dialogue is razor sharp, and the score is bold but superb. Because the soundtrack sometimes drowns out dialogue, subtitles are highly recommended - a small price to pay for a much greater viewing experience.","spoilers":""},{"slug":"a-quiet-place-2018","title":"A Quiet Place","director":"John Krasinski","year":2018,"half":8,"review":"Man, this movie is stressful. From start to finish, there is a masterful, terrible tension, the kind that can only be produced by the protagonist being a sneeze away from dying at any given moment. It is also, maybe, because of this, a completely unique movie in both vision and execution. For one, the premise is perfect for cinema - a family must survive in a world where savage aliens kill anything that makes a sound. And so you as the audience don't dare to make a peep; even hearing sounds within the movie gives you anxiety.","spoilers":""},{"slug":"mission-impossible-fallout-2018","title":"Mission: Impossible – Fallout","director":"Christopher McQuarrie","year":2018,"half":8,"review":"","spoilers":""},{"slug":"spider-man-into-the-spider-verse-2018","title":"Spider-Man: Into the Spider-Verse","director":"Bob Persichetti, Peter Ramsey, Rodney Rothman","year":2018,"half":8,"review":"","spoilers":""},{"slug":"logan-lucky-2017","title":"Logan Lucky","director":"Steven Soderbergh","year":2017,"half":8,"review":"Logan Lucky is a hillbilly comedy crime caper, and man does it pull it off. It is also one of the most off-beat movies I've watched in a very long time. The timing of sequences, the direction of conversation, the visual and spoken gags, even the very characters and plot itself - it is all just a bit unexpected, all handled a bit differently from how you thought it was going to be presented.\n\nAll this works very heavily in the film's favour, both by making some genuinely funny moments, and also by differentiating itself from the typical Hollywood cutting and pasting. Admittedly, some ideas may have been borrowed, but the way it is presented more than makes up for it. Logan Lucky is a film which takes itself seriously just enough to make completely surreal scenes somehow perfectly possible. At the back of your mind you know that it's ridiculous, but while you're watching you can't help but see that maybe this could actually happen. The plot itself is as intricate as a watch, and upon first inspection contains no obvious imperfections. And yet for all its gags, plot points and off-beat quirkiness, Logan Lucky has real heart. It's a story about a West Virginian father, brother and ex-husband, who's fallen on a rough patch but has a plan to make a few bucks.\n\nThere is another movie this could have been where he doesn't show up to his daughter's pageant, but doing so shows that this isn't a movie about criminals, but just ordinary people.","spoilers":""},{"slug":"hunt-for-the-wilderpeople-2016","title":"Hunt for the Wilderpeople","director":"Taika Waititi","year":2016,"half":8,"review":"Hunt for the Wilderpeople is an oddity, a curiosity, and a wondrous kiwi coming of age which defies what you may have been expecting from it.\n\nRicky Baker is a character labelled a bad egg, and is relocated to a new home. One thing leads to another, and before you know it Ricky is on the run with his new surrogate father. These two characters play off each other, effortlessly, made all the more entertaining by how different they are.\n\nThis movie is part off beat comedy, part fugitive on the run, part coming of age, though not in the ways you might imagine. At times it is reflective, but most of the time it is sharp dialogue, montages to old classics and breathtaking snapshots of the New Zealand wilderness.\n\nAt times the movie's pacing stagnates in places where other movies would not. But despite its occasional digressions, Hunt for the Wilderpeople remains cruising, not too slow, but not so fast that you can't pause and enjoy your surroundings.\n\nThe plot, if you could even call it that, is split into 10 chapters, which work well to postmark the different sections within the movie. Where this movie also excels is its cinematography. Taika Waititi knows he is dealing with a beautiful environment.\n\nHunt for the Wilderpeople was never going to be a groundbreaking epic, but in its own way it is undeniably a classic, a homely story beautifully told. What more can you ask for?","spoilers":""},{"slug":"the-founder-2016","title":"The Founder","director":"John Lee Hancock","year":2016,"half":8,"review":"Some movies make you think, other movies make you feel. The Founder makes you feel. At first you feel pity for Ray Kroc - a 50 something mixer salesman, who we learn has been hustling and pitching for a very long time. So, when he discovers McDonald's, a revolutionary new restaurant, he wants in. Here we feel hope that things will take a turn for the better. But the movie ain't over yet. By its conclusion Ray has bullied, extorted, stolen and cheated his way to the global success McDonalds becomes, and all we are left feeling is pure disgust, horror and a very different kind of pity. These shifts are in large part due to some truly phenomenal acting. Alongside our main characters are the two brothers he stole the original idea from, who play such wholesome yet defiant individuals, starkly watching their idea get plundered without being able to lift a finger in defence. It helps also to have a strong script, which though starting slowly initially due to some exposition dumps, picks up pace as it progresses. All this is framed by a cheerful, if slightly melancholic score, which at first works well, and then progresses as the story turns to create a great underlying dissonance. As a film, great stuff.","spoilers":""},{"slug":"the-man-from-u-n-c-l-e-2015","title":"The Man from U.N.C.L.E.","director":"Guy Ritchie","year":2015,"half":8,"review":"The Man from U.N.C.L.E. is a slightly unbelievable cold war spy movie. But what makes it so compelling and so unorthodox is its swagger. While all spy movies carry this to an extent, The Man from U.N.C.L.E. takes it even further through the use of on-the-nose scenes, such as would never appear in a straight spy flick but are happily at home here. This is true for dialogue, for cinematography, for soundtrack. It's a stylish, cool yet amusing vibe, similar to the Ocean's franchise but of its own specific and entertaining variety. Watch this movie for the joy of each moment, not for a perfect plot or realism. This is where it triumphs.","spoilers":""},{"slug":"edge-of-tomorrow-2014","title":"Edge of Tomorrow","director":"Doug Liman","year":2014,"half":8,"review":"This sci-fi action blockbuster is the perfect marriage of strong cinematic and entertainment value. A riff on Groundhog Day with an alien invasion, Edge of Tomorrow at times feels almost like a computer game - Fight, die, then restart until you reach the next level. But by grounding the plot in the main character, Cruise, there is a much stronger connection. Even better, this character has an admirably drawn out arc of character development, which is increasingly scant on the silver screen. To slowly see a man transition from an arrogant, naive narcissist to a capable soldier to a battle-hardened veteran is as absorbing as what actually happens onscreen.\n\nThere are admittedly a few beats in the third act which feel a little forced, especially plot wise, but a good job is done bringing it all together.\n\nAside from this, the other highlight of this film is the pure wizardry of the visual effects. The aliens being battled look awesome; the action sequences are all awesome; even the human soldiers look awesome.\n\nOther than looking awesome, this importantly also adds to the suspension of disbelief for the story itself. Just an epic film.","spoilers":""},{"slug":"captain-phillips-2013","title":"Captain Phillips","director":"Paul Greengrass","year":2013,"half":8,"review":"","spoilers":""},{"slug":"skyfall-2012","title":"Skyfall","director":"Sam Mendes","year":2012,"half":8,"review":"","spoilers":""},{"slug":"the-dark-knight-rises-2012","title":"The Dark Knight Rises","director":"Christopher Nolan","year":2012,"half":8,"review":"","spoilers":""},{"slug":"fantastic-mr-fox-2009","title":"Fantastic Mr. Fox","director":"Wes Anderson","year":2009,"half":8,"review":"","spoilers":""},{"slug":"the-informant-2009","title":"The Informant!","director":"Steven Soderbergh","year":2009,"half":8,"review":"","spoilers":""},{"slug":"fracture-2007","title":"Fracture","director":"Gregory Hoblit","year":2007,"half":8,"review":"","spoilers":""},{"slug":"sunshine-2007","title":"Sunshine","director":"Danny Boyle","year":2007,"half":8,"review":"","spoilers":""},{"slug":"zodiac-2007","title":"Zodiac","director":"David Fincher","year":2007,"half":8,"review":"","spoilers":""},{"slug":"the-prestige-2006","title":"The Prestige","director":"Christopher Nolan","year":2006,"half":8,"review":"'If you want to become a good magician, you've got to get your hands dirty'\n\nSecrets, lies, murder... all in the name of magic. A professional rivalry between two magicians escalates to dangerous levels.\n\nLike most Christopher Nolan movies, the plot has brain-twistingly expansive depths. Because of this, not a single second is wasted; rewatching reveals so much more and makes even more sense, especially with respect to the twists.\n\nSet against the firm foundation of its historical period, I was initially thrown by the elements of sci-fi. But, while some movies may employ elements of sci-fi for mere plot conveniences (think marvel movies), its use here was in fact integral to the plot, adding also to the underlying themes playing throughout the movie.\n\nFinally, I was a big fan of the fact that there wasn't really a good guy or a bad guy - in the end it was up to the audience to decide for themselves. The way Nolan wrote it was that the audience may initially root for Angier/The Great Danton, but by the end are instead rooting for Borden/The Professor. Or, is Angier simply a victim of what Borden wrought upon him?","spoilers":"1. Were the twins in fact cloned? To recommend Tesla to Angier, one of them must have known. If so, it would have had to have been the innocent twin, because the condemned twin should have known about the trick and wouldn't have been surprised to see Angier alive.\n\n2. When Borden's wife hangs herself, it is not in fact because her husband is having an affair, but because she somehow learns she has married two men - this is what she threatens she will tell the mistress\n\n3. At the same time as the events of the movie it is implied also that Tesla and Edison are having a similar rivalry which is also escalating\n\n4. Cutter knew from the very beginning that Borden was using a double, and was thus unsurprised when it was as if Borden was still alive\n\n5. In the climactic sequence after Angier is shot, Angier's dialogue for why they did what they did could easily be likened to Nolan's prerogative behind the movie also: 'it was the looks on their faces... The world is bleak and miserable... solid all the way through... but if just for a second you could make them wonder...'"},{"slug":"the-incredibles-2004","title":"The Incredibles","director":"Brad Bird","year":2004,"half":8,"review":"The Incredibles is a surprisingly watchable film, even, if not more so, as an adult. The Incredibles could have very easily followed a classic (a.k.a cliché) superhero arc – maybe an origin story, or a redemption story, packaged up for a child audience. Instead, the team at Pixar cooked up a completely new take on the genre, subverting almost every element, complete with undertones of postmodernism and borderline satire. One of my favourite moments of the movie, Frozone is recounting a battle with an enemy… \"And then he starts monologuing!\"\n\nWithin the first few scenes the movie is making fun of the superhero tropes, everything from people who don't need saving to property damage from their acts. And yet this then works as a stellar premise for the substance of the movie itself. Just to be clear, all this is before the boatload of Marvel and DC junk to come. Even the soundtrack is subversive and innovative, both with lively big band and jazz themes replacing the typical orchestral arrangement. Though the animation graphics are a little dated at times (though even this was an innovation for its time), the writing, voice acting, score and plot all vastly make up for it, working together to create one of the best kids' movies out there.","spoilers":""},{"slug":"oceans-eleven-2001","title":"Ocean's Eleven","director":"Steven Soderbergh","year":2001,"half":8,"review":"Ocean's Eleven is the ultimate heist movie. It is a superbly executed piece of cinema, in every way designed to entertain. Forget high art films, films designed to make you think, to feel - Ocean's Eleven just wants you to kick back and enjoy the ride. By all accounts this could have been another trashy heist flick, but it is demonstrably not. I'd say yes, the tried and true formula was used, but the supreme execution forgives any cliché. What raises Ocean's Eleven to the top is its script - stacked full of zingers and witty verbal repartee - and its star power - stacked full of magnetic personalities which bring a subtlety and personality to every scene. Clooney of course is the key factor here, but by packing such a cast there is brought a diversity and chemistry rare to films as a whole. The soundtrack is smooth and fits the vibe. Everything about this movie is smooth. Even the plot, a beast of false plays, twists and turns, is handled and presented with ease. Cinematically it is something of a magic trick, even upon rewatching. Most of all, it is so ingenious, or at least presented to be so, that it is completely believable. I'm sure there might be plot holes, but I'm so caught up in the trick that I honestly don't care.","spoilers":""},{"slug":"remember-the-titans-2000","title":"Remember the Titans","director":"Boaz Yakin","year":2000,"half":8,"review":"","spoilers":""},{"slug":"empire-of-the-sun-1987","title":"Empire of the Sun","director":"Steven Spielberg","year":1987,"half":8,"review":"","spoilers":""},{"slug":"rear-window-1954","title":"Rear Window","director":"Alfred Hitchcock","year":1954,"half":8,"review":"","spoilers":""},{"slug":"wake-up-dead-man-a-knives-out-mystery-2025","title":"Wake Up Dead Man: A Knives Out Mystery","director":"Rian Johnson","year":2025,"half":7,"review":"This third installment of mysteries tackled by Detective Benoit Blanc has the tightest mystery yet, but perhaps the least entertainment factor.\n\nI don't mean to say it isn't engaging because it definitely is. But the spark of whimsy is greatly diminished. The mystery here is everything, and it finally nails what the very best achieve, that moment of the reveal when you are not just shocked, but you kick yourself for how obvious the answer was.\n\nJosh O'Connor as the lead man here slaps. An ensemble cast, as always. A strong religious subtext adds depth. Solid stuff.","spoilers":""},{"slug":"trap-2024","title":"Trap","director":"M. Night Shyamalan","year":2024,"half":7,"review":"Trap takes a mildly interesting concept and provides some good solid entertainment. Nothing too fancy, nothing too flashy, just a popcorn-worthy movie.\n\nThe concept: what if a serial killer was caught in a trap at a concert? The twist is that you find yourself rooting for the serial killer. This is no mastermind, mind you. It's only by pure luck that he is able to manoeuvre through the trap, but that doesn't stop it from being made of pure, concentrated suspense. Violence is barely even present in this movie, though the expectation of violence certainly is. Hitchcock would be proud (there's another homage I won't mention due to spoilers). Sure, there were a few small let-downs and a few plot points which weren't fully fleshed out. But that didn't detract that much from the fun. The main character's performance was the key contributor in that respect. Initially I was convinced I was looking at the next Razzie winner - the conversation felt so forced and awkward as a stereotypical uncool Dad. But the more the movie progressed, the more I began to see the deliberateness, and thereby its brilliance.\n\nWell worth a watch, Trap has all the trappings of a perfect Friday Night Flick.","spoilers":""},{"slug":"a-haunting-in-venice-2023","title":"A Haunting in Venice","director":"Kenneth Branagh","year":2023,"half":7,"review":"","spoilers":""},{"slug":"barbie-2023","title":"Barbie","director":"Greta Gerwig","year":2023,"half":7,"review":"","spoilers":""},{"slug":"mission-impossible-dead-reckoning-part-one-2023","title":"Mission: Impossible – Dead Reckoning Part One","director":"Christopher McQuarrie","year":2023,"half":7,"review":"After numerous interpretations the Mission Impossible franchise has settled into a comfortable iteration, and not a moment too soon, with this installment being the first part of the franchise conclusion. The general formula of these movies is all the same, and the last few in particular have doubled down on pure, unadulterated action. There is enough plotting to keep us engaged, but we all know in our heart of hearts that the direction of the plot is at the whims of the creative direction of the action. They want a fight on top of a moving train? - make an exchange happen there. Want a climb out of a dangling carriage? - plant a bomb. I'm not critiquing this aspect, just noting where the beats of a scene lean, and in this respect the movie delivers. Other previous installments admittedly provided more complete packages, but as a film it does what it set out to do, both to set up the sequel and provide three hours worth of visual engagement. A broadened cast of characters also adds the appeal of novelty, with old favourites also returning to help Tom Cruise, I mean Ethan Hunt, save the world as usual. Themes of AI dystopianism and predictive behaviourism are tacked on but not explored in any great detail. In the end though we'd rather see Tom Cruise running.","spoilers":""},{"slug":"the-batman-2022","title":"The Batman","director":"Matt Reeves","year":2022,"half":7,"review":"","spoilers":""},{"slug":"dune-2021","title":"Dune","director":"Denis Villeneuve","year":2021,"half":7,"review":"","spoilers":""},{"slug":"red-notice-2021","title":"Red Notice","director":"Rawson Marshall Thurber","year":2021,"half":7,"review":"","spoilers":""},{"slug":"the-banker-2020","title":"The Banker","director":"George Nolfi","year":2020,"half":7,"review":"","spoilers":""},{"slug":"dark-waters-2019","title":"Dark Waters","director":"Todd Haynes","year":2019,"half":7,"review":"","spoilers":""},{"slug":"ford-v-ferrari-2019","title":"Ford v Ferrari","director":"James Mangold","year":2019,"half":7,"review":"","spoilers":""},{"slug":"jojo-rabbit-2019","title":"Jojo Rabbit","director":"Taika Waititi","year":2019,"half":7,"review":"Jojo Rabbit is a small firecracker of a film. It's no blockbuster, nor work of art, but decidedly a very strong film. This is a film which cracks a genre few can execute without falling into parody – that of the satire. To use dark comedy as an instrument of social commentary is a difficult trick, let alone on the subject of Nazism and anti-Semitism. To make it work, the stroke of brilliance in Jojo Rabbit is to enter Nazi Germany through the mind of a 10 year old, enrobed in a world of pure naiveté. Having Hitler as his imaginary friend worked a treat, and there are an impressive number of chucklable moments scattered throughout (the excessive Heil-ing and the 'German Shepherds' being two solid examples). And yet this film still has a serious story to tell. This is in stark contrast to most American comedies, where absurd situations are all just a part of an absurd story. Jojo Rabbit is going for something deeper here - and while it does achieve it, I can't help but wonder if it couldn't have pushed the boundaries a little further. Script, acting, cinematography, story - all of this was undeniably good, even great, but I think just a little way off perfect. Even so, this is a film which is far more original than most Hollywood output.","spoilers":""},{"slug":"dunkirk-2017","title":"Dunkirk","director":"Christopher Nolan","year":2017,"half":7,"review":"","spoilers":""},{"slug":"the-lego-batman-movie-2017","title":"The Lego Batman Movie","director":"Chris McKay","year":2017,"half":7,"review":"The Lego Batman Movie has no right being as funny as it is for a Lego-based spin on an endlessly reinvented superhero, but it is.\nAnd yet somehow it is because of this that it is made all the funnier, not in spite of it. Lego animation is almost inbuilt with whimsy, while the Batman franchise makes for some hilarious references.\nWithout watching this film you might expect some sort of action-adventure – instead what we are given is the definition of a rom-com. The 'romance' in question is more of a relationship between arch-enemies, that of Batman and The Joker.\nAnd while all the laughs are there, all the feels are there as well. Don't ask me how, but by the third act I felt as if I'd been on an emotional rollercoaster. The Lego Batman Movie is a movie which aims to subvert expectations, and in doing so has managed to produce one of the best animations of the 2010s (a decade sorely suffering under the shadow of the Pixar golden era).\n\nALL credit goes to the writer for this - absolute zingers abound, not to mention strong pacing, a decent plot and developed characters. The Lego Batman movie is worth a watch.","spoilers":""},{"slug":"the-post-2017","title":"The Post","director":"Steven Spielberg","year":2017,"half":7,"review":"","spoilers":""},{"slug":"thor-ragnarok-2017","title":"Thor: Ragnarok","director":"Taika Waititi","year":2017,"half":7,"review":"","spoilers":""},{"slug":"10-cloverfield-lane-2016","title":"10 Cloverfield Lane","director":"Dan Trachtenberg","year":2016,"half":7,"review":"This film is a showcase in tension and suspense, as befitting a true psychological thriller. Every step of the way keeps you guessing, deepening the elements of horror, and making the action far more powerful and effective. The plot follows a woman in a car crash who is taken to an underground bunker by a doomsday prepper who says it's unsafe to leave the bunker. Every moment introduces information and clues which make the audience question everything they think they know. Impressively, almost the entire movie was shot in one setting, with just three actors, and yet it is better than most thrillers.","spoilers":""},{"slug":"eye-in-the-sky-2015","title":"Eye in the Sky","director":"Gavin Hood","year":2015,"half":7,"review":"","spoilers":""},{"slug":"spotlight-2015","title":"Spotlight","director":"Tom McCarthy","year":2015,"half":7,"review":"","spoilers":""},{"slug":"steve-jobs-2015","title":"Steve Jobs","director":"Danny Boyle","year":2015,"half":7,"review":"So much to appreciate here. But first of all, this is not so much a biopic as a drama; instead of an entire account of Steve Jobs' life, this film aims to provide a portrait of Steve Jobs' character. This is achieved by following Steve backstage for three of his product launches - yes that's right; only three settings for the entire movie, which essentially form 3 acts.\n\nWhat carries this good film and allows it to cleanly pull off such a structure is Sorkin's script. The words coming out of a character's mouth are spitfire and superb. And they have to be - words like these provide just as much action as any blockbuster. More could be said on the script, but it speaks for itself. What makes it even more effective is a forceful, staggering performance from Fassbender, alongside a slew of supporting cast members. Additionally, the cinematography is highly, highly innovative, at times like nothing else I've ever really seen onscreen.\n\nEssentially what is being verbalised is also at times being visualised; on a wall, in a flashback. Put this in tandem with a bit of moving perspective and walk-and-talks and what could have been a very dry movie moves along at a rip-roaring pace.","spoilers":""},{"slug":"the-martian-2015","title":"The Martian","director":"Ridley Scott","year":2015,"half":7,"review":"","spoilers":""},{"slug":"penguins-of-madagascar-2014","title":"Penguins of Madagascar","director":"Eric Darnell & Simon J. Smith","year":2014,"half":7,"review":"This animation is a joy to watch. The script is filled to the brim with witticisms, whether puns, references or one-liners. This humour is then expressed in glossy, detail rich visuals, stylised to great effect. There is nothing groundbreaking going on here, but this is one of maybe half a dozen animations so rich in humour that it can be enjoyed equally as an adult or a child. It is a rare thing. The focus is solely and completely on entertainment, whether from moment to moment or from scene to scene. Mission accomplished.","spoilers":""},{"slug":"the-grand-budapest-hotel-2014","title":"The Grand Budapest Hotel","director":"Wes Anderson","year":2014,"half":7,"review":"","spoilers":""},{"slug":"now-you-see-me-2013","title":"Now You See Me","director":"Louis Leterrier","year":2013,"half":7,"review":"","spoilers":""},{"slug":"the-secret-life-of-walter-mitty-2013","title":"The Secret Life of Walter Mitty","director":"Ben Stiller","year":2013,"half":7,"review":"","spoilers":""},{"slug":"the-hunger-games-2012","title":"The Hunger Games","director":"Gary Ross","year":2012,"half":7,"review":"","spoilers":""},{"slug":"harry-potter-and-the-deathly-hallows-part-2-2011","title":"Harry Potter and the Deathly Hallows: Part 2","director":"David Yates","year":2011,"half":7,"review":"","spoilers":""},{"slug":"haywire-2011","title":"Haywire","director":"Steven Soderbergh","year":2011,"half":7,"review":"This martial-arts thriller is all style, no substance – but who needs substance anyway? For me it is enough to enjoy brutal, chess-like fight choreography, immersive and interesting cinematography and a smooth jazzy soundtrack behind it all.\n\nTo be fair, there is enough of a plot to keep the film together, but the focus isn’t on the plot in the first place. An impeccable ensemble cast adds to the charm, allowing an unknown leading lady to shine.\n\nSoderbergh’s fingerprints are evident in the best way possible; what he’s given us is almost an art-house thriller, a take on the genre which is as engaging as it is enjoyable.","spoilers":""},{"slug":"how-to-train-your-dragon-2010","title":"How to Train Your Dragon","director":"Dean DeBlois, Chris Sanders","year":2010,"half":7,"review":"","spoilers":""},{"slug":"megamind-2010","title":"Megamind","director":"Tom McGrath","year":2010,"half":7,"review":"","spoilers":""},{"slug":"the-kings-speech-2010","title":"The King's Speech","director":"Tom Hooper","year":2010,"half":7,"review":"","spoilers":""},{"slug":"sherlock-holmes-2009","title":"Sherlock Holmes","director":"Guy Ritchie","year":2009,"half":7,"review":"","spoilers":""},{"slug":"the-blind-side-2009","title":"The Blind Side","director":"John Lee Hancock","year":2009,"half":7,"review":"","spoilers":""},{"slug":"jumper-2008","title":"Jumper","director":"Doug Liman","year":2008,"half":7,"review":"","spoilers":""},{"slug":"slumdog-millionaire-2008","title":"Slumdog Millionaire","director":"Danny Boyle, Loveleen Tandan","year":2008,"half":7,"review":"","spoilers":""},{"slug":"oceans-thirteen-2007","title":"Ocean's Thirteen","director":"Steven Soderbergh","year":2007,"half":7,"review":"Ocean's Thirteen is another triumph, in smooth, down-to-earth, effortless filmmaking, a unique flavour which is specific to the Ocean's franchise. Again Soderbergh does well not to fall into the trap of just another heist - this is a revenge job first and foremost, but with enough moving parts to be just as engaging. The dynamic chemistry between this cast is familiar to us now, so it's refreshing to see some development here. And as always, Pitt and Clooney shine, their very presence drawing you into every scene they appear in. Admirably, the humour continues as well - the Mexican worker revolution sequence is comedic gold. Overall a strong conclusion to an outstanding franchise.","spoilers":""},{"slug":"pirates-of-the-caribbean-at-worlds-end-2007","title":"Pirates of the Caribbean: At World's End","director":"Gore Verbinski","year":2007,"half":7,"review":"","spoilers":""},{"slug":"shooter-2007","title":"Shooter","director":"Antoine Fuqua","year":2007,"half":7,"review":"","spoilers":""},{"slug":"cars-2006","title":"Cars","director":"John Lasseter, Joe Ranft","year":2006,"half":7,"review":"","spoilers":""},{"slug":"casino-royale-2006","title":"Casino Royale","director":"Martin Campbell","year":2006,"half":7,"review":"Premium entertainment. Action, romance, spies, villains, poker... what more could you ask for?\nWell for one, one of the best opening sequences in cinema. And for another, one of the most disturbing and also one of the most hilarious torture scenes you will ever witness.\nCasino Royale just hits all the right beats; the dialogue is witty without being cringy, the action captivating without being contrived, the characters likeable without being flawless. This is a James Bond flick as it should be; most importantly, individuality without being unbelievable. Though cinematically nothing groundbreaking, it more than makes up for it in entertainment value.","spoilers":""},{"slug":"deja-vu-2006","title":"Déjà Vu","director":"Carlos Alberto Gomes","year":2006,"half":7,"review":"","spoilers":""},{"slug":"pirates-of-the-caribbean-dead-mans-chest-2006","title":"Pirates of the Caribbean: Dead Man's Chest","director":"Gore Verbinski","year":2006,"half":7,"review":"","spoilers":""},{"slug":"batman-begins-2005","title":"Batman Begins","director":"Christopher Nolan","year":2005,"half":7,"review":"","spoilers":""},{"slug":"madagascar-2005","title":"Madagascar","director":"Eric Darnell & Tom McGrath","year":2005,"half":7,"review":"A childhood classic which remains as funny and entertaining as the first time I watched it. The characters are unique, the plot original, but what really makes this movie is its script. Each line is quotable to the extreme, at once equally both iconic and funny. And funny this is most definitely. From references, to raunchy statements, to even the voices of each character (Ben Stiller here is excellent), the whole thing is brimming with charm. As for characters, it doesn't get more iconic than King Julian & the penguins, let alone \"oh, sugar honey iced tea\" or \"all that, the giant pansies\". Without a doubt one of the top animations ever to be created.","spoilers":""},{"slug":"napoleon-dynamite-2004","title":"Napoleon Dynamite","director":"Jared Hess","year":2004,"half":7,"review":"","spoilers":""},{"slug":"national-treasure-2004","title":"National Treasure","director":"Jon Turteltaub","year":2004,"half":7,"review":"","spoilers":""},{"slug":"oceans-twelve-2004","title":"Ocean's Twelve","director":"Steven Soderbergh","year":2004,"half":7,"review":"Ocean's Twelve does what Ocean's Eleven did, but pulls it off in a marginally lesser way. The only real let down here is the plot convenience, though, ironically, what seem like plot conveniences are planned acts; it's just their seeming spontaneity bespeaks their integrity. Either way, despite this, the film itself is a blast - it's only really afterwards that you begin to question. But what you don't question is the magnificent casting, acting, scoring and, not least of all, scripting. What could have been a fairly thoughtless follow up is instead brimming with character and energy renewed, reinventing familiar beats into fresh takes.","spoilers":""},{"slug":"primer-2004","title":"Primer","director":"Shane Carruth","year":2004,"half":7,"review":"Primer is an indie, $7000 film about time travel, presented in a visceral and mindbending form. Even in the dialogue and action scenes, the presentation is like an overheard conversation, as the happenings progress from mundane to extraordinary.\n\nThis is a movie not for the faint hearted in the sense that at some point in the third act you will have no earthly idea what is going on. Paradoxes, causality and consequences are all explored, without a single hint of cliché. Virtually non-existent exposition leaves you figuring things out as you go along. And yet in spite of this I can only describe myself as captured in the buzz of each moment as it unfolds.","spoilers":""},{"slug":"the-terminal-2004","title":"The Terminal","director":"Steven Spielberg","year":2004,"half":7,"review":"\"We're all waiting for something.\"\n\nSubtlety is rare in Hollywood. Not so in The Terminal. The Terminal follows Viktor Navorski (Tom Hanks), who becomes stuck in a New York airport terminal after his country, Krakozhia, ceases to exist following a coup. There is not much of a plot, but that's because there doesn't need to be one; instead, The Terminal tells a story, and all we as the audience want to know is what happens next.\n\nAlthough Steven Spielberg can undoubtedly deliver massive blockbusters, what he has done here feels like a much smaller, much more relatable piece of work. Almost all of us have spent some time at an airport, and even that in itsel
